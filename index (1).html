<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task & Blocker Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .pill-card:active {
      transform: scale(0.98);
    }
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center py-6 px-4">

  <!-- Mobile Viewport Wrapper -->
  <div class="w-full max-w-sm flex flex-col justify-between min-h-[90vh]">
    
    <!-- Top Action Area -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <button onclick="toggleFilter()" id="filterBtn" class="bg-white text-gray-800 font-semibold text-xs px-4 py-2 rounded-full shadow-sm border border-gray-200/80 active:bg-gray-100 transition">
          Filter: Semua
        </button>
        <button onclick="openNewTaskModal()" class="bg-blue-600 text-white font-bold text-lg w-9 h-9 rounded-full shadow-sm flex items-center justify-center active:scale-95 transition">
          +
        </button>
      </div>

      <!-- Header Title & Counter -->
      <div class="flex items-baseline justify-between mb-4">
        <h1 class="text-3xl font-extrabold text-black tracking-tight">Progress</h1>
        <span id="taskCountBadge" class="text-xs font-bold text-gray-500 bg-gray-200/70 px-2.5 py-1 rounded-full">0 Tasks</span>
      </div>

      <!-- Task List Container -->
      <div id="taskList" class="space-y-3.5">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </div>

    <!-- Bottom Navigation Dock -->
    <div class="mt-8 bg-white/90 backdrop-blur-md rounded-full px-6 py-2.5 shadow-lg border border-gray-200/70 flex items-center justify-around sticky bottom-3">
      <button onclick="setFilter('all')" class="flex flex-col items-center text-blue-600 focus:outline-none">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg>
        <span class="text-[10px] font-bold mt-0.5">Tasks</span>
      </button>
      <button onclick="setFilter('blocked')" class="flex flex-col items-center text-gray-400 hover:text-rose-600 focus:outline-none">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4l7.53 13H4.47L12 6zm-1 5v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        <span class="text-[10px] font-medium mt-0.5">Blockers</span>
      </button>
      <button onclick="resetData()" class="flex flex-col items-center text-gray-400 hover:text-gray-700 focus:outline-none">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <span class="text-[10px] font-medium mt-0.5">Reset</span>
      </button>
    </div>

  </div>

  <!-- MODAL: Tambah Task Baru -->
  <div id="newTaskModal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">Buat Task Baru</h3>
        <button onclick="closeNewTaskModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nama Brand / Proyek</label>
          <input type="text" id="newBrand" placeholder="Misal: Lumina Beauty" class="w-full mt-1 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nama Task</label>
          <input type="text" id="newTaskName" placeholder="Misal: Setup CAPI & WA Funnel" class="w-full mt-1 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">PIC / Penanggung Jawab</label>
          <input type="text" id="newPic" placeholder="Misal: Budi Santoso" class="w-full mt-1 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Progress Awal (%): <span id="newProgressVal" class="text-blue-600">0%</span></label>
          <input type="range" id="newProgress" min="0" max="100" value="0" oninput="document.getElementById('newProgressVal').innerText = this.value + '%'" class="w-full accent-blue-600 mt-1">
        </div>
      </div>

      <div class="mt-6 flex space-x-2">
        <button onclick="closeNewTaskModal()" class="w-1/2 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold text-sm active:bg-gray-200 transition">Batal</button>
        <button onclick="saveNewTask()" class="w-1/2 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md active:bg-blue-700 transition">Simpan Task</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Update Task & Kelola Blocker -->
  <div id="updateModal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-gray-100">
      <div class="flex justify-between items-center mb-1">
        <span id="modalBrand" class="text-[11px] font-bold tracking-wider uppercase text-blue-600"></span>
        <button onclick="closeUpdateModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>
      <h3 id="modalTaskName" class="text-base font-extrabold text-gray-900 mb-4"></h3>

      <input type="hidden" id="editTaskId">

      <!-- Update Progress Slider -->
      <div class="mb-4">
        <div class="flex justify-between text-xs font-bold mb-1">
          <span class="text-gray-500">UPDATE PROGRESS</span>
          <span id="modalProgressVal" class="text-blue-600 font-extrabold">0%</span>
        </div>
        <input type="range" id="modalProgress" min="0" max="100" class="w-full accent-blue-600" oninput="document.getElementById('modalProgressVal').innerText = this.value + '%'">
      </div>

      <!-- Kelola Blocker / Support Request -->
      <div class="border-t border-gray-100 pt-3 mb-4">
        <div class="flex items-center justify-between mb-2">
          <label class="text-[11px] font-bold text-gray-600 uppercase tracking-wider flex items-center">
            Ada Blocker / Butuh Bantuan?
          </label>
          <input type="checkbox" id="modalHasBlocker" onchange="toggleBlockerInput(this.checked)" class="w-4 h-4 accent-rose-600 rounded">
        </div>

        <div id="blockerInputGroup" class="space-y-2 hidden">
          <div>
            <label class="text-[10px] font-semibold text-gray-500">Detail Kendala & Support yang Dibutuhkan:</label>
            <textarea id="modalBlockerDesc" rows="2" placeholder="Contoh: Akses BM belum dikasih klien, butuh AM follow up" class="w-full px-3 py-2 bg-rose-50/60 border border-rose-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-500 text-rose-950"></textarea>
          </div>
          <div>
            <label class="text-[10px] font-semibold text-gray-500">Tingkat Urgensi:</label>
            <select id="modalBlockerUrgency" class="w-full px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-xl text-xs">
              <option value="High">Tinggi (Stop / Menahan Delivery)</option>
              <option value="Medium">Sedang (Bisa jalan modul lain)</option>
              <option value="Low">Rendah (Butuh klarifikasi ringan)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="space-y-2">
        <button onclick="saveTaskUpdates()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-md active:bg-blue-700 transition">
          Simpan Perubahan
        </button>
        <button onclick="deleteCurrentTask()" class="w-full py-2 rounded-xl text-rose-600 font-semibold text-xs hover:bg-rose-50 transition">
          Hapus Task Ini
        </button>
      </div>

    </div>
  </div>

  <script>
    // Inisialisasi Data Default
    const defaultTasks = [
      {
        id: "tsk-1",
        brand: "Lumina Beauty",
        task: "Setup Tracking CAPI & WA",
        pic: "Budi Santoso",
        progress: 40,
        hasBlocker: true,
        blockerDesc: "Akses BM belum dikasih klien, butuh support AM",
        blockerUrgency: "High"
      },
      {
        id: "tsk-2",
        brand: "Kopi Rasa (F&B)",
        task: "Finalisasi Pitch Deck Q4",
        pic: "Siti Rahma",
        progress: 85,
        hasBlocker: false,
        blockerDesc: "",
        blockerUrgency: "Low"
      },
      {
        id: "tsk-3",
        brand: "UrbanStyle (Fashion)",
        task: "Audit Paid Ads Account",
        pic: "Budi Santoso",
        progress: 25,
        hasBlocker: true,
        blockerDesc: "Ad account restricted Meta, perlu backup account",
        blockerUrgency: "High"
      },
      {
        id: "tsk-4",
        brand: "TechNusa (SaaS)",
        task: "Kontrak Kerja Sama Klien",
        pic: "Dewi Lestari",
        progress: 100,
        hasBlocker: false,
        blockerDesc: "",
        blockerUrgency: "Low"
      }
    ];

    let currentFilter = 'all';

    function loadTasks() {
      const stored = localStorage.getItem('apple_tracker_tasks');
      if (!stored) {
        localStorage.setItem('apple_tracker_tasks', JSON.stringify(defaultTasks));
        return defaultTasks;
      }
      return JSON.parse(stored);
    }

    function saveTasks(tasks) {
      localStorage.setItem('apple_tracker_tasks', JSON.stringify(tasks));
      renderTaskList();
    }

    function renderTaskList() {
      const tasks = loadTasks();
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      let filtered = tasks;
      if (currentFilter === 'blocked') {
        filtered = tasks.filter(t => t.hasBlocker);
      }

      document.getElementById('taskCountBadge').innerText = `${filtered.length} Tasks`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm font-medium">Tidak ada task dalam kategori ini.</div>`;
        return;
      }

      filtered.forEach(item => {
        let cardBgClass = "bg-sky-100 border-sky-200";
        let fillBarClass = "bg-sky-600";
        let titleColor = item.progress > 45 ? "text-white" : "text-gray-900";
        let subColor = item.progress > 35 ? "text-sky-100" : "text-sky-950";

        if (item.hasBlocker) {
          cardBgClass = "bg-rose-100 border-rose-200";
          fillBarClass = "bg-rose-600";
          titleColor = item.progress > 45 ? "text-white" : "text-gray-900";
          subColor = item.progress > 35 ? "text-rose-100" : "text-rose-950";
        } else if (item.progress === 100) {
          cardBgClass = "bg-emerald-100 border-emerald-200";
          fillBarClass = "bg-emerald-600";
          titleColor = "text-white";
          subColor = "text-emerald-100";
        }

        const card = document.createElement('div');
        card.className = `pill-card ${cardBgClass} border`;
        card.onclick = () => openUpdateModal(item.id);

        card.innerHTML = `
          <div class="absolute inset-y-0 left-0 ${fillBarClass} rounded-2xl transition-all duration-300" style="width: ${item.progress}%;"></div>
          <div class="relative z-10 p-4">
            <div class="flex justify-between items-start">
              <span class="text-[11px] font-bold tracking-wider uppercase ${subColor}">${item.brand}</span>
              ${item.hasBlocker ? `<span class="bg-rose-700/90 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">BLOCKER</span>` : ''}
            </div>
            <div class="text-base font-bold ${titleColor} mt-0.5 leading-snug">
              ${item.task}
            </div>
            ${item.hasBlocker ? `
              <div class="mt-2 text-xs font-bold text-rose-900 bg-white/70 backdrop-blur-sm p-2 rounded-xl border border-rose-200/50">
                🚨 ${item.blockerDesc}
              </div>
            ` : ''}
            <div class="text-[11px] ${item.progress > 40 && !item.hasBlocker ? 'text-white/90' : 'text-gray-600'} font-semibold mt-2 flex justify-between">
              <span>${item.progress}% Selesai • PIC: ${item.pic}</span>
              <span class="underline text-[10px]">Klik Edit</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal Control: New Task
    function openNewTaskModal() {
      document.getElementById('newBrand').value = '';
      document.getElementById('newTaskName').value = '';
      document.getElementById('newPic').value = '';
      document.getElementById('newProgress').value = 0;
      document.getElementById('newProgressVal').innerText = '0%';
      document.getElementById('newTaskModal').classList.remove('hidden');
    }

    function closeNewTaskModal() {
      document.getElementById('newTaskModal').classList.add('hidden');
    }

    function saveNewTask() {
      const brand = document.getElementById('newBrand').value.trim();
      const task = document.getElementById('newTaskName').value.trim();
      const pic = document.getElementById('newPic').value.trim();
      const progress = parseInt(document.getElementById('newProgress').value);

      if (!brand || !task) {
        alert("Mohon isi Nama Brand dan Nama Task.");
        return;
      }

      const tasks = loadTasks();
      tasks.unshift({
        id: "tsk-" + Date.now(),
        brand,
        task,
        pic: pic || "Unassigned",
        progress,
        hasBlocker: false,
        blockerDesc: "",
        blockerUrgency: "Low"
      });

      saveTasks(tasks);
      closeNewTaskModal();
    }

    // Modal Control: Update Task & Blocker
    function openUpdateModal(taskId) {
      const tasks = loadTasks();
      const item = tasks.find(t => t.id === taskId);
      if (!item) return;

      document.getElementById('editTaskId').value = item.id;
      document.getElementById('modalBrand').innerText = item.brand;
      document.getElementById('modalTaskName').innerText = item.task;
      document.getElementById('modalProgress').value = item.progress;
      document.getElementById('modalProgressVal').innerText = item.progress + '%';

      const hasBlockerCheck = document.getElementById('modalHasBlocker');
      hasBlockerCheck.checked = !!item.hasBlocker;
      toggleBlockerInput(hasBlockerCheck.checked);

      document.getElementById('modalBlockerDesc').value = item.blockerDesc || '';
      document.getElementById('modalBlockerUrgency').value = item.blockerUrgency || 'Low';

      document.getElementById('updateModal').classList.remove('hidden');
    }

    function closeUpdateModal() {
      document.getElementById('updateModal').classList.add('hidden');
    }

    function toggleBlockerInput(show) {
      const group = document.getElementById('blockerInputGroup');
      if (show) {
        group.classList.remove('hidden');
      } else {
        group.classList.add('hidden');
      }
    }

    function saveTaskUpdates() {
      const taskId = document.getElementById('editTaskId').value;
      const tasks = loadTasks();
      const index = tasks.findIndex(t => t.id === taskId);
      if (index === -1) return;

      const progress = parseInt(document.getElementById('modalProgress').value);
      const hasBlocker = document.getElementById('modalHasBlocker').checked;
      const blockerDesc = document.getElementById('modalBlockerDesc').value.trim();
      const blockerUrgency = document.getElementById('modalBlockerUrgency').value;

      if (hasBlocker && !blockerDesc) {
        alert("Mohon isi deskripsi kendala / blocker jika dicentang.");
        return;
      }

      tasks[index].progress = progress;
      tasks[index].hasBlocker = hasBlocker;
      tasks[index].blockerDesc = hasBlocker ? blockerDesc : '';
      tasks[index].blockerUrgency = hasBlocker ? blockerUrgency : 'Low';

      saveTasks(tasks);
      closeUpdateModal();
    }

    function deleteCurrentTask() {
      if (!confirm("Hapus task ini?")) return;
      const taskId = document.getElementById('editTaskId').value;
      let tasks = loadTasks();
      tasks = tasks.filter(t => t.id !== taskId);
      saveTasks(tasks);
      closeUpdateModal();
    }

    // Filter Controls
    function setFilter(type) {
      currentFilter = type;
      document.getElementById('filterBtn').innerText = type === 'blocked' ? 'Filter: Blockers Saja' : 'Filter: Semua';
      renderTaskList();
    }

    function toggleFilter() {
      setFilter(currentFilter === 'all' ? 'blocked' : 'all');
    }

    function resetData() {
      if (confirm("Kembalikan ke data contoh awal?")) {
        localStorage.removeItem('apple_tracker_tasks');
        renderTaskList();
      }
    }

    // Initial Render
    renderTaskList();
  </script>

</body>
</html>
