<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub — Detailed Project & Deliverable Builder</title>
  <style>
    :root {
      --apple-canvas: #f3f4f8;
      --apple-card: #ffffff;
      --apple-card-subtle: #f8f9fc;
      --apple-card-inset: rgba(0, 0, 0, 0.04);
      --apple-card-hover: rgba(0, 0, 0, 0.025);
      --apple-text: #1d1d1f;
      --apple-secondary: #86868b;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-strong: rgba(0, 0, 0, 0.16);
      --apple-header: rgba(255, 255, 255, 0.88);
      --apple-glass-menu: rgba(255, 255, 255, 0.95);
      
      --apple-blue: #0071e3;
      --apple-indigo: #4f46e5;
      --apple-green: #10b981;
      --apple-red: #f43f5e;
      --apple-orange: #f97316;
      --apple-purple: #8b5cf6;
      --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);

      --sb-bg: #ffffff;
      --sb-text: #1d1d1f;
      --sb-muted: #86868b;
      --sb-hover: rgba(249, 115, 22, 0.08);
      --sb-active-card: rgba(249, 115, 22, 0.12);

      --kanban-col-bg: rgba(0, 0, 0, 0.025);
      --apple-funnel-canvas: rgba(0, 0, 0, 0.018);
    }

    .dark {
      --apple-canvas: #09090b;
      --apple-card: #18181b;
      --apple-card-subtle: #27272a;
      --apple-card-inset: rgba(255, 255, 255, 0.06);
      --apple-card-hover: rgba(255, 255, 255, 0.04);
      --apple-text: #f4f4f5;
      --apple-secondary: #a1a1aa;
      --apple-border: rgba(255, 255, 255, 0.1);
      --apple-border-strong: rgba(255, 255, 255, 0.22);
      --apple-header: rgba(24, 24, 27, 0.88);
      --apple-glass-menu: rgba(36, 36, 40, 0.96);

      --apple-blue: #38bdf8;
      --apple-indigo: #6366f1;
      --apple-green: #34d399;
      --apple-red: #fb7185;
      --apple-orange: #fb923c;
      --apple-purple: #a78bfa;

      --sb-bg: #18181b;
      --sb-text: #f4f4f5;
      --sb-muted: #a1a1aa;
      --sb-hover: rgba(255, 255, 255, 0.06);
      --sb-active-card: rgba(251, 146, 60, 0.18);

      --kanban-col-bg: rgba(255, 255, 255, 0.03);
      --apple-funnel-canvas: rgba(255, 255, 255, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      letter-spacing: -0.015em;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(134, 134, 139, 0.25); border-radius: 10px; }

    body {
      background-color: var(--apple-canvas);
      color: var(--apple-text);
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      padding: 12px;
      gap: 12px;
      position: relative;
    }

    /* NATIVE SEAMLESS INPUT STYLING */
    .live-input {
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      font: inherit;
      padding: 3px 6px;
      border-radius: 6px;
      width: 100%;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .live-input:hover {
      background: rgba(0, 113, 227, 0.06);
      border-color: var(--apple-border-strong);
    }
    .live-input:focus {
      background: var(--apple-card);
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.18);
    }

    /* BRAND VAULT DROPDOWN SELECTOR */
    .brand-vault-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 8px;
      border-radius: 20px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border-strong);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .brand-dropdown-select {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 800;
      color: var(--apple-text);
      cursor: pointer;
      outline: none;
      padding-right: 4px;
    }
    .dark .brand-dropdown-select option {
      background: #18181b;
      color: #f4f4f5;
    }

    .view-module { animation: appleViewEnter 0.2s var(--apple-spring); }
    @keyframes appleViewEnter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ANALYTICS OVERVIEW LAYOUT */
    .analytics-overview-shell {
      display: grid;
      grid-template-columns: 1fr 285px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 1180px) { .analytics-overview-shell { grid-template-columns: 1fr; } }

    .analytics-main-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .ref-kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 820px) { .ref-kpi-grid { grid-template-columns: 1fr; } }

    .ref-kpi-card {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.025);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.16s ease;
    }
    .ref-kpi-card:hover { transform: translateY(-2px); }
    .ref-kpi-top { display: flex; align-items: center; gap: 14px; }
    .ref-kpi-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #ffffff; flex-shrink: 0; }
    .ref-kpi-label { font-size: 11px; color: var(--apple-secondary); font-weight: 600; }
    .ref-kpi-val { font-size: 20px; font-weight: 800; color: var(--apple-text); font-variant-numeric: tabular-nums; margin-top: 2px; }
    .ref-kpi-bar-bg { width: 100%; height: 5px; background: var(--apple-card-inset); border-radius: 10px; overflow: hidden; }
    .ref-kpi-bar-fill { height: 100%; background: var(--apple-indigo); border-radius: 10px; transition: width 0.4s ease; }
    .ref-kpi-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--apple-indigo); }

    .ref-chart-section {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 22px;
      padding: 20px 22px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.025);
      display: grid;
      grid-template-columns: 1fr 195px;
      gap: 22px;
      align-items: center;
    }
    @media (max-width: 900px) { .ref-chart-section { grid-template-columns: 1fr; } }
    .ref-chart-meta-row { display: flex; align-items: center; gap: 36px; margin-bottom: 12px; flex-wrap: wrap; }
    .ref-meta-item span { display: block; font-size: 11px; color: var(--apple-secondary); font-weight: 600; }
    .ref-meta-item strong { font-size: 17px; font-weight: 800; color: var(--apple-text); font-variant-numeric: tabular-nums; }
    .ref-side-boxes { display: flex; flex-direction: column; gap: 10px; }
    .ref-mini-stat-box { background: var(--apple-card-subtle); border: 0.5px solid var(--apple-border); border-radius: 14px; padding: 11px 14px; display: flex; flex-direction: column; gap: 3px; }
    .ref-mini-stat-box span { font-size: 10.5px; color: var(--apple-secondary); font-weight: 600; }
    .ref-mini-stat-box strong { font-size: 15px; font-weight: 800; color: var(--apple-text); font-variant-numeric: tabular-nums; }

    .ref-bottom-split { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .ref-bottom-split { grid-template-columns: 1fr; } }
    .ref-panel-box { background: var(--apple-card); border: 0.5px solid var(--apple-border); border-radius: 22px; padding: 18px 20px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.025); display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .ref-panel-header { display: flex; align-items: center; justify-content: space-between; }
    .ref-panel-title { font-size: 14px; font-weight: 800; color: var(--apple-text); }
    .ref-customer-list { display: flex; flex-direction: column; gap: 8px; }
    .ref-customer-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 14px; background: var(--apple-card-subtle); border: 0.5px solid var(--apple-border); gap: 10px; }
    .ref-cust-avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: #ffffff; flex-shrink: 0; }
    .ref-mail-btn { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid var(--apple-border); background: var(--apple-card); color: var(--apple-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 10px; font-weight: 800; }
    .ref-mail-btn:hover { background: var(--apple-green); color: #ffffff; border-color: var(--apple-green); }

    .ref-offer-banner { background: rgba(249, 115, 22, 0.1); color: #ea580c; border-radius: 12px; padding: 10px 12px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .dark .ref-offer-banner { color: #fb923c; }

    .analytics-right-col {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.025);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }
    .ref-profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; text-align: center; padding: 12px 0; background: var(--apple-card-subtle); border-radius: 14px; border: 0.5px solid var(--apple-border); }
    .ref-profile-stats strong { display: block; font-size: 15px; font-weight: 800; color: var(--apple-text); font-variant-numeric: tabular-nums; }
    .ref-profile-stats span { font-size: 10px; color: var(--apple-secondary); font-weight: 600; }
    .ref-action-links { display: flex; flex-direction: column; gap: 8px; }
    .ref-link-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: 14px; cursor: pointer; transition: background 0.15s ease; border: 0.5px solid transparent; }
    .ref-link-row:hover { background: var(--apple-card-subtle); border-color: var(--apple-border); }
    .ref-link-left { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; }
    .ref-link-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
    .ref-gauge-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 12px; border-top: 0.5px solid var(--apple-border); }

    /* DRAG-TO-REORDER SPRINT TRACKLIST ROWS */
    .row-drag-handle {
      cursor: grab;
      color: var(--apple-secondary);
      font-weight: 800;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      user-select: none;
      background: var(--apple-card-inset);
    }
    .row-drag-handle:hover { color: var(--apple-blue); }
    .tracklist-item.drag-over-row {
      border-top: 2px solid var(--apple-blue);
      background: rgba(0, 113, 227, 0.05);
    }

    /* INLINE TARGET BENCHMARK FUNNEL BADGES */
    .funnel-leak-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      width: 96px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .leak-healthy { background: rgba(16, 185, 129, 0.12); color: var(--apple-green); border: 0.5px solid rgba(16, 185, 129, 0.3); }
    .leak-warning { background: rgba(249, 115, 22, 0.14); color: var(--apple-orange); border: 0.5px solid rgba(249, 115, 22, 0.35); }
    .leak-critical { background: rgba(244, 63, 94, 0.14); color: var(--apple-red); border: 0.5px solid rgba(244, 63, 94, 0.35); }

    /* Funnel Scaling Simulator Box */
    .funnel-simulator-card {
      background: var(--apple-card-subtle);
      border: 0.5px solid var(--apple-border-strong);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sim-slider-row { display: flex; align-items: center; gap: 14px; }
    .apple-range-slider { flex: 1; accent-color: var(--apple-blue); cursor: pointer; }
    .sim-metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 6px; border-top: 0.5px solid var(--apple-border); }
    @media (max-width: 760px) { .sim-metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    .sim-stat-box { display: flex; flex-direction: column; gap: 2px; }
    .sim-stat-box span { font-size: 9.5px; font-weight: 700; color: var(--apple-secondary); text-transform: uppercase; }
    .sim-stat-box strong { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--apple-text); }

    /* Adaptive Gantt Timeline */
    .gantt-toolbar-card {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .filter-pills-wrap { display: flex; align-items: center; gap: 6px; }
    .filter-tab-pill { font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 8px; border: none; background: transparent; color: var(--apple-secondary); cursor: pointer; }
    .filter-tab-pill.active { background: rgba(0, 113, 227, 0.12); color: var(--apple-blue); font-weight: 700; }

    .gantt-root-container {
      width: 100%;
      border-radius: 14px;
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card);
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .gantt-inner-scroll { min-width: 1060px; display: flex; flex-direction: column; }
    .gantt-row-container { display: flex; width: 100%; height: 48px; border-bottom: 0.5px solid var(--apple-border); position: relative; }
    .gantt-row-container:last-child { border-bottom: none; }
    .gantt-row-container.header-row { height: 38px; background: var(--apple-card-inset); font-size: 10.5px; font-weight: 700; color: var(--apple-secondary); }
    .gantt-left-column {
      width: 250px;
      min-width: 250px;
      max-width: 250px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 12px;
      border-right: 0.5px solid var(--apple-border);
      font-size: 11.5px;
      font-weight: 600;
      white-space:
