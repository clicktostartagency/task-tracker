<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - Apple Pro Suite</title>
  <style>
    :root {
      --apple-canvas: #f2f2f7;
      --apple-card: #ffffff;
      --apple-card-inset: rgba(0, 0, 0, 0.025);
      --apple-text: #1d1d1f;
      --apple-secondary: #86868b;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-specular: rgba(255, 255, 255, 0.9);
      --apple-sidebar: rgba(246, 246, 248, 0.88);
      --apple-header: rgba(255, 255, 255, 0.85);
      --apple-funnel-canvas: #edf5fa;
      --apple-blue: #0071e3;
      --apple-green: #34c759;
      --apple-red: #ff3b30;
      --apple-orange: #ff9500;
      --apple-purple: #af52de;
      --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --mayple-canvas: #faf8f5;
      --mayple-dark: #072a2a;
      --mayple-card: #ffffff;
      --mayple-accent: #f04d30;
      --mayple-border: rgba(0, 0, 0, 0.08);
    }
    .dark {
      --apple-canvas: #000000;
      --apple-card: #1c1c1e;
      --apple-card-inset: rgba(255, 255, 255, 0.04);
      --apple-text: #f5f5f7;
      --apple-secondary: #8e8e93;
      --apple-border: rgba(255, 255, 255, 0.12);
      --apple-border-specular: rgba(255, 255, 255, 0.12);
      --apple-sidebar: rgba(24, 24, 26, 0.88);
      --apple-header: rgba(20, 20, 22, 0.85);
      --apple-funnel-canvas: #121c26;
      --apple-blue: #2997ff;
      --mayple-canvas: #0d1717;
      --mayple-dark: #051414;
      --mayple-card: #141f1f;
      --mayple-border: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: -0.021em;
    }
    body {
      background-color: var(--apple-canvas);
      color: var(--apple-text);
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .apple-sidebar-frame {
      width: 240px;
      height: 100%;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-right: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s var(--apple-spring);
      z-index: 20;
    }
    .apple-sidebar-frame.collapsed { width: 72px; }
    .apple-sidebar-frame.collapsed .hide-collapsed { display: none !important; }

    .apple-traffic-lights {
      padding: 1.15rem 1rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .traffic-dots { display: flex; gap: 7px; }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .nav-group { padding: 0 0.5rem; display: flex; flex-direction: column; gap: 3px; }
    .apple-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .apple-nav-item:hover { background: rgba(0, 0, 0, 0.04); color: var(--apple-text); }
    .dark .apple-nav-item:hover { background: rgba(255, 255, 255, 0.06); }
    .apple-nav-item.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
      font-weight: 600;
    }
    .nav-badge {
      font-family: -apple-system, monospace;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: var(--apple-secondary);
    }
    .active .nav-badge { background: var(--apple-blue); color: #ffffff; }

    .active-team-card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .active-team-card:hover { background: rgba(0, 0, 0, 0.04); }
    .dark .active-team-card:hover { background: rgba(255, 255, 255, 0.08); }

    .apple-canvas-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--apple-canvas);
      position: relative;
    }
    .apple-navbar-header {
      height: 52px;
      background: var(--apple-header);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      flex-shrink: 0;
      z-index: 15;
    }
    .apple-canvas-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .macos-segmented-bar {
      position: relative;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      align-items: center;
      border: 0.5px solid var(--apple-border);
    }
    .dark .macos-segmented-bar { background: rgba(255, 255, 255, 0.08); }
    .seg-pill-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 3);
      background: var(--apple-card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      transition: transform 0.28s var(--apple-spring);
      z-index: 1;
    }
    .seg-btn {
      position: relative;
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      background: transparent;
      border: none;
      color: var(--apple-secondary);
      cursor: pointer;
      z-index: 2;
      transition: color 0.18s ease;
    }
    .seg-btn.active { color: var(--apple-text); }

    .apple-card-box {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 6px 18px rgba(0, 0, 0, 0.025), inset 0 1px 0 var(--apple-border-specular);
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: all 0.25s var(--apple-spring);
    }
    .sla-aura-warning {
      border-color: rgba(255, 149, 0, 0.5) !important;
      box-shadow: 0 0 16px rgba(255, 149, 0, 0.15), inset 0 1px 0 var(--apple-border-specular) !important;
    }
    .sla-aura-breach {
      border-color: rgba(255, 59, 48, 0.6) !important;
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.2), inset 0 1px 0 var(--apple-border-specular) !important;
    }

    .card-collapsible-header {
      padding: 1.2rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .card-collapsible-header:hover { background-color: rgba(0, 0, 0, 0.015); }
    .dark .card-collapsible-header:hover { background-color: rgba(255, 255, 255, 0.02); }
    .card-body-drawer {
      padding: 0 1.35rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      border-top: 0.5px solid var(--apple-border);
    }
    .card-body-drawer.collapsed { display: none !important; }
    .chevron-icon {
      width: 14px;
      height: 14px;
      color: var(--apple-secondary);
      transition: transform 0.25s var(--apple-spring);
    }
    .chevron-icon.rotate { transform: rotate(180deg); }

    .apple-pill-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card);
      color: var(--apple-text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .apple-pill-btn:hover { background: rgba(0, 0, 0, 0.03); }
    .dark .apple-pill-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .apple-btn-primary {
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--apple-blue);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .apple-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      font-family: -apple-system, monospace;
      letter-spacing: 0.04em;
    }
    .tag-scale { background: rgba(52, 199, 89, 0.12); color: var(--apple-green); border: 0.5px solid rgba(52, 199, 89, 0.25); }
    .tag-critical { background: rgba(255, 59, 48, 0.12); color: var(--apple-red); border: 0.5px solid rgba(255, 59, 48, 0.25); }
    .tag-watchlist { background: rgba(255, 149, 0, 0.12); color: var(--apple-orange); border: 0.5px solid rgba(255, 149, 0, 0.25); }

    .funnel-apple-canvas {
      background: var(--apple-funnel-canvas);
      border-radius: 18px;
      padding: 1.75rem 1.25rem;
      border: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .funnel-title-capsule {
      background: var(--apple-blue);
      color: #ffffff;
      padding: 0.45rem 1.6rem;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
      cursor: text;
      margin-bottom: 1.25rem;
    }
    .funnel-banner-tab {
      display: flex;
      align-items: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      height: 38px;
      padding: 0 1.25rem 0 1.85rem;
      clip-path: polygon(16px 0%, 100% 0%, 100% 100%, 0% 100%);
      border-radius: 0 8px 8px 0;
      transition: transform 0.18s var(--apple-spring), filter 0.18s ease;
    }
    .funnel-banner-tab:hover { filter: brightness(1.12); transform: translateX(3px); }

    .leak-pill {
      font-size: 9px;
      font-family: -apple-system, monospace;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 59, 48, 0.12);
      color: var(--apple-red);
      border: 0.5px solid rgba(255, 59, 48, 0.25);
      cursor: pointer;
      white-space: nowrap;
    }

    .apple-stepper-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 1rem;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      min-width: 80px;
    }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-family: -apple-system, monospace;
      transition: all 0.2s ease;
    }
    .step-dot.done { background: var(--apple-blue); color: #ffffff; }
    .step-dot.active { border: 2.5px solid var(--apple-blue); color: var(--apple-blue); background: var(--apple-card); }
    .step-dot.pending { background: rgba(0, 0, 0, 0.06); color: var(--apple-secondary); }
    .dark .step-dot.pending { background: rgba(255, 255, 255, 0.1); }
    .step-connector {
      flex: 1;
      height: 2px;
      margin: 0 10px;
      border-radius: 2px;
      margin-bottom: 22px;
    }
    .step-connector.active { background: var(--apple-blue); }
    .step-connector.pending { background: rgba(0, 0, 0, 0.08); }
    .dark .step-connector.pending { background: rgba(255, 255, 255, 0.12); }

    .tracklist-header {
      display: flex;
      align-items: center;
      padding: 0.55rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }
    
    .tracklist-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 12px;
      cursor: grab;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .tracklist-item.selected-row {
      background-color: rgba(0, 113, 227, 0.08) !important;
    }
    .tracklist-item.dragging {
      opacity: 0.4;
      background-color: rgba(0, 113, 227, 0.08) !important;
    }
    .tracklist-item.drag-over-indicator { border-top: 2px solid var(--apple-blue); }
    .drag-handle-grip {
      color: var(--apple-secondary);
      cursor: grab;
      margin-right: 8px;
      font-size: 12px;
      line-height: 1;
      opacity: 0.5;
    }
    .drag-handle-grip:hover { opacity: 1; }

    .apple-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #d1d1d6;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .apple-checkbox:checked { background: var(--apple-blue); border-color: var(--apple-blue); }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 7.5px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .inline-editable {
      cursor: text;
      border-radius: 4px;
      padding: 2px 5px;
      transition: background 0.15s ease;
    }
    .inline-editable:hover { background: rgba(0, 113, 227, 0.1); }
    .inline-editable:focus {
      outline: 1.5px solid var(--apple-blue);
      background: var(--apple-card);
    }

    .gantt-table { width: 100%; min-width: 740px; border-collapse: collapse; font-size: 11px; position: relative; }
    .gantt-table th, .gantt-table td { padding: 0.55rem; border-bottom: 0.5px solid var(--apple-border); }
    .gantt-grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); height: 100%; text-align: center; position: relative; }
    .gantt-col-line { border-right: 0.5px dashed var(--apple-border); }
    
    /* Today Pin Vertical Line */
    .gantt-today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc((4 / 12) * 100% + (1 / 24) * 100%);
      width: 2px;
      background: var(--apple-red);
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255, 59, 48, 0.4);
    }

    .capsule-pill {
      border-radius: 20px;
      padding: 1px 6px;
      font-size: 10px;
      font-family: -apple-system, monospace;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
      margin: 2px 0;
      position: relative;
    }
    .capsule-pink { background: rgba(219, 39, 119, 0.12); color: #be185d; border: 0.5px solid rgba(219, 39, 119, 0.25); }
    .capsule-green { background: rgba(52, 199, 89, 0.14); color: #15803d; border: 0.5px solid rgba(52, 199, 89, 0.3); }
    .capsule-brown { background: #7c2d12; color: #ffffff; border: 0.5px solid #7c2d12; }
    .capsule-dashed { border: 1.5px dashed var(--apple-purple); color: var(--apple-purple); background: transparent; }
    .capsule-blue { background: rgba(0, 113, 227, 0.12); color: var(--apple-blue); border: 0.5px solid rgba(0, 113, 227, 0.3); }
    .capsule-orange { background: rgba(255, 149, 0, 0.15); color: #d97706; border: 0.5px solid rgba(255, 149, 0, 0.35); }

    .color-swatch-trigger {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .color-popover-menu {
      position: absolute;
      top: 100%;
      left: 10px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      padding: 6px;
      display: none;
      gap: 6px;
      z-index: 50;
    }
    .color-popover-menu.active { display: flex; }
    .swatch-opt {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.15);
      transition: transform 0.1s ease;
    }
    .swatch-opt:hover { transform: scale(1.25); }

    .gantt-stepper-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.12);
      color: currentColor;
      font-weight: 800;
      font-size: 11px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .gantt-stepper-btn:hover { background: rgba(0, 0, 0, 0.25); }
    .dark .gantt-stepper-btn { background: rgba(255, 255, 255, 0.2); }
    .dark .gantt-stepper-btn:hover { background: rgba(255, 255, 255, 0.4); }

    .cap-heat-none { color: var(--apple-secondary); }
    .cap-heat-optimal { background: rgba(52, 199, 89, 0.16); color: var(--apple-green); border-radius: 4px; }
    .cap-heat-dense { background: rgba(255, 149, 0, 0.2); color: #d97706; border-radius: 4px; font-weight: 700; }
    .cap-heat-over { background: rgba(255, 59, 48, 0.35) !important; color: var(--apple-red) !important; border: 1px solid var(--apple-red) !important; border-radius: 4px; font-weight: 800; }

    .apple-dynamic-island {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(29, 29, 31, 0.95);
      backdrop-filter: blur(25px);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.32s var(--apple-spring);
      z-index: 100;
    }
    .apple-dynamic-island.active { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
    .island-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--apple-green); }

    .spotlight-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(35px) saturate(190%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 95;
    }
    .spotlight-backdrop.active { opacity: 1; pointer-events: auto; }
    .spotlight-window {
      width: 540px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--apple-border-specular);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .spotlight-input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: none;
      background: transparent;
      font-size: 16px;
      color: var(--apple-text);
      outline: none;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .spotlight-results { max-height: 280px; overflow-y: auto; padding: 0.5rem; }
    .spotlight-item {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .spotlight-item:hover { background: var(--apple-blue); color: #ffffff; }

    .apple-inspector-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-left: 0.5px solid var(--apple-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s var(--apple-spring);
      z-index: 50;
    }
    .apple-inspector-drawer.open { transform: translateX(0); }
    .inspector-header {
      padding: 1rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inspector-body {
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-size: 12px;
    }
    .inspector-block {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .countdown-urgent { color: var(--apple-red) !important; font-weight: 700 !important; }

    /* Mayple UI Elements */
    .mayple-phone-frame {
      width: 100%;
      max-width: 440px;
      background: var(--mayple-canvas);
      border-radius: 36px;
      border: 1px solid var(--mayple-border);

    let audioCtx = null;
    function playHapticTone(type = 'click') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        let freq = 1200, duration = 0.025;
        if (type === 'tab') { freq = 600; duration = 0.035; }
        if (type === 'done') { freq = 880; duration = 0.08; }
        if (type === 'leak') { freq = 340; duration = 0.09; }
        if (type === 'export') { freq = 980; duration = 0.06; }
        if (type === 'undo') { freq = 450; duration = 0.05; }

        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function formatRupiahShort(amount) {
      if (!amount) return 'Rp 0';
      if (amount >= 1000000) return 'Rp ' + (amount / 1000000).toFixed(1) + 'M';
      if (amount >= 1000) return 'Rp ' + (amount / 1000).toFixed(0) + 'K';
      return 'Rp ' + amount;
    }

    function parseNumericRupiah(str) {
      if (!str) return 0;
      let clean = String(str).toLowerCase().replace(/rp|\.|\s/g, '').replace(',', '.');
      if (clean.endsWith('m')) return (parseFloat(clean) || 0) * 1000000;
      if (clean.endsWith('k')) return (parseFloat(clean) || 0) * 1000;
      return parseFloat(clean) || 0;
    }

    function calculateTimeRemaining(deadlineISO) {
      if (!deadlineISO) return { text: "No deadline", isUrgent: false, isOverdue: false, diffHours: 999 };
      const deadline = new Date(deadlineISO).getTime();
      const now = new Date().getTime();
      const diff = deadline - now;
      const diffHours = diff / (1000 * 60 * 60);

      if (diff <= 0) return { text: "Overdue", isUrgent: true, isOverdue: true, diffHours: 0 };
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      const isUrgent = diffHours < 24;
      let text = days > 0 ? `${days}d ${hours}h ${minutes}m ${seconds}s` : `${hours}h ${minutes}m ${seconds}s`;
      return { text, isUrgent, isOverdue: false, diffHours };
    }

    function updateLiveCountdowns() {
      const countdownNodes = document.querySelectorAll('[data-deadline]');
      countdownNodes.forEach(node => {
        const isDone = node.getAttribute('data-done') === 'true';
        if (isDone) {
          node.innerText = "Completed";
          node.className = "countdown-display font-mono text-[11px] text-neutral-400";
          return;
        }
        const deadlineISO = node.getAttribute('data-deadline');
        const res = calculateTimeRemaining(deadlineISO);
        node.innerText = res.text;
        node.className = "countdown-display font-mono text-[11px] " + (res.isUrgent || res.isOverdue ? "countdown-urgent" : "text-neutral-500");
      });
    }

      const { pIdx: sourcePIdx, aIdx: sourceAIdx } = APP_STATE.draggedItem;

      APP_STATE.draggedItem = null;

    // Row selection and Quick Look handling
    function handleRowClick(e, taskId) {
      APP_STATE.focusedTaskId = taskId;
      if (e.metaKey || e.ctrlKey || e.shiftKey) {
        if (APP_STATE.selectedTaskIds.has(taskId)) {
          APP_STATE.selectedTaskIds.delete(taskId);
        } else {
          APP_STATE.selectedTaskIds.add(taskId);
        }
      } else {
        APP_STATE.selectedTaskIds.clear();
        APP_STATE.selectedTaskIds.add(taskId);
      }
      playHapticTone('click');
      renderProjectsView();
    }

    function updateBatchBar() {
      const bar = document.getElementById('batch-action-bar');
      const countLabel = document.getElementById('batch-selected-count');
      const count = APP_STATE.selectedTaskIds.size;
      if (count >= 2) {
        countLabel.innerText = `${count} tasks selected`;
        bar.classList.add('active');
      } else {
        bar.classList.remove('active');
      }
    }

    function clearBatchSelection() {
      APP_STATE.selectedTaskIds.clear();
      updateBatchBar();
      renderProjectsView();
    }

    function batchMarkDone() {
      pushToUndoHistory();
      APP_STATE.projects.forEach(p => {
        p.actions.forEach(a => {
          if (APP_STATE.selectedTaskIds.has(a.id)) a.done = true;
        });
      });
      playHapticTone('done');
      clearBatchSelection();
      syncState('Selected tasks marked as done');
    }

    function batchShiftDate(deltaDays) {
      pushToUndoHistory();
      APP_STATE.projects.forEach(p => {
        p.actions.forEach(a => {
          if (APP_STATE.selectedTaskIds.has(a.id) && a.deadlineISO) {
            const d = new Date(a.deadlineISO);
            d.setDate(d.getDate() + deltaDays);
            a.deadlineISO = d.toISOString();
            a.startCol = Math.min(11, (a.startCol || 0) + deltaDays);
          }
        });
      });
      playHapticTone('done');
      clearBatchSelection();
      syncState('Selected tasks shifted +1 day');
    }

    function batchDeleteTasks() {
      pushToUndoHistory();
      APP_STATE.projects.forEach(p => {
        p.actions = p.actions.filter(a => !APP_STATE.selectedTaskIds.has(a.id));
      });
      playHapticTone('done');
      clearBatchSelection();
      syncState('Selected tasks deleted');
    }

    function pingDeliverableWA(picName, taskName, clientName, timeLeft) {
      playHapticTone('click');
      const talent = APP_STATE.talents.find(t => t.name.toLowerCase().includes(picName.split(' ')[0].toLowerCase())) || APP_STATE.talents[0];
      const message = encodeURIComponent(`Halo ${picName}, mohon update progres untuk deliverable:\n*${taskName}* (Project: ${clientName})\nSisa Waktu: ${timeLeft}`);
      window.open(`https://wa.me/${talent.phone.replace(/[^0-9]/g, '')}?text=${message}`, '_blank');
    }

    // Smart Conflict Detection (Cek bentrok PIC pada rentang hari Gantt)
    function detectPicTaskConflicts(targetAct) {
      if (!targetAct || !targetAct.pic) return false;
      const start = targetAct.startCol || 0;
      const end = start + (targetAct.spanCol || 1);
      let count = 0;
      APP_STATE.projects.forEach(p => {
        p.actions.forEach(a => {
          if (!a.done && a.pic.toLowerCase() === targetAct.pic.toLowerCase()) {
            const aStart = a.startCol || 0;
            const aEnd = aStart + (a.spanCol || 1);
            if (Math.max(start, aStart) < Math.min(end, aEnd)) {
              count++;
            }
          }
        });
      });
      return count >= 2;
    }

                  let capClass = act.colorStyle === "green" ? "capsule-green" : act.colorStyle === "brown" ? "capsule-brown" : act.colorStyle === "dashed" ? "capsule-dashed" : act.colorStyle === "blue" ? "capsule-blue" : act.colorStyle === "orange" ? "capsule-orange" : "capsule-pink";

                            ${act.text}
                          </span>
                        </div>
                      </td>
                      <td>
                        <div style="display: flex; position: relative; align-items: center;">
                          <div style="width: ${(start / 12) * 100}%;"></div>
                          <div class="capsule-pill ${capClass}" style="width: ${(span / 12) * 100}%;">
                            <div style="display: flex; align-items: center;">
                              <span class="color-swatch-trigger" onclick="toggleColorPopover('swatch-${act.id}')" title="Ubah warna" style="background: currentColor;"></span>
                              <div id="swatch-${act.id}" class="color-popover-menu" onclick="event.stopPropagation()">
                                ${colorOptions.map(opt => `
                                  <span class="swatch-opt" style="background: ${opt.bg};" onclick="changeDeliverableColor('${act.id}', '${opt.key}')" title="${opt.key}"></span>
                                `).join('')}
                              </div>
                              <button class="gantt-stepper-btn" onclick="stepGanttSpan('${act.id}',${pIdx}, -1)" title="Kurangi durasi">-</button>
                              <button class="gantt-stepper-btn" onclick="shiftGanttSchedule('${act.id}',${pIdx}, -1)" style="margin-left: 2px;" title="Geser ke kiri 1 hari">&lt;</button>
                            </div>

                            <span style="font-size: 9px;">${span}d</span>
                            
                            <div style="display: flex; align-items: center;">
                              <button class="gantt-stepper-btn" onclick="shiftGanttSchedule('${act.id}',${pIdx}, 1)" style="margin-right: 2px;" title="Geser ke kanan 1 hari">&gt;</button>
                              <button class="gantt-stepper-btn" onclick="stepGanttSpan('${act.id}',${pIdx}, 1)" title="Tambah durasi">+</button>
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('');

    function shiftGanttSchedule(actId, pIdx, delta) {
      pushToUndoHistory();
      const act = APP_STATE.projects[pIdx].actions.find(a => a.id === actId);
      if (!act) return;
      const curStart = act.startCol || 0;
      const curSpan = act.spanCol || 1;
      const targetStart = Math.max(0, Math.min(12 - curSpan, curStart + delta));

      if (targetStart !== curStart) {
        act.startCol = targetStart;
        playHapticTone('click');
        syncState(`Rescheduled to day ${GANTT_DAYS[targetStart].d} Oct`);
      }
    }

    function filterSpotlight(query) {
      const results = document.getElementById('spotlight-results');
      const q = query.toLowerCase().trim();

      const commands = [
        { title: "Export Data to CSV", action: () => { closeSpotlight(); exportDataToCSV(); } },
        { title: "Copy Executive Performance Brief", action: () => { closeSpotlight(); copyExecutiveBrief(); } },
        { title: "Switch to Funnels View (Home)", action: () => { switchTab('home'); closeSpotlight(); } },
        { title: "Switch to Projects View (Sprint)", action: () => { switchTab('projects'); closeSpotlight(); } },
        { title: "Switch to Timeline View", action: () => { switchTab('timeline'); closeSpotlight(); } },
        { title: "Toggle Summary (Collapse All)", action: () => { toggleAllCardsCollapse(); closeSpotlight(); } },
        { title: "Toggle Dark / Light Mode", action: () => { toggleTheme(); closeSpotlight(); } }
      ];

      APP_STATE.projects.forEach((p) => {
        commands.push({
          title: `Jump to Project: ${p.clientName}`,
          action: () => { switchTab('projects'); closeSpotlight(); triggerDynamicIsland(`Focused on ${p.clientName}`); }
        });
      });

      APP_STATE.talents.forEach(t => {
        commands.push({
          title: `Open Talent Summary: ${t.name}`,
          action: () => { closeSpotlight(); openTalentProfileModal(t.id); }
        });
      });

      const filtered = commands.filter(cmd => cmd.title.toLowerCase().includes(q));

      results.innerHTML = filtered.map((cmd, idx) => `
        <div class="spotlight-item" onclick="executeSpotlight(${idx})">
          <span>${cmd.title}</span>
          <span style="font-size: 10px; opacity: 0.6; font-family: monospace;">ACTION</span>
        </div>
      `).join('') || `<div style="padding: 1rem; text-align: center; color: var(--apple-secondary); font-size: 12px;">No matching command</div>`;

      window.spotlightCurrentCommands = filtered;
    }

    function executeSpotlight(idx) {
      if (window.spotlightCurrentCommands && window.spotlightCurrentCommands[idx]) {
        window.spotlightCurrentCommands[idx].action();
      }
    }

      playHapticTone('click');
      if (actionType === 'toggle-sidebar') {
        toggleSidebar();
      } else if (actionType === 'collapse-all') {
        toggleAllCardsCollapse();
      } else if (actionType === 'toggle-fullscreen') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          triggerDynamicIsland('Entered Fullscreen');
        } else {
          document.exitFullscreen().catch(() => {});
          triggerDynamicIsland('Exited Fullscreen');
        }
      }
    }

    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      playHapticTone('tab');

      const pill = document.getElementById('segPill');
      const idx = tabId === 'home' ? 0 : tabId === 'projects' ? 1 : 2;
      pill.style.transform = `translateX(${idx * 100}%)`;

      ['home', 'projects', 'timeline'].forEach(t => {
        const view = document.getElementById('view-' + t);
        const btn = document.getElementById('tabBtn-' + t);
        const seg = document.getElementById('segBtn-' + t);
        if (view && btn) {
          if (t === tabId) {
            view.style.display = 'flex';
            btn.classList.add('active');
            if (seg) seg.classList.add('active');
          } else {
            view.style.display = 'none';
            btn.classList.remove('active');
            if (seg) seg.classList.remove('active');
          }
        }
      });
      updateLiveCountdowns();
    }

    function toggleSidebar() {
      APP_STATE.sidebarCollapsed = !APP_STATE.sidebarCollapsed;
      document.getElementById('app-sidebar').classList.toggle('collapsed', APP_STATE.sidebarCollapsed);
      playHapticTone('click');
    }

    function toggleTheme() {
      APP_STATE.isDark = !APP_STATE.isDark;
      localStorage.setItem('agency_app_dark', APP_STATE.isDark ? 'true' : 'false');
      document.documentElement.classList.toggle('dark', APP_STATE.isDark);
      playHapticTone('click');
      triggerDynamicIsland(APP_STATE.isDark ? 'Dark Mode Active' : 'Light Mode Active');
    }

    function addNewDeliverableDirect(pIdx) {
      pushToUndoHistory();
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 3);
      defaultDate.setHours(18, 0, 0, 0);

      APP_STATE.projects[pIdx].actions.push({
        id: "act-" + Date.now(),
        text: "New Sprint Deliverable",
        label: "CREATIVE",
        pic: APP_STATE.projects[pIdx].lead,
        assignedBy: "Project Lead",
        duration: "2h 30m",
        deadlineISO: defaultDate.toISOString(),
        notes: "Uraian action plan eksekusi deliverable.",
        done: false,
        startCol: 2,
        spanCol: 4,
        colorStyle: "pink"
      });

      syncState("Deliverable Added. Edit fields directly inline.");
    }

    // Keyboard Listeners (Spacebar Quick Look, Cmd+Z, Cmd+Shift+Z, Cmd+K, Esc)
    window.addEventListener('keydown', e => {
      // Spacebar: Quick Look Preview
      if (e.code === 'Space' && !e.target.isContentEditable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        const hud = document.getElementById('quicklook-hud');
        if (hud.classList.contains('active')) {
          closeQuickLook();
        } else if (APP_STATE.focusedTaskId) {
          openQuickLook(APP_STATE.focusedTaskId);
        }
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redoLastStateAction();
        else undoLastStateAction();
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSpotlight();
      }

      if (e.key === 'Escape') {
        closeSpotlight();
        closeInspector();
        closeTalentModal();
        closeQuickLook();
        clearBatchSelection();
      }
    });

    if (APP_STATE.isDark) {
      document.documentElement.classList.add('dark');
    }
    renderAllViews();
  </script>
</body>
</html>
