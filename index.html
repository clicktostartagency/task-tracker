    :root { --ios-spring: cubic-bezier(0.16, 1, 0.3, 1); }

      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(50px) saturate(220%);
      border-right: 0.5px solid rgba(0, 0, 0, 0.08);
      transition: width 0.3s var(--ios-spring), min-width 0.3s var(--ios-spring);
    }
    .dark .ios-glass-panel {
      background: rgba(24, 24, 26, 0.75);
      backdrop-filter: blur(50px) saturate(220%);

    .ios-header {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
    }
    .dark .ios-header {
      background: rgba(20, 20, 22, 0.72);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
    }

    .ios-card {
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.07);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), 0 12px 32px rgba(0, 0, 0, 0.03);
      border-radius: 22px;
      transition: transform 0.28s var(--ios-spring), box-shadow 0.28s var(--ios-spring);
    }
    .dark .ios-card {
      background: #1c1c1e;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .ios-press { transition: transform 0.18s var(--ios-spring), opacity 0.18s ease; }
    .ios-press:active { transform: scale(0.97); opacity: 0.85; }

    .ios-checkbox {
      appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid #d1d1d6;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s var(--ios-spring);
      flex-shrink: 0;
    }
    .dark .ios-checkbox { border-color: #48484a; }
    .ios-checkbox:checked { background-color: #0071e3; border-color: #0071e3; }
    .ios-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .collapsible-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s var(--ios-spring), opacity 0.25s ease, margin-top 0.25s ease;

    .collapsible-drawer.open {

    .sidebar-collapsed .center-collapsed { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }

    .dark .gantt-col-line { border-right: 0.5px dashed rgba(255, 255, 255, 0.08); }
    .gantt-col-weekend { background-color: rgba(0, 0, 0, 0.015); }
    .dark .gantt-col-weekend { background-color: rgba(255, 255, 255, 0.02); }

      top: 0;

      cursor: pointer;

    .funnel-layer-trapezoid:hover {
      transform: scale(1.02);
      filter: brightness(1.1);

    // ==========================================
    // AUDIO ENGINE & DEEP BROWN NOISE
    // ==========================================
    let audioCtx = null, brownNoiseNode = null, isNoisePlaying = false;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function toggleBrownNoise() {
      const ctx = getAudioCtx();
      const label = document.getElementById('noiseLabel'), btn = document.getElementById('noiseBtn');
      if (isNoisePlaying) {
        if (brownNoiseNode) { brownNoiseNode.stop(); brownNoiseNode.disconnect(); brownNoiseNode = null; }
        isNoisePlaying = false; label.innerText = "Brown Noise Off"; btn.classList.remove('text-ios-blue');
        showToast("Brown noise dinonaktifkan");
      } else {
        const bufferSize = 2 * ctx.sampleRate;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = output[i]; output[i] *= 3.8;
        }
        brownNoiseNode = ctx.createBufferSource(); brownNoiseNode.buffer = noiseBuffer; brownNoiseNode.loop = true;
        const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(350, ctx.currentTime);
        const gainNode = ctx.createGain(); gainNode.gain.setValueAtTime(0.045, ctx.currentTime);
        brownNoiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
        brownNoiseNode.start(); isNoisePlaying = true; label.innerText = "Deep Brown Noise On"; btn.classList.add('text-ios-blue');
        showToast("Deep Brown Noise aktif");
      }
    }
    function playTone(freq = 600, duration = 0.04) {
      try {
        const ctx = getAudioCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // POMODORO
    let pomoTimer = null, pomoRemainingSecs = 25 * 60, isPomoActive = false;
    function togglePomodoro() {
      if (isPomoActive) {
        clearInterval(pomoTimer); pomoTimer = null; isPomoActive = false;
        document.getElementById('pomoStatusDot').className = "w-1.5 h-1.5 rounded-full bg-ios-orange";
        showToast("Pomodoro dijeda");
      } else {
        isPomoActive = true;
        document.getElementById('pomoStatusDot').className = "w-1.5 h-1.5 rounded-full bg-ios-green animate-pulse";
        playTone(880, 0.1);
        pomoTimer = setInterval(() => {
          pomoRemainingSecs--; updatePomoDisplay();
          if (pomoRemainingSecs <= 0) { resetPomodoro(); playTone(523.25, 0.4); alert("Sesi Pomodoro 25 Menit Selesai."); }
        }, 1000);
        showToast("Sesi fokus Pomodoro dimulai");
      }
    }
    function resetPomodoro() {
      clearInterval(pomoTimer); pomoTimer = null; isPomoActive = false; pomoRemainingSecs = 25 * 60;
      updatePomoDisplay(); document.getElementById('pomoStatusDot').className = "w-1.5 h-1.5 rounded-full bg-ios-orange";
    }

      const m = String(Math.floor(pomoRemainingSecs / 60)).padStart(2, '0');

    function formatRupiahShort(amount) {
      if (amount >= 1000000) return `Rp ${(amount / 1000000).toFixed(1)}M`;
      if (amount >= 1000) return `Rp ${(amount / 1000).toFixed(0)}K`;
      return `Rp ${amount}`;
    }

    function parseInputAmount(inputStr) {
      if (!inputStr) return 0;
      let clean = inputStr.toLowerCase().replace(/rp|\.|\s/g, '').replace(',', '.');
      if (clean.endsWith('m')) return parseFloat(clean) * 1000000;
      if (clean.endsWith('k')) return parseFloat(clean) * 1000;
      return parseFloat(clean) || 0;
    }

    function getComputedRoas(c) {

    }

    function getClientHealthStatus(client) {
      const roasVal = client.spendNum > 0 ? (client.revenueNum / client.spendNum) : 0;
      const beRoasNum = parseFloat(client.beRoas) || 0;
      const csSlaNum = parseFloat(client.csSla) || 0;
      const hasBlocker = Boolean(client.blocker);

      if (hasBlocker || (roasVal < beRoasNum && client.spendNum > 0)) {
        return { label: "CRITICAL", badgeClass: "bg-rose-50 dark:bg-rose-950/40 text-ios-red border border-rose-200 dark:border-rose-900/50" };
      } else if (roasVal >= 4.0 && !hasBlocker && csSlaNum <= 3.0) {
        return { label: "SCALE MODE", badgeClass: "bg-emerald-50 dark:bg-emerald-950/40 text-ios-green border border-emerald-200 dark:border-emerald-900/50" };
      } else {

      }
    }

    // ==========================================
    // STEPPER PROGRESS HELPER DI TAB PROJECT
    // ==========================================
    function generateStepperHTML(actions) {
      const total = actions.length;
      const done = actions.filter(a => a.done).length;
      const pct = total ? (done / total) : 0;

      let activeStep = 1;
      if (pct >= 1.0) activeStep = 4;
      else if (pct >= 0.65) activeStep = 3;
      else if (pct >= 0.25) activeStep = 2;
      else activeStep = 1;

      const steps = [
        { num: 1, label: "Brief & Plan" },
        { num: 2, label: "Production" },
        { num: 3, label: "Review & QA" },
        { num: 4, label: "Live & Scale" }
      ];

      return `
        <div class="py-4 px-6 bg-black/[0.015] dark:bg-white/[0.02] border-b border-black/5 dark:border-white/10 flex items-center justify-center">
          <div class="flex items-center space-x-0 w-full max-w-xl">
            ${steps.map((s, idx) => {
              const isPast = s.num < activeStep;
              const isCurrent = s.num === activeStep;
              let circleStyle = isPast ? "bg-ios-blue text-white shadow-xs" : isCurrent ? "border-2 border-ios-blue text-ios-blue bg-white dark:bg-[#1c1c1e] shadow-xs" : "bg-black/10 dark:bg-white/10 text-ios-secondaryText";
              let lineStyle = (idx < steps.length - 1) ? `<div class="flex-1 h-0.5 mx-2 rounded-full transition-colors duration-300 ${s.num < activeStep ? 'bg-ios-blue' : 'bg-black/10 dark:bg-white/10'}"></div>` : "";

              return `
                <div class="flex items-center ${idx < steps.length - 1 ? 'flex-1' : ''}">
                  <div class="flex flex-col items-center flex-shrink-0">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs font-mono transition-all duration-300 ${circleStyle}">
                      ${s.num}
                    </div>
                    <span class="text-[10px] mt-1.5 font-medium whitespace-nowrap ${isCurrent ? 'font-bold text-[#1c1c1e] dark:text-white' : 'text-ios-secondaryText'}">
                      ${s.label}
                    </span>
                  </div>
                  ${lineStyle}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function switchTab(tabId) {
      State.tab = tabId; playTone(700);
      ['home', 'projects', 'kanban', 'timeline'].forEach(t => {
        const viewEl = document.getElementById(`view-${t}`);
        if (viewEl) viewEl.classList.toggle('hidden', t !== tabId);
        const btn = document.getElementById(`tab-${t}`);
        if (btn) {
          btn.className = (t === tabId)
            ? "center-collapsed w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/10 text-ios-blue font-semibold ios-press"

        }
      });
      render();
    }
    function toggleSidebar() { State.sidebar = !State.sidebar; playTone(500); document.getElementById('sidebar').classList.toggle('sidebar-collapsed', State.sidebar); }
    function toggleTheme() {
      State.dark = !State.dark; localStorage.setItem('agency_dark', State.dark);
      document.documentElement.classList.toggle('dark', State.dark);
      document.getElementById('themeBtn').innerText = State.dark ? 'LIGHT' : 'DARK'; playTone(600);

    function getCapsuleStyle(styleKey) {
      if (styleKey === 'pink') return 'bg-pink-50/80 dark:bg-pink-950/40 text-pink-700 dark:text-pink-300 border-pink-200 dark:border-pink-800';
      if (styleKey === 'green') return 'bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
      if (styleKey === 'brown') return 'bg-[#7c2d12] text-white border-[#7c2d12] font-bold';
      return 'bg-transparent text-purple-700 dark:text-purple-300 border border-dashed border-purple-400 dark:border-purple-600';
    }

    function renderKanban() {
      const cols = { todo: [], doing: [], done: [] };
      State.clients.forEach((c, cIdx) => {
        c.actions.forEach((a, aIdx) => {
          const item = { ...a, cIdx, aIdx, client: c.title };
          if (a.done) cols.done.push(item);
          else if (a.doing) cols.doing.push(item);
          else cols.todo.push(item);
        });
      });

      ['todo', 'doing', 'done'].forEach(col => {
        document.getElementById(`count-${col}`).innerText = cols[col].length;
        document.getElementById(`kanban-${col}`).innerHTML = cols[col].map(item => `
          <div class="ios-card p-3 space-y-1.5 text-xs cursor-grab ios-press" draggable="true" ondragstart="State.dragged = { cIdx: ${item.cIdx}, aIdx: ${item.aIdx} }">
            <div class="flex justify-between text-[10px] text-ios-secondaryText font-mono">
              <span class="font-semibold text-[#1c1c1e] dark:text-white">${item.client}</span>
              <span class="px-1.5 py-0.5 rounded-full bg-black/5 dark:bg-white/10">${item.pic}</span>
            </div>
            <p class="font-medium text-[#1c1c1e] dark:text-white leading-relaxed">${item.text}</p>
          </div>
        `).join('') || `<div class="p-6 text-center text-[10px] text-ios-secondaryText italic font-mono">KOSONG</div>`;
      });
    }

    function dropKanban(e, targetCol) {
      e.preventDefault();
      if (!State.dragged) return;
      const a = State.clients[State.dragged.cIdx].actions[State.dragged.aIdx];
      a.done = targetCol === 'DONE';
      a.doing = targetCol === 'DOING';
      playTone(a.done ? 800 : 500);
      State.dragged = null; saveState();
    }

    function toggleTask(cIdx, aIdx) {
      const a = State.clients[cIdx].actions[aIdx];
      a.done = !a.done;
      playTone(a.done ? 800 : 350); saveState();
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      playTone(600);
    }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function openStandup() {
      let lines = ['*DAILY STANDUP*', 'Tanggal: ' + new Date().toLocaleDateString('id-ID'), ''];
      State.clients.forEach(c => {
        const inProgress = c.actions.find(a => !a.done);
        lines.push('- ' + c.title + ': ' + (inProgress ? inProgress.text : 'Semua deliverable tuntas'));
      });
      openModal("Daily Standup Formatter", `
        <textarea id="standupBox" class="w-full h-36 p-3 rounded-2xl bg-black/[0.02] dark:bg-white/[0.04] text-xs font-mono outline-none border border-black/5 dark:border-white/10" readonly></textarea>
        <button onclick="copyStandupText()" class="w-full py-2.5 bg-ios-blue hover:bg-[#0077ed] text-white rounded-xl font-bold ios-press">Salin Teks Standup</button>
      `);
      document.getElementById('standupBox').value = lines.join('\n');
    }
    function copyStandupText() {
      navigator.clipboard.writeText(document.getElementById('standupBox').value);
      closeModal(); showToast('Standup disalin');
    }

    function openNewProjectModal() {
      openModal("Tambah Project Baru", `
        <input type="text" id="npTitle" placeholder="Nama Klien..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <input type="text" id="npPic" placeholder="Lead PIC..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <button onclick="submitNewProject()" class="w-full py-2.5 bg-[#1c1c1e] dark:bg-white dark:text-black text-white font-bold rounded-xl ios-press">Simpan Project</button>
      `);
    }
    function submitNewProject() {
      const title = document.getElementById('npTitle').value.trim();
      const pic = document.getElementById('npPic').value.trim() || 'Mike';
      if (!title) return;
      State.clients.push({
        id: "cli-" + Date.now(), title, pic, handoverSla: "2026-10-31 18:00 WIB",
        spendNum: 0, revenueNum: 0, beRoas: "2.50x", csSla: "< 3m",
        dailyCapacity: ["", "", "2", "2", "2", "2", "", "", "", "", "", ""],
        vwoFunnel: { visitors: 10000, leads: 500, mqls: 150, mqlRate: 20, opportunities: 30, oppRate: 60, closedWon: 18, customers: 4, closeRate: 22 },
        sparkTrend: [
          { day: "Sen", spend: 30, rev: 60 }, { day: "Sel", spend: 40, rev: 70 },
          { day: "Rab", spend: 50, rev: 80 }, { day: "Kam", spend: 60, rev: 85 },
          { day: "Jum", spend: 70, rev: 90 }, { day: "Sab", spend: 60, rev: 80 }, { day: "Min", spend: 50, rev: 75 }
        ],
        channelShare: { meta: 70, tiktok: 20, google: 5, direct: 5 },
        actions: [{ text: "Setup Kampanye Utama", label: "MEDIA", pic, assignedBy: "Mike (PM)", durationEst: "3h 00m", dueDateTime: "31 Oct, 18:00 WIB", done: false, startCol: 2, spanCol: 4, labelText: "2h / day for 4 days", colorStyle: "pink" }]
      });
      closeModal(); playTone(850); saveState(); showToast("Project baru ditambahkan");
    }

    function copyWA(cIdx) {
      const c = State.clients[cIdx];
      const doneList = c.actions.filter(a => a.done).map(a => '- ' + a.text).join('\n');
      const text = '*UPDATE PROYEK ' + c.title.toUpperCase() + '*\nSpend: ' + formatRupiahShort(c.spendNum) + '\nRevenue: ' + formatRupiahShort(c.revenueNum) + '\nROAS: ' + getComputedRoas(c) + ' (BE: ' + c.beRoas + ')\n\nDeliverables Selesai:\n' + (doneList || '- On progress');
      navigator.clipboard.writeText(text); playTone(800); showToast("Laporan disalin");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 1600);
    }

    function render() {
      const pics = [...new Set(State.clients.flatMap(c => c.actions.map(a => a.pic)))];
      document.getElementById('teamListUI').innerHTML = pics.map(p => `
        <div class="flex items-center space-x-2 py-1 px-1 rounded-lg text-ios-secondaryText hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
          <span class="w-4 h-4 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-[9px] font-mono font-bold">${p.charAt(0)}</span>
          <span class="hide-collapsed font-medium text-xs">${p}</span>
        </div>
      `).join('');

      if (State.tab === 'home') renderHome();
      else if (State.tab === 'projects') renderProjects();
      else if (State.tab === 'kanban') renderKanban();
      else if (State.tab === 'timeline') renderTimelineView();
    }

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
      if (e.key === 'Escape') closeModal();
      if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === '1') switchTab('home');
        if (e.key === '2') switchTab('projects');
        if (e.key === '3') switchTab('kanban');
        if (e.key === '4') switchTab('timeline');
        if (e.key.toLowerCase() === 'p') togglePomodoro();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (State.dark) document.documentElement.classList.add('dark');
      render();
    });
  </script>
</body>
</html>
