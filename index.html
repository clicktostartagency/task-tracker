<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - Apple Pro Ultra Suite</title>
  <style>
    :root {
      --apple-canvas: #f2f2f7;
      --apple-card: #ffffff;
      --apple-card-inset: rgba(0, 0, 0, 0.025);
      --apple-text: #1d1d1f;
      --apple-secondary: #86868b;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-specular: rgba(255, 255, 255, 0.9);
      --apple-sidebar: rgba(246, 246, 248, 0.88);
      --apple-header: rgba(255, 255, 255, 0.85);
      --apple-funnel-canvas: #edf5fa;
      --apple-blue: #0071e3;
      --apple-green: #34c759;
      --apple-red: #ff3b30;
      --apple-orange: #ff9500;
      --apple-purple: #af52de;
      --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --mayple-canvas: #faf8f5;
      --mayple-dark: #072a2a;
      --mayple-card: #ffffff;
      --mayple-accent: #f04d30;
      --mayple-border: rgba(0, 0, 0, 0.08);
    }
    .dark {
      --apple-canvas: #000000;
      --apple-card: #1c1c1e;
      --apple-card-inset: rgba(255, 255, 255, 0.04);
      --apple-text: #f5f5f7;
      --apple-secondary: #8e8e93;
      --apple-border: rgba(255, 255, 255, 0.12);
      --apple-border-specular: rgba(255, 255, 255, 0.12);
      --apple-sidebar: rgba(24, 24, 26, 0.88);
      --apple-header: rgba(20, 20, 22, 0.85);
      --apple-funnel-canvas: #121c26;
      --apple-blue: #2997ff;
      --mayple-canvas: #0d1717;
      --mayple-dark: #051414;
      --mayple-card: #141f1f;
      --mayple-border: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: -0.021em;
    }
    body {
      background-color: var(--apple-canvas);
      color: var(--apple-text);
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .apple-sidebar-frame {
      width: 240px;
      height: 100%;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-right: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s var(--apple-spring);
      z-index: 20;
    }
    .apple-sidebar-frame.collapsed { width: 72px; }
    .apple-sidebar-frame.collapsed .hide-collapsed { display: none !important; }

    .apple-traffic-lights {
      padding: 1.15rem 1rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .traffic-dots { display: flex; gap: 7px; }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .nav-group { padding: 0 0.5rem; display: flex; flex-direction: column; gap: 3px; }
    .apple-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .apple-nav-item:hover { background: rgba(0, 0, 0, 0.04); color: var(--apple-text); }
    .dark .apple-nav-item:hover { background: rgba(255, 255, 255, 0.06); }
    .apple-nav-item.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
      font-weight: 600;
    }
    .nav-badge {
      font-family: -apple-system, monospace;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: var(--apple-secondary);
    }
    .active .nav-badge { background: var(--apple-blue); color: #ffffff; }

    .active-team-card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .active-team-card:hover { background: rgba(0, 0, 0, 0.04); }
    .dark .active-team-card:hover { background: rgba(255, 255, 255, 0.08); }

    .apple-canvas-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--apple-canvas);
      position: relative;
    }
    .apple-navbar-header {
      height: 52px;
      background: var(--apple-header);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      flex-shrink: 0;
      z-index: 15;
    }
    .apple-canvas-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .macos-segmented-bar {
      position: relative;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      align-items: center;
      border: 0.5px solid var(--apple-border);
    }
    .dark .macos-segmented-bar { background: rgba(255, 255, 255, 0.08); }
    .seg-pill-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 3);
      background: var(--apple-card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      transition: transform 0.28s var(--apple-spring);
      z-index: 1;
    }
    .seg-btn {
      position: relative;
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      background: transparent;
      border: none;
      color: var(--apple-secondary);
      cursor: pointer;
      z-index: 2;
      transition: color 0.18s ease;
    }
    .seg-btn.active { color: var(--apple-text); }

    .apple-card-box {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 6px 18px rgba(0, 0, 0, 0.025), inset 0 1px 0 var(--apple-border-specular);
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: all 0.25s var(--apple-spring);
    }
    .sla-aura-warning {
      border-color: rgba(255, 149, 0, 0.5) !important;
      box-shadow: 0 0 16px rgba(255, 149, 0, 0.15), inset 0 1px 0 var(--apple-border-specular) !important;
    }
    .sla-aura-breach {
      border-color: rgba(255, 59, 48, 0.6) !important;
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.2), inset 0 1px 0 var(--apple-border-specular) !important;
    }

    .card-collapsible-header {
      padding: 1.15rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .card-collapsible-header:hover { background-color: rgba(0, 0, 0, 0.015); }
    .dark .card-collapsible-header:hover { background-color: rgba(255, 255, 255, 0.02); }
    
    .card-body-drawer {
      padding: 0 1.35rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      border-top: 0.5px solid var(--apple-border);
    }
    .card-body-drawer.collapsed { display: none !important; }
    .chevron-icon {
      width: 14px;
      height: 14px;
      color: var(--apple-secondary);
      transition: transform 0.25s var(--apple-spring);
    }
    .chevron-icon.rotate { transform: rotate(180deg); }

    .apple-pill-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card);
      color: var(--apple-text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .apple-pill-btn:hover { background: rgba(0, 0, 0, 0.03); }
    .dark .apple-pill-btn:hover { background: rgba(255, 255, 255, 0.08); }
    
    .apple-btn-primary {
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--apple-blue);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .apple-btn-primary:active { opacity: 0.85; }

    .apple-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      font-family: -apple-system, monospace;
      letter-spacing: 0.04em;
    }
    .tag-scale { background: rgba(52, 199, 89, 0.12); color: var(--apple-green); border: 0.5px solid rgba(52, 199, 89, 0.25); }
    .tag-critical { background: rgba(255, 59, 48, 0.12); color: var(--apple-red); border: 0.5px solid rgba(255, 59, 48, 0.25); }
    .tag-watchlist { background: rgba(255, 149, 0, 0.12); color: var(--apple-orange); border: 0.5px solid rgba(255, 149, 0, 0.25); }

    .header-client-dropdown {
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card-inset);
      font-size: 11px;
      font-weight: 600;
      color: var(--apple-blue);
      padding: 3px 8px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .inline-editable {
      cursor: text;
      border-radius: 4px;
      padding: 2px 5px;
      transition: background 0.15s ease;
    }
    .inline-editable:hover { background: rgba(0, 113, 227, 0.1); }
    .inline-editable:focus {
      outline: 1.5px solid var(--apple-blue);
      background: var(--apple-card);
    }

    .notion-breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--apple-secondary);
      padding: 0.75rem 1.35rem 0.25rem;
      font-weight: 500;
    }
    .notion-breadcrumb-item { cursor: pointer; transition: color 0.12s ease; }
    .notion-breadcrumb-item:hover { color: var(--apple-text); }
    .notion-breadcrumb-active { color: var(--apple-text); font-weight: 600; }

    .notion-properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      padding: 0.5rem 1.35rem 0.85rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 11px;
    }
    .notion-prop-cell { display: flex; flex-direction: column; gap: 2px; }
    .notion-prop-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }

    .apple-stepper-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      min-width: 80px;
    }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-family: -apple-system, monospace;
      transition: all 0.2s ease;
    }
    .step-dot.done { background: var(--apple-blue); color: #ffffff; }
    .step-dot.active { border: 2.5px solid var(--apple-blue); color: var(--apple-blue); background: var(--apple-card); }
    .step-dot.pending { background: rgba(0, 0, 0, 0.06); color: var(--apple-secondary); }
    .dark .step-dot.pending { background: rgba(255, 255, 255, 0.1); }
    
    .step-connector {
      flex: 1;
      height: 2px;
      margin: 0 10px;
      border-radius: 2px;
      margin-bottom: 22px;
    }
    .step-connector.active { background: var(--apple-blue); }
    .step-connector.pending { background: rgba(0, 0, 0, 0.08); }
    .dark .step-connector.pending { background: rgba(255, 255, 255, 0.12); }

    .tracklist-header {
      display: flex;
      align-items: center;
      padding: 0.55rem 1.35rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }
    
    .tracklist-item {
      display: flex;
      align-items: center;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 12px;
      padding: 0.75rem 1.35rem;
      cursor: grab;
      transition: background-color 0.15s ease;
      position: relative;
    }
    .tracklist-item.selected-row { background-color: rgba(0, 113, 227, 0.08) !important; }
    .tracklist-item.dragging { opacity: 0.4; background-color: rgba(0, 113, 227, 0.08) !important; }
    .tracklist-item.drag-over-indicator { border-top: 2px solid var(--apple-blue); }
    
    .drag-handle-grip {
      color: var(--apple-secondary);
      cursor: grab;
      margin-right: 8px;
      font-size: 12px;
      line-height: 1;
      opacity: 0.5;
    }
    .drag-handle-grip:hover { opacity: 1; }

    .apple-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #d1d1d6;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .apple-checkbox:checked { background: var(--apple-blue); border-color: var(--apple-blue); }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 7.5px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .smart-filter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 14px;
      padding: 8px 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-pills-wrap { display: flex; align-items: center; gap: 6px; }
    .filter-tab-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-tab-pill.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
    }
    .smart-search-input {
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card-inset);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--apple-text);
      outline: none;
      width: 160px;
    }

    .pic-filter-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pic-filter-avatar:hover { transform: scale(1.15); }
    .pic-filter-avatar.active {
      border-color: var(--apple-blue);
      box-shadow: 0 0 8px rgba(0, 113, 227, 0.4);
    }

    .sla-progress-ring-container {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sla-progress-ring-container svg {
      transform: rotate(-90deg);
      width: 26px;
      height: 26px;
    }
    .sla-progress-ring-circle-bg {
      fill: none;
      stroke: var(--apple-border);
      stroke-width: 3;
    }
    .sla-progress-ring-circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s ease, stroke 0.35s ease;
    }

    .project-creator-card {
      background: var(--apple-card);
      border: 1px dashed var(--apple-blue);
      border-radius: 18px;
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.05);
    }
    .creator-input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .creator-field {
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card-inset);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--apple-text);
      outline: none;
    }
    .creator-field:focus { border-color: var(--apple-blue); }

    .gantt-table { width: 100%; min-width: 740px; border-collapse: collapse; font-size: 11px; position: relative; }
    .gantt-table th, .gantt-table td { padding: 0.55rem; border-bottom: 0.5px solid var(--apple-border); }
    .gantt-grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); height: 100%; text-align: center; position: relative; }
    .gantt-col-line { border-right: 0.5px dashed var(--apple-border); }
    
    .gantt-today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc((4 / 12) * 100% + (1 / 24) * 100%);
      width: 2px;
      background: var(--apple-red);
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255, 59, 48, 0.4);
    }

    .capsule-pill {
      border-radius: 20px;
      padding: 1px 6px;
      font-size: 10px;
      font-family: -apple-system, monospace;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
      margin: 2px 0;
      position: relative;
    }
    .capsule-pink { background: rgba(219, 39, 119, 0.12); color: #be185d; border: 0.5px solid rgba(219, 39, 119, 0.25); }
    .capsule-green { background: rgba(52, 199, 89, 0.14); color: #15803d; border: 0.5px solid rgba(52, 199, 89, 0.3); }
    .capsule-brown { background: #7c2d12; color: #ffffff; border: 0.5px solid #7c2d12; }
    .capsule-dashed { border: 1.5px dashed var(--apple-purple); color: var(--apple-purple); background: transparent; }
    .capsule-blue { background: rgba(0, 113, 227, 0.12); color: var(--apple-blue); border: 0.5px solid rgba(0, 113, 227, 0.3); }
    .capsule-orange { background: rgba(255, 149, 0, 0.15); color: #d97706; border: 0.5px solid rgba(255, 149, 0, 0.35); }

    .color-swatch-trigger {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .color-popover-menu {
      position: absolute;
      top: 100%;
      left: 10px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      padding: 6px;
      display: none;
      gap: 6px;
      z-index: 50;
    }
    .color-popover-menu.active { display: flex; }
    .swatch-opt {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.15);
      transition: transform 0.1s ease;
    }
    .swatch-opt:hover { transform: scale(1.25); }

    .gantt-stepper-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.12);
      color: currentColor;
      font-weight: 800;
      font-size: 11px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .gantt-stepper-btn:hover { background: rgba(0, 0, 0, 0.25); }

    .cap-heat-none { color: var(--apple-secondary); }
    .cap-heat-optimal { background: rgba(52, 199, 89, 0.16); color: var(--apple-green); border-radius: 4px; }
    .cap-heat-dense { background: rgba(255, 149, 0, 0.2); color: #d97706; border-radius: 4px; font-weight: 700; }
    .cap-heat-over { background: rgba(255, 59, 48, 0.35) !important; color: var(--apple-red) !important; border: 1px solid var(--apple-red) !important; border-radius: 4px; font-weight: 800; }

    .notion-slash-menu {
      position: absolute;
      top: 100%;
      left: 36px;
      width: 220px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 60;
    }
    .notion-slash-menu.active { display: flex; }
    .slash-menu-item {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--apple-text);
      transition: background 0.1s ease;
    }
    .slash-menu-item:hover { background: var(--apple-blue); color: #ffffff; }

    .floating-batch-bar {
      position: fixed;
      bottom: 24px;

    let audioCtx = null;
    function playAppleSound(type = 'click') {
      if (APP_STATE.isMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 'tab' || type === 'switch') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.035);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === 'done') {
          [880, 1320].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (idx * 0.04));
            gain.gain.setValueAtTime(0.15, now + (idx * 0.04));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.04) + 0.14);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + (idx * 0.04));
            osc.stop(now + (idx * 0.04) + 0.14);
          });
        } else if (type === 'delete') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {}
    }

    function formatRupiahShort(amount) {
      if (!amount) return 'Rp 0';
      if (amount >= 1000000) return 'Rp ' + (amount / 1000000).toFixed(1) + 'M';
      if (amount >= 1000) return 'Rp ' + (amount / 1000).toFixed(0) + 'K';
      return 'Rp ' + amount;
    }

    function parseNumericRupiah(str) {
      if (!str) return 0;
      let clean = String(str).toLowerCase().replace(/rp|\.|\s/g, '').replace(',', '.');
      if (clean.endsWith('m')) return (parseFloat(clean) || 0) * 1000000;
      if (clean.endsWith('k')) return (parseFloat(clean) || 0) * 1000;
      return parseFloat(clean) || 0;
    }

    function calculateTimeRemaining(deadlineISO) {
      if (!deadlineISO) return { text: "No deadline", isUrgent: false, isOverdue: false, diffHours: 999 };
      const diff = new Date(deadlineISO).getTime() - Date.now();
      const diffHours = diff / (1000 * 60 * 60);

      if (diff <= 0) return { text: "Overdue", isUrgent: true, isOverdue: true, diffHours: 0 };
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const isUrgent = diffHours < 24;
      let text = days > 0 ? `${days}d ${hours}h left` : `${hours}h left`;
      return { text, isUrgent, isOverdue: false, diffHours };
    }

    function getCapacityHeatClass(hoursVal) {
      const h = parseFloat(hoursVal) || 0;
      if (h === 0) return 'cap-heat-none';
      if (h <= 4.5) return 'cap-heat-optimal';
      if (h <= 7.0) return 'cap-heat-dense';
      return 'cap-heat-over';
    }

    function getSlaRingStatus(slaISO) {
      if (!slaISO) return { color: "var(--apple-green)", text: "Normal" };
      const diff = new Date(slaISO).getTime() - Date.now();
      const hours = diff / (1000 * 60 * 60);
      if (hours <= 0) return { color: "var(--apple-red)", text: "SLA Breached" };
      if (hours <= 48) return { color: "var(--apple-orange)", text: "Due Soon (<48h)" };
      return { color: "var(--apple-green)", text: "On Track" };
    }

    // Handlers & Mutators
    function handleTaskTextInput(e, pIdx, aIdx) {
      const text = e.target.innerText;
      const menu = document.getElementById(`slash-menu-${pIdx}-${aIdx}`);
      if (!menu) return;
      if (text.includes('/')) menu.classList.add('active');
      else menu.classList.remove('active');
    }

    function applySlashCommand(pIdx, aIdx, cmd) {
      const act = APP_STATE.projects[pIdx].actions[aIdx];
      const menu = document.getElementById(`slash-menu-${pIdx}-${aIdx}`);
      if (menu) menu.classList.remove('active');
      act.text = act.text.replace(/\/[a-zA-Z]*/g, '').trim() || act.text;

      if (cmd === 'DONE') { act.done = true; playAppleSound('done'); }
      else if (cmd === 'MEDIA') { act.label = 'MEDIA'; playAppleSound('click'); }
      else if (cmd === 'CREATIVE') { act.label = 'CREATIVE'; playAppleSound('click'); }
      act.unread = false;
      syncState(`Slash command /${cmd.toLowerCase()} applied`);
    }

    function commitProjectClientName(pIdx, newName) {
      const clean = newName.trim();
      if (!clean) return;
      pushToUndoHistory();
      APP_STATE.projects[pIdx].clientName = clean;
      if (!APP_STATE.clientList.includes(clean)) APP_STATE.clientList.push(clean);
      playAppleSound('click');
      syncState(`Project renamed to ${clean}`);
    }

        pushToUndoHistory();

        syncState(`Client set to ${val}`);

      pushToUndoHistory();
      const act = APP_STATE.projects[pIdx].actions.find(a => a.id === actId);
      if (!act) return;
      act.spanCol = Math.max(1, Math.min(12 - (act.startCol || 0), (act.spanCol || 1) + delta));
      playAppleSound('click');
      syncState(`Duration set to ${act.spanCol} days`);
    }

      APP_STATE.projects.forEach(p => {

      APP_STATE.draggedItem = { pIdx, aIdx };
      e.currentTarget.classList.add('dragging');
      playAppleSound('click');
    }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over-indicator'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over-indicator'); }
    function handleDrop(e, targetPIdx, targetAIdx) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-indicator');
      if (!APP_STATE.draggedItem) return;
      const { pIdx: sPIdx, aIdx: sAIdx } = APP_STATE.draggedItem;
      if (sPIdx === targetPIdx && sAIdx !== targetAIdx) {
        pushToUndoHistory();
        const list = APP_STATE.projects[sPIdx].actions;
        const [moved] = list.splice(sAIdx, 1);
        list.splice(targetAIdx, 0, moved);
        playAppleSound('done');
        syncState('Task Reordered');
      }
      APP_STATE.draggedItem = null;
    }
    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.tracklist-item').forEach(el => el.classList.remove('drag-over-indicator'));
    }

    function closeTalentModal() {
      document.getElementById('talent-sheet-modal').classList.remove('active');
      playAppleSound('click');
    }
    function closeTalentModalOnOutside(e) {
      if (e.target.id === 'talent-sheet-modal') closeTalentModal();
    }
    function renderTalentSheetContent() {
      const phoneLeft = document.getElementById('talent-phone-container');
      const phoneRight = document.getElementById('talent-todo-container');
      if (!phoneLeft || !phoneRight) return;

      const talent = APP_STATE.talents.find(t => t.id === APP_STATE.activeTalentId) || APP_STATE.talents[0];
      const firstName = talent.name.split(' ')[0].toLowerCase();

      let talentTasks = [];
      APP_STATE.projects.forEach((p, pIdx) => {
        p.actions.forEach((a, aIdx) => {
          if ((a.pic || '').toLowerCase().includes(firstName)) {
            talentTasks.push({ ...a, clientTitle: p.clientName, pIdx, aIdx });
          }
        });
      });

      const total = talentTasks.length;
      const done = talentTasks.filter(t => t.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;

      phoneLeft.innerHTML = `
        <div class="mayple-phone-header">
          <div class="mayple-logo-mark"><span class="mayple-logo-bars">=</span>agency</div>
          <select onchange="openTalentProfileModal(this.value)" style="border: 0.5px solid var(--mayple-border); background: var(--mayple-card); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 20px; outline: none;">
            ${APP_STATE.talents.map(t => `<option value="${t.id}" ${t.id === talent.id ? 'selected' : ''}>${t.name.split(' ')[0]}</option>`).join('')}
          </select>
        </div>

        <div class="mayple-headline">Vetted Performance Marketing Specialist</div>

        <div class="mayple-avatar-hero">
          <div class="mayple-hero-cutout"></div>
          <svg class="mayple-hero-portrait" viewBox="0 0 200 240" fill="none">
            <circle cx="100" cy="95" r="50" fill="${talent.avatarSvgColor}"/>
            <circle cx="86" cy="92" r="14" stroke="#1d1d1f" stroke-width="3" fill="none"/>
            <circle cx="114" cy="92" r="14" stroke="#1d1d1f" stroke-width="3" fill="none"/>
            <path d="M 88 116 Q 100 126 112 116" stroke="#1d1d1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M 50 240 C 50 170 150 170 150 240 Z" fill="#1c2c36"/>
          </svg>
        </div>

        <div class="mayple-info-card">
          <div class="mayple-title-bar">
            <div>
              <h2 style="font-size: 18px; font-weight: 800; color: var(--apple-text);">${talent.name}</h2>
              <div style="font-size: 11px; color: var(--apple-secondary); margin-top: 3px;">Rating <b>${talent.rating}</b> ★★★★★ (${talent.reviewsCount} reviews)</div>
            </div>
            <button onclick="window.open('https://wa.me/${talent.phone.replace(/[^0-9]/g, '')}', '_blank')" class="mayple-action-btn-circle" title="Chat WA">+</button>
          </div>
          <p style="font-size: 11px; color: var(--apple-secondary); line-height: 1.45;">${talent.bio}</p>
          <div class="mayple-matrix-grid">
            <div class="mayple-matrix-col"><span class="mayple-matrix-label">EXPERTISE</span><span class="mayple-matrix-value">${talent.expertise}</span></div>
            <div class="mayple-matrix-col"><span class="mayple-matrix-label">SALES GROWTH</span><span class="mayple-matrix-value" style="color: var(--apple-green); font-weight: 800;">${talent.avgSalesGrowth}</span></div>
          </div>
        </div>
      `;

      phoneRight.innerHTML = `
        <div class="mayple-phone-header">
          <div class="mayple-logo-mark"><span class="mayple-logo-bars">=</span>tasks</div>
          <span style="font-size: 11px; font-weight: 700; color: var(--apple-secondary); font-family: monospace;">${done}/${total} DONE</span>
        </div>
        <div class="mayple-headline" style="padding-bottom: 0.5rem;">Sprint deliverables queue</div>
        <div style="padding: 0 1.4rem 1rem;">
          <div class="workload-gauge"><div style="width: ${pct}%; background: var(--apple-green); height: 100%;"></div></div>
        </div>
        <div style="padding: 0 1.4rem; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto;">
          ${talentTasks.map(task => `
            <div style="background: var(--mayple-canvas); border: 0.5px solid var(--mayple-border); border-radius: 14px; padding: 0.85rem; display: flex; align-items: flex-start; gap: 10px;">
              <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleProjectTaskDone(${task.pIdx},${task.aIdx})" class="apple-checkbox">
              <div style="flex: 1;">
                <div style="font-size: 12px; font-weight: 600; ${task.done ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${task.text}</div>
                <div style="font-size: 10px; color: var(--apple-secondary); font-family: monospace;">${task.clientTitle} &bull; ${task.duration || '2h'}</div>
              </div>
            </div>
          `).join('') || `<div style="text-align: center; color: var(--apple-secondary); font-size: 12px; padding: 2rem;">Tidak ada deliverable aktif untuk ${talent.name}.</div>`}
        </div>
      `;
    }

    // Export Suite
    function copyExecutiveBrief() {
      playAppleSound('click');
      let lines = [
        `# EXECUTIVE PERFORMANCE BRIEF - ${new Date().toLocaleDateString('id-ID')}`,
        `----------------------------------------`
      ];
      APP_STATE.homeClients.forEach(c => {
        const roas = c.spendNum > 0 ? (c.revenueNum / c.spendNum).toFixed(2) : "0.00";
        lines.push(`• Client: ${c.title} | Spend: ${formatRupiahShort(c.spendNum)} | Rev: ${formatRupiahShort(c.revenueNum)} | ROAS: ${roas}x`);
      });
      navigator.clipboard.writeText(lines.join('\n'));
      triggerDynamicIsland("Executive Brief Copied");
    }

    function exportDataToCSV() {
      playAppleSound('click');
      let rows = [["Client", "Task", "Duration", "PIC", "Status"].join(",")];
      APP_STATE.projects.forEach(p => p.actions.forEach(a => {
        rows.push([`"${p.clientName}"`, `"${a.text}"`, `"${a.duration || '2h'}"`, `"${a.pic}"`, a.done ? "Done" : "Pending"].join(","));
      }));
      const blob = new Blob([rows.join("\n")], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Agency_Ops_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      triggerDynamicIsland("CSV Exported");
    }

    // View Navigation
    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      playAppleSound('tab');
      const pill = document.getElementById('segPill');
      const idx = tabId === 'projects' ? 0 : tabId === 'home' ? 1 : 2;
      pill.style.transform = `translateX(${idx * 100}%)`;

      ['projects', 'home', 'timeline'].forEach(t => {
        const view = document.getElementById('view-' + t);
        const btn = document.getElementById('tabBtn-' + t);
        const seg = document.getElementById('segBtn-' + t);
        if (view && btn) {
          if (t === tabId) {
            view.style.display = 'flex';
            btn.classList.add('active');
            if (seg) seg.classList.add('active');
          } else {
            view.style.display = 'none';
            btn.classList.remove('active');
            if (seg) seg.classList.remove('active');
          }
        }
      });
    }

    function toggleSidebar() {
      APP_STATE.sidebarCollapsed = !APP_STATE.sidebarCollapsed;
      document.getElementById('app-sidebar').classList.toggle('collapsed', APP_STATE.sidebarCollapsed);
      playAppleSound('click');
    }

    function toggleTheme() {
      APP_STATE.isDark = !APP_STATE.isDark;
      localStorage.setItem('agency_app_dark', APP_STATE.isDark ? 'true' : 'false');
      document.documentElement.classList.toggle('dark', APP_STATE.isDark);
      playAppleSound('switch');
    }

    function toggleFullscreen() {
      playAppleSound('click');
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }

    // Global Key Listener (Spacebar Quick Look & Undo/Redo)
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.target.isContentEditable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        const hud = document.getElementById('quicklook-hud');
        if (hud && hud.classList.contains('active')) closeQuickLook();
        else if (APP_STATE.focusedTaskId) openQuickLook(APP_STATE.focusedTaskId);
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redoLastStateAction();
        else undoLastStateAction();
      }

      if (e.key === 'Escape') {
        closeTalentModal();
        closeQuickLook();
        clearBatchSelection();
      }
    });

    window.addEventListener('click', e => {
      if (!e.target.closest('.color-swatch-trigger') && !e.target.closest('.color-popover-menu')) {
        document.querySelectorAll('.color-popover-menu').forEach(el => el.classList.remove('active'));
      }
      if (!e.target.closest('.notion-slash-menu')) {
        document.querySelectorAll('.notion-slash-menu').forEach(menu => menu.classList.remove('active'));
      }
    });

    if (APP_STATE.isDark) document.documentElement.classList.add('dark');
    if (APP_STATE.isMuted) {
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.innerText = 'Sound: OFF';
    }

    renderAllViews();
  </script>
</body>
</html>
