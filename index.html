    :root { --spring: cubic-bezier(0.32, 0.72, 0, 1); }
    * { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif !important; letter-spacing: -0.019em; }

    body { background-color: #f5f5f7; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
    .dark body { background-color: #000000; color: #f5f5f7; }

    .macos-sidebar {
      background: rgba(246, 246, 248, 0.82);
      backdrop-filter: blur(40px) saturate(210%);
      transition: width 0.25s var(--spring), min-width 0.25s var(--spring);
    }
    .dark .macos-sidebar {
      background: rgba(28, 28, 30, 0.82);
      backdrop-filter: blur(40px) saturate(210%);

      background: rgba(255, 255, 255, 0.8);

    .apple-press { transition: transform 0.15s var(--spring), opacity 0.15s ease; }
    .apple-press:active { transform: scale(0.97); opacity: 0.82; }

    .apple-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #d1d1d6;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;

    .dark .apple-checkbox { border-color: #48484a; }
    .apple-checkbox:checked { background-color: #0071e3; border-color: #0071e3; }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 7.5px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .collapsible-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s var(--spring), opacity 0.25s ease, margin-top 0.25s ease;

      top: 0;
      bottom: 0;
      width: 1.5px;
      background-color: #ff3b30;
      z-index: 10;
      pointer-events: none;

    // ==========================================
    // AUDIO ENGINE & DEEP BROWN NOISE
    // ==========================================
    let audioCtx = null;
    let brownNoiseNode = null;
    let isNoisePlaying = false;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleBrownNoise() {
      const ctx = getAudioCtx();
      const label = document.getElementById('noiseLabel');
      const btn = document.getElementById('noiseBtn');

      if (isNoisePlaying) {
        if (brownNoiseNode) {
          brownNoiseNode.stop();
          brownNoiseNode.disconnect();
          brownNoiseNode = null;
        }
        isNoisePlaying = false;
        label.innerText = "Brown Noise Off";
        btn.classList.remove('text-apple-blue', 'border-apple-blue/40');
        showToast("Brown noise dinonaktifkan");
      } else {
        const bufferSize = 2 * ctx.sampleRate;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.8;
        }

        brownNoiseNode = ctx.createBufferSource();
        brownNoiseNode.buffer = noiseBuffer;
        brownNoiseNode.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(350, ctx.currentTime);

        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.045, ctx.currentTime);

        brownNoiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        brownNoiseNode.start();
        isNoisePlaying = true;
        label.innerText = "Deep Brown Noise On";
        btn.classList.add('text-apple-blue', 'border-apple-blue/40');
        showToast("Deep Brown Noise aktif");
      }
    }

    function playTone(freq = 600, duration = 0.04) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

        document.getElementById('pomoStatusDot').className = "w-1.5 h-1.5 rounded-full bg-apple-orange";
        showToast("Pomodoro dijeda");

        document.getElementById('pomoStatusDot').className = "w-1.5 h-1.5 rounded-full bg-apple-green animate-pulse";

        pomoTimer = setInterval(() => {
          pomoRemainingSecs--;
          updatePomoDisplay();
          if (pomoRemainingSecs <= 0) {
            resetPomodoro();
            playTone(523.25, 0.4);
            alert("🎉 Sesi Pomodoro 25 Menit Selesai!");
          }

        showToast("Sesi fokus Pomodoro dimulai");

      clearInterval(pomoTimer);

    function formatRupiahShort(amount) {
      if (amount >= 1000000) return `Rp ${(amount / 1000000).toFixed(1)}M`;
      if (amount >= 1000) return `Rp ${(amount / 1000).toFixed(0)}K`;
      return `Rp ${amount}`;
    }

    function parseInputAmount(inputStr) {
      if (!inputStr) return 0;
      let clean = inputStr.toLowerCase().replace(/rp|\.|\s/g, '').replace(',', '.');
      if (clean.endsWith('m')) return parseFloat(clean) * 1000000;
      if (clean.endsWith('k')) return parseFloat(clean) * 1000;
      return parseFloat(clean) || 0;
    }

    function getComputedRoas(c) {
      if (!c.spendNum || c.spendNum <= 0) return "0.00x";
      return `${(c.revenueNum / c.spendNum).toFixed(2)}x`;
    }

    function getClientHealthStatus(client) {
      const roasVal = client.spendNum > 0 ? (client.revenueNum / client.spendNum) : 0;
      const beRoasNum = parseFloat(client.beRoas) || 0;
      const csSlaNum = parseFloat(client.csSla) || 0;
      const hasBlocker = Boolean(client.blocker);

      if (hasBlocker || (roasVal < beRoasNum && client.spendNum > 0)) {
        return {
          label: "CRITICAL",
          badgeClass: "bg-rose-50 dark:bg-rose-950/40 text-apple-red border border-rose-200 dark:border-rose-900/50"
        };
      } else if (roasVal >= 4.0 && !hasBlocker && csSlaNum <= 3.0) {
        return {
          label: "SCALE MODE",
          badgeClass: "bg-emerald-50 dark:bg-emerald-950/40 text-apple-green border border-emerald-200 dark:border-emerald-900/50"
        };
      } else {
        return {
          label: "WATCHLIST",
          badgeClass: "bg-amber-50 dark:bg-amber-950/40 text-apple-orange border border-amber-200 dark:border-amber-900/50"
        };
      }
    }

    function diagnoseFunnelLeaks(f) {
      const issues = [];
      if (f.hookRate < 30) issues.push("Aware");
      if (f.cpic > 7500) issues.push("Consider");
      if (f.cr < 18) issues.push("Convert");
      if (f.rpr < 20) issues.push("Retain");

      if (issues.length === 0) {
        return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/40 text-apple-green border border-emerald-200 dark:border-emerald-800">Funnel Healthy</span>`;
      }
      return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-50 dark:bg-rose-950/40 text-apple-red border border-rose-200 dark:border-rose-800">Leakage: ${issues.join(', ')}</span>`;
    }

    function submitDmUpdate(cIdx) {
      const client = State.clients[cIdx];
      const mode = document.querySelector('input[name="dmMode"]:checked').value;
      const spendInput = document.getElementById('dmInputSpend').value.trim();
      const revenueInput = document.getElementById('dmInputRevenue').value.trim();

      const spendVal = parseInputAmount(spendInput);
      const revenueVal = parseInputAmount(revenueInput);

      if (mode === 'ADD') {
        client.spendNum += spendVal;
        client.revenueNum += revenueVal;
      } else {
        if (spendInput) client.spendNum = spendVal;
        if (revenueInput) client.revenueNum = revenueVal;
      }

      closeModal();
      playTone(850, 0.08);
      saveState();
      showToast(`Data ${client.title} berhasil diperbarui`);
    }

                    <span>Ad Spend: ${c.costBreakdown.ads}%</span>
                    <span>Ops: ${c.costBreakdown.csOp}%</span>
                    <span class="text-apple-green font-bold">Profit: ${c.costBreakdown.margin}%</span>
                  </div>
                </div>

              </div>

              <!-- GANTT TIMELINE SCHEDULE SECTION -->
              <div class="overflow-x-auto rounded-2xl border border-black/5 dark:border-white/10 bg-white dark:bg-[#161618]">
                <div class="min-w-[760px] text-xs">
                  
                  <!-- HEADER KALENDER (Bulan, Minggu, Tanggal) -->
                  <div class="flex border-b border-black/5 dark:border-white/10 bg-black/[0.015] dark:bg-white/[0.02]">
                    <div class="w-64 flex-shrink-0 p-2.5 font-bold text-apple-secondaryText text-[11px] flex items-center justify-between border-r border-black/5 dark:border-white/10">
                      <span>October 2026</span>
                      <span>^</span>
                    </div>

                    <div class="flex-1 flex flex-col">
                      <div class="flex border-b border-black/5 dark:border-white/5 text-[10px] font-mono text-apple-secondaryText font-semibold">
                        <div class="w-[41.66%] text-center py-1 border-r border-black/5 dark:border-white/5">Oct W42</div>
                        <div class="w-[58.34%] text-center py-1">Oct W43</div>
                      </div>
                      
                      <div class="grid grid-cols-12 text-center text-[10px] font-mono text-apple-secondaryText">
                        ${GANTT_FLAT_DAYS.map((dayItem, dIdx) => `
                          <div class="py-1 gantt-col-line ${dayItem.w ? 'gantt-col-weekend' : ''} ${dIdx === TODAY_DAY_INDEX ? 'text-apple-red font-bold' : ''}">
                            ${dayItem.d}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>

                  <!-- ROW CAPACITY PILSS -->
                  <div class="flex border-b border-black/5 dark:border-white/10 bg-black/[0.008] dark:bg-white/[0.01] items-center relative">
                    <div class="w-64 flex-shrink-0 p-2.5 flex items-center justify-between border-r border-black/5 dark:border-white/10">
                      <div class="flex items-center space-x-2 truncate">
                        <span class="w-6 h-6 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-xs">${c.avatar || '👤'}</span>
                        <span class="font-bold text-[12px] truncate">${c.pic}</span>
                      </div>
                      <span class="text-apple-secondaryText text-xs font-mono">^</span>
                    </div>

                    <div class="flex-1 grid grid-cols-12 relative items-center h-10">
                      <div class="gantt-today-line" style="left: calc(${(TODAY_DAY_INDEX + 0.5) * 8.333}%);"></div>

                      ${(c.dailyCapacity || []).map((val, dIdx) => {
                        const numVal = parseFloat(val) || 0;
                        const isHigh = numVal >= 10;
                        const hasVal = Boolean(val);
                        const isWeekend = GANTT_FLAT_DAYS[dIdx]?.w;

                        return `
                          <div class="h-full flex items-center justify-center gantt-col-line ${isWeekend ? 'gantt-col-weekend' : ''}">
                            ${hasVal ? `
                              <span class="w-6 h-6 rounded flex items-center justify-center font-mono font-bold text-[10px] ${isHigh ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'}">
                                ${val}
                              </span>
                            ` : ''}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>

                  <!-- ROWS SUBTASK GANTT BARS -->
                  ${c.actions.map(a => {
                    const leftCol = Math.min(11, a.startCol || 0);
                    const spanCol = Math.min(12 - leftCol, a.spanCol || 4);
                    const capsuleClass = getCapsuleStyle(a.colorStyle);

                    return `
                      <div class="flex border-b border-black/[0.03] dark:border-white/[0.04] items-center hover:bg-black/[0.01] dark:hover:bg-white/[0.015] transition-colors relative">
                        <div class="w-64 flex-shrink-0 py-2.5 pl-6 pr-3 flex items-center space-x-2 truncate border-r border-black/5 dark:border-white/10">
                          <span class="text-sm flex-shrink-0">${a.icon || '📌'}</span>
                          <span class="text-[11px] truncate font-medium text-[#1d1d1f] dark:text-white" title="${a.text}">
                            ${a.text}
                          </span>
                        </div>

                        <div class="flex-1 grid grid-cols-12 relative h-9 items-center">
                          <div class="gantt-today-line" style="left: calc(${(TODAY_DAY_INDEX + 0.5) * 8.333}%);"></div>

                          ${GANTT_FLAT_DAYS.map((dayItem) => `
                            <div class="h-full gantt-col-line ${dayItem.w ? 'gantt-col-weekend' : ''}"></div>
                          `).join('')}

                          <div style="grid-column-start: ${leftCol + 1}; grid-column-end: span${spanCol};" 
                               class="absolute inset-y-1.5 left-1 right-1 rounded-full border px-3 flex items-center justify-between text-[10px] shadow-2xs ${capsuleClass} z-2 truncate">
                            <span class="truncate font-medium">${a.labelText || (a.text + ' • ' + spanCol + 'd')}</span>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}

                  <div class="flex items-center text-apple-blue font-semibold text-[11px] py-2 pl-8 border-t border-black/5 dark:border-white/5 cursor-pointer hover:underline" onclick="openNewProjectModal()">
                    + Add deliverable booking
                  </div>

                </div>
              </div>

              <!-- Blocker Indicator -->
              ${c.blocker ? `
                <div class="p-2.5 bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200/60 dark:border-rose-900/40 rounded-xl text-xs text-rose-800 dark:text-rose-300 font-medium">
                  🚨 ${c.blocker}
                </div>
              ` : ''}

              <!-- Share WA Action -->
              <div class="pt-1 flex justify-end text-xs">
                <button onclick="copyWA(${cIdx})" class="text-apple-secondaryText hover:text-[#1d1d1f] dark:hover:text-white font-medium flex items-center space-x-1 apple-press">
                  <span>Share WA Client Update</span><span>↗</span>
                </button>
              </div>

            </div>

          </div>
        `;
      }).join('');
    }

    function renderProjects() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const div = document.getElementById('divisionFilter')?.value || 'ALL';
      const el = document.getElementById('projectsList');

      el.innerHTML = State.clients.map((c, cIdx) => {
        let actions = c.actions;
        if (div !== 'ALL') actions = actions.filter(a => a.label === div);
        if (q) actions = actions.filter(a => a.text.toLowerCase().includes(q) || a.pic.toLowerCase().includes(q));
        if (actions.length === 0) return '';

        return `
          <div class="apple-card p-4 space-y-2.5">
            <div class="flex justify-between items-center pb-2 border-b border-apple-borderLight dark:border-apple-borderDark text-xs">
              <span class="font-bold text-sm text-[#1d1d1f] dark:text-white">${c.title}</span>
              <span class="text-apple-secondaryText">SLA: ${c.handoverSla}</span>
            </div>
            <div class="space-y-1.5">
              ${actions.map((a, aIdx) => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-black/[0.015] dark:bg-white/[0.02] text-xs">
                  <label class="flex items-center space-x-3 flex-1 truncate cursor-pointer">
                    <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleTask(${cIdx},${aIdx})" class="apple-checkbox">
                    <span class="${a.done ? 'line-through text-apple-secondaryText' : 'font-medium'} truncate">${a.text}</span>
                  </label>
                  <div class="flex items-center space-x-2 pl-2">
                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${a.label === 'MEDIA' ? 'bg-blue-50 text-apple-blue' : a.label === 'CREATIVE' ? 'bg-purple-50 text-purple-600' : 'bg-emerald-50 text-apple-green'}">${a.label}</span>
                    <span class="text-[10px] text-apple-secondaryText">${a.pic}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('') || `<div class="p-8 text-center text-xs text-apple-secondaryText italic">Tidak ada tugas ditemukan.</div>`;
    }

    function renderKanban() {
      const cols = { todo: [], doing: [], done: [] };
      State.clients.forEach((c, cIdx) => {
        c.actions.forEach((a, aIdx) => {
          const item = { ...a, cIdx, aIdx, client: c.title };
          if (a.done) cols.done.push(item);
          else if (a.doing) cols.doing.push(item);
          else cols.todo.push(item);
        });
      });

      ['todo', 'doing', 'done'].forEach(col => {
        document.getElementById(`count-${col}`).innerText = cols[col].length;
        document.getElementById(`kanban-${col}`).innerHTML = cols[col].map(item => `
          <div class="apple-card p-3 space-y-1.5 text-xs cursor-grab apple-press" draggable="true" ondragstart="State.dragged = { cIdx: ${item.cIdx}, aIdx: ${item.aIdx} }">
            <div class="flex justify-between text-[10px] text-apple-secondaryText">
              <span class="font-semibold text-[#1d1d1f] dark:text-white">${item.client}</span>
              <span class="px-1.5 py-0.5 rounded-full bg-black/5 dark:bg-white/10">${item.pic}</span>
            </div>
            <p class="font-medium text-[#1d1d1f] dark:text-white leading-relaxed">${item.text}</p>
          </div>
        `).join('') || `<div class="p-6 text-center text-[10px] text-apple-secondaryText italic">Kosong</div>`;
      });
    }

    function dropKanban(e, targetCol) {
      e.preventDefault();
      if (!State.dragged) return;
      const a = State.clients[State.dragged.cIdx].actions[State.dragged.aIdx];
      a.done = targetCol === 'DONE';
      a.doing = targetCol === 'DOING';
      playTone(a.done ? 800 : 500);
      State.dragged = null;
      saveState();
    }

    function toggleTask(cIdx, aIdx) {
      const a = State.clients[cIdx].actions[aIdx];
      a.done = !a.done;
      playTone(a.done ? 800 : 350);
      saveState();
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      playTone(600);
    }
    function closeModal() { 
      document.getElementById('modal').classList.add('hidden'); 
    }

    function openStandup() {
      let lines = [
        '*DAILY STANDUP*',
        'Tanggal: ' + new Date().toLocaleDateString('id-ID'),
        ''
      ];
      State.clients.forEach(c => {
        const inProgress = c.actions.find(a => !a.done);
        lines.push('• *' + c.title + '*: ' + (inProgress ? inProgress.text : 'Semua deliverable tuntas'));
      });
      const textOutput = lines.join('\n');

      openModal("Daily Standup WhatsApp", `
        <textarea id="standupBox" class="w-full h-36 p-3 rounded-2xl bg-black/[0.02] dark:bg-white/[0.04] text-xs font-mono outline-none border border-black/5 dark:border-white/10" readonly></textarea>
        <button onclick="copyStandupText()" class="w-full py-2.5 bg-apple-blue hover:bg-[#0077ed] text-white rounded-xl font-bold apple-press">Salin ke WhatsApp</button>
      `);
      document.getElementById('standupBox').value = textOutput;
    }

    function copyStandupText() {
      const txt = document.getElementById('standupBox').value;
      navigator.clipboard.writeText(txt);
      closeModal();
      showToast('Standup disalin ke WhatsApp');
    }

    function openNewProjectModal() {
      openModal("Tambah Project Baru", `
        <input type="text" id="npTitle" placeholder="Nama Klien..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <input type="text" id="npPic" placeholder="Lead PIC..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <button onclick="submitNewProject()" class="w-full py-2.5 bg-[#1d1d1f] dark:bg-white dark:text-black text-white font-bold rounded-xl apple-press">Simpan Project</button>
      `);
    }

    function submitNewProject() {
      const title = document.getElementById('npTitle').value.trim();
      const pic = document.getElementById('npPic').value.trim() || 'Mike';
      if (!title) return;
      State.clients.push({
        id: "cli-" + Date.now(), title, pic, avatar: "🚀", handoverSla: "2026-10-31",
        spendNum: 0, revenueNum: 0, beRoas: "2.50x", csSla: "< 3m",
        dailyCapacity: ["", "", "2", "2", "2", "2", "", "", "", "", "", ""],
        sparkTrend: [
          { day: "Sen", spend: 30, rev: 60 }, { day: "Sel", spend: 40, rev: 70 },
          { day: "Rab", spend: 50, rev: 80 }, { day: "Kam", spend: 60, rev: 85 },
          { day: "Jum", spend: 70, rev: 90 }, { day: "Sab", spend: 60, rev: 80 }, { day: "Min", spend: 50, rev: 75 }
        ],
        channelShare: { meta: 70, tiktok: 20, google: 5, direct: 5 },
        costBreakdown: { ads: 25, csOp: 15, margin: 60 },
        funnel: { hookRate: 35, cpic: 6000, cr: 20.0, rpr: 25.0 },
        actions: [{ text: "Setup Kampanye Utama", label: "MEDIA", icon: "⚡", pic, done: false, startCol: 2, spanCol: 4, labelText: "2h / day for 4 days", colorStyle: "pink" }]
      });
      closeModal();
      playTone(850);
      saveState();
      showToast("Project baru berhasil ditambahkan");
    }

    function copyWA(cIdx) {
      const c = State.clients[cIdx];
      const doneList = c.actions.filter(a => a.done).map(a => '• ' + a.text).join('\n');
      const text = '*UPDATE PROYEK ' + c.title.toUpperCase() + '*\nSpend: ' + formatRupiahShort(c.spendNum) + '\nRevenue: ' + formatRupiahShort(c.revenueNum) + '\nROAS: ' + getComputedRoas(c) + ' (BE: ' + c.beRoas + ')\n\nDeliverables Selesai:\n' + (doneList || '- On progress');
      navigator.clipboard.writeText(text);
      playTone(800);
      showToast("Laporan disalin ke WhatsApp");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 1600);
    }

    function render() {
      const pics = [...new Set(State.clients.flatMap(c => c.actions.map(a => a.pic)))];
      document.getElementById('teamListUI').innerHTML = pics.map(p => `
        <div class="flex items-center space-x-2 py-1 px-1 rounded-lg text-apple-secondaryText hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
          <span class="text-xs">👤</span><span class="hide-collapsed font-medium">${p}</span>
        </div>
      `).join('');

      if (State.tab === 'home') renderHome();
      else if (State.tab === 'projects') renderProjects();
      else if (State.tab === 'kanban') renderKanban();
    }

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
      if (e.key === 'Escape') closeModal();
      if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === '1') switchTab('home');
        if (e.key === '2') switchTab('projects');
        if (e.key === '3') switchTab('kanban');
        if (e.key.toLowerCase() === 'p') togglePomodoro();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (State.dark) document.documentElement.classList.add('dark');
      render();
    });
  </script>
</body>
</html>
