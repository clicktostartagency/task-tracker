<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - macOS Sequoia Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'sans-serif'],
            mono: ['SF Mono', 'ui-monospace', 'Menlo', 'Monaco', 'monospace']
          },
          colors: {
            apple: {
              canvas: '#f2f2f7',
              card: '#ffffff',
              sidebar: '#f6f6f8',
              blue: '#0071e3',
              green: '#34c759',
              red: '#ff3b30',
              orange: '#ff9500',
              purple: '#af52de',
              text: '#1d1d1f',
              secondary: '#86868b',
              border: 'rgba(0, 0, 0, 0.08)'
            }
          }
        }
      }
    };
  </script>
  <style>
    /* macOS Sequoia Native Polish */
    :root {
      --app-canvas: #f2f2f7;
      --app-card: #ffffff;
      --app-border: rgba(0, 0, 0, 0.08);
      --app-text: #1d1d1f;
      --app-sub: #86868b;
      --app-header: rgba(255, 255, 255, 0.82);
      --app-sidebar: rgba(246, 246, 248, 0.88);
      --app-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dark {
      --app-canvas: #000000;
      --app-card: #1c1c1e;
      --app-border: rgba(255, 255, 255, 0.12);
      --app-text: #f5f5f7;
      --app-sub: #8e8e93;
      --app-header: rgba(28, 28, 30, 0.82);
      --app-sidebar: rgba(24, 24, 26, 0.88);
    }

    body {
      background-color: var(--app-canvas);
      color: var(--app-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      letter-spacing: -0.019em;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Traffic Lights */
    .traffic-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      transition: transform 0.12s ease;
    }
    .traffic-dot:hover {
      transform: scale(1.15);
    }

    /* In-place Editable */
    .inline-editable {
      cursor: text;
      border-radius: 5px;
      padding: 2px 6px;
      outline: none;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .inline-editable:hover {
      background: rgba(0, 113, 227, 0.08);
    }
    .inline-editable:focus {
      background: var(--app-card);
      box-shadow: 0 0 0 1.5px #0071e3;
    }

    /* Slack Density Classes */
    .density-cozy .task-row-pad {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .density-compact .task-row-pad {
      padding-top: 0.35rem;
      padding-bottom: 0.35rem;
      font-size: 11px;
    }

    /* Chevron rotation */
    .chevron-rotate {
      transition: transform 0.24s var(--app-spring);
    }
    .collapsed .chevron-rotate {
      transform: rotate(-90deg);
    }

    /* Gantt Grid */
    .gantt-12-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      height: 100%;
      text-align: center;
    }

    /* Toast Island */
    .dynamic-island {
      transition: all 0.35s var(--app-spring);
      transform: translate(-50%, -20px) scale(0.9);
      opacity: 0;
      pointer-events: none;
    }
    .dynamic-island.active {
      transform: translate(-50%, 0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

  <script>
    // ========================================================
    // 1. APPLE SOUND ENGINE (Web Audio API - Boosted & Robust)
    // ========================================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playAppleSound(type = 'click') {
      if (APP_STATE.isMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'click') {
          // Crisp macOS Click Tock (Boosted)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);
          gain.gain.setValueAtTime(0.18, now); // +50% volume boost
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === 'pop' || type === 'tab') {
          // Segmented Pop Switcher
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.04);
          gain.gain.setValueAtTime(0.20, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'done') {
          // Apple Major-Third Harmonic Chime
          [880, 1100, 1320].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const startTime = now + (i * 0.035);
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.18, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.16);
          });
        } else if (type === 'delete') {
          // Low Swoosh Delete
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(460, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'unfold') {
          // Accordion Unfold
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {
        console.warn("Audio Context Warning:", e);
      }
    }

    // ========================================================
    // 2. DATA MODELS & STATE MANAGEMENT
    // ========================================================
    const DEFAULT_PROJECTS = [
      {
        id: "proj-1",
        clientName: "Sondaika",

    // Helper tag badges
    function getTagBadgeClass(tag) {
      if (tag === 'MEDIA') return 'bg-[#0071e3]/15 text-[#0071e3]';
      if (tag === 'CREATIVE') return 'bg-[#af52de]/15 text-[#af52de]';
      if (tag === 'QA') return 'bg-[#34c759]/15 text-[#34c759]';
      return 'bg-[#ff9500]/15 text-[#ff9500]';
    }

    function cycleTaskTag(pIdx, aIdx) {
      const tags = ['MEDIA', 'CREATIVE', 'QA', 'OPS'];
      const act = APP_STATE.projects[pIdx].actions[aIdx];
      const curIdx = tags.indexOf(act.label || 'OPS');
      act.label = tags[(curIdx + 1) % tags.length];
      playAppleSound('click');
      syncState(`Tag set to ${act.label}`);
    }

    // Tab 2: Home & Funnels View (P&L + CrazyEgg Stage)

        const stages = c.funnelStages;
        const leak1 = Math.round(((stages[0].val - stages[1].val) / stages[0].val) * 100);
        const leak2 = Math.round(((stages[1].val - stages[2].val) / stages[1].val) * 100);
        const leak3 = Math.round(((stages[2].val - stages[3].val) / stages[2].val) * 100);

              <div>
                <span class="block text-[10px] font-mono text-[var(--app-sub)] uppercase">Gross Revenue</span>

                <b class="inline-editable text-xs font-mono font-bold" contenteditable="true" onblur="commitFinancials(${cIdx}, 'be', this.innerText)">
                  ${c.beRoas}x

            <div class="funnel-apple-canvas rounded-2xl p-5 border border-[var(--app-border)] flex flex-col items-center">
              <span class="funnel-title-capsule px-5 py-1 rounded-full text-xs font-bold text-white mb-4 bg-[#0071e3]">
                ${c.funnelTitle}
              </span>

              <div class="w-full max-w-xl space-y-2">
                ${stages.map((st, sIdx) => {
                  const leak = sIdx === 0 ? leak1 : sIdx === 1 ? leak2 : sIdx === 2 ? leak3 : sIdx === 3 ? leak4 : 0;

                    </div>
                  `;
                }).join('')}
              </div>
            </div>

          </div>
        `;
      }).join('');

    // Tab 3: Timeline Gantt Matrix
    function renderTimelineView() {
      const container = document.getElementById('timeline-card-container');
      if (!container) return;

      container.innerHTML = APP_STATE.projects.map((p, pIdx) => `
        <div class="apple-card-box bg-[var(--app-card)] rounded-2xl border border-[var(--app-border)] shadow-sm overflow-hidden p-5 space-y-3">
          <div class="flex items-center justify-between pb-2 border-b border-[var(--app-border)]">
            <h3 class="text-sm font-bold">${p.clientName} &bull; Gantt Schedule Matrix</h3>
            <span class="text-xs font-mono text-[var(--app-sub)]">Lead: <b>${p.lead}</b></span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full min-w-[700px] text-xs border-collapse">
              <thead>
                <tr class="text-[var(--app-sub)] font-mono text-[10px] border-b border-[var(--app-border)]">
                  <th class="w-48 text-left py-2">TASK / PIC</th>
                  <th class="py-2">
                    <div class="gantt-12-grid">
                      ${GANTT_DAYS.map((d, i) => `
                        <span class="${i === 4 ? 'text-[#ff3b30] font-bold' : ''}">${d} Oct</span>
                      `).join('')}
                    </div>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr class="border-b border-[var(--app-border)]/50">
                  <td class="py-2 font-semibold">${p.lead} (Workload)</td>
                  <td class="py-2">
                    <div class="gantt-12-grid font-mono text-[10px]">
                      ${(p.dailyCapacity || []).map((h, capIdx) => `
                        <span onclick="editCapacitySlot(${pIdx}, ${capIdx})" class="py-0.5 rounded cursor-pointer ${getCapacityHeatClass(h)}">
                          ${h ? h + 'h' : ''}
                        </span>
                      `).join('')}
                    </div>
                  </td>
                </tr>

                ${p.actions.map((act, aIdx) => {
                  const start = Math.min(11, act.startCol || 0);
                  const span = Math.min(12 - start, act.spanCol || 4);
                  return `
                    <tr class="border-b border-[var(--app-border)]/30">
                      <td class="py-2 font-medium truncate max-w-[200px]">${act.text}</td>
                      <td class="py-2">
                        <div class="flex items-center relative">
                          <div style="width: ${(start / 12) * 100}%;"></div>
                          <div class="h-6 rounded-full px-2.5 flex items-center justify-between text-[10px] font-mono font-semibold ${getGanttBarClass(act.colorStyle)}" style="width: ${(span / 12) * 100}%;">
                            <button onclick="stepGanttSpan(${pIdx}, ${aIdx}, -1)" class="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center font-bold">-</button>
                            <span>${span}d</span>
                            <button onclick="stepGanttSpan(${pIdx}, ${aIdx}, 1)" class="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center font-bold">+</button>
                          </div>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('');
    }

    function getCapacityHeatClass(val) {
      const num = parseFloat(val) || 0;
      if (num === 0) return 'text-[var(--app-sub)]';
      if (num <= 4) return 'bg-[#34c759]/20 text-[#34c759] font-bold';
      if (num <= 7) return 'bg-[#ff9500]/25 text-[#ff9500] font-bold';
      return 'bg-[#ff3b30]/30 text-[#ff3b30] font-bold animate-pulse';
    }

    function getGanttBarClass(style) {
      if (style === 'green') return 'bg-[#34c759]/20 text-[#15803d] border border-[#34c759]/30';
      if (style === 'brown') return 'bg-[#7c2d12] text-white';
      if (style === 'dashed') return 'border-2 border-dashed border-[#af52de] text-[#af52de]';
      return 'bg-[#db2777]/20 text-[#be185d] border border-[#db2777]/30';
    }

    function editCapacitySlot(pIdx, capIdx) {
      const cur = APP_STATE.projects[pIdx].dailyCapacity[capIdx] || '';
      const updated = prompt(`Update alokasi jam kerja ${APP_STATE.projects[pIdx].lead}:`, cur);
      if (updated !== null) {
        APP_STATE.projects[pIdx].dailyCapacity[capIdx] = updated.trim();
        playAppleSound('click');
        syncState("Workload Updated");
      }
    }

    function stepGanttSpan(pIdx, aIdx, delta) {
      const act = APP_STATE.projects[pIdx].actions[aIdx];
      const start = act.startCol || 0;
      const maxSpan = 12 - start;
      const curSpan = act.spanCol || 1;
      const target = Math.max(1, Math.min(maxSpan, curSpan + delta));
      if (target !== curSpan) {
        act.spanCol = target;
        playAppleSound('click');
        syncState(`Duration set to ${target} days`);
      }
    }

    // ========================================================
    // 4. PROJECT CREATOR & HEADER INLINE ACTIONS
    // ========================================================
    function populateCreatorClientDropdown() {
      const select = document.getElementById('creator-client-select');
      if (!select) return;
      select.innerHTML = `
        <option value="__NEW__">+ Tulis Nama Client Baru...</option>
        ${APP_STATE.clientDirectory.map(name => `
          <option value="${name}">${name}</option>
        `).join('')}
      `;
    }

    function toggleProjectCreator(show) {
      APP_STATE.isCreatorOpen = show;
      const card = document.getElementById('project-creator-card');
      if (card) {
        if (show) {
          card.classList.remove('hidden');
          playAppleSound('pop');
          populateCreatorClientDropdown();
          document.getElementById('creator-task-title').focus();
        } else {
          card.classList.add('hidden');
          playAppleSound('click');
        }
      }
    }

    function handleCreatorClientSelect(val) {
      const customInput = document.getElementById('creator-client-custom');
      if (!customInput) return;
      if (val === '__NEW__') {
        customInput.value = '';
        customInput.placeholder = 'Ketik nama client baru...';
        customInput.focus();
      } else {
        customInput.value = val;
      }
    }

    function commitSaveNewProject() {
      const selectEl = document.getElementById('creator-client-select');
      const customEl = document.getElementById('creator-client-custom');
      const selectedVal = selectEl ? selectEl.value : '__NEW__';
      const customVal = customEl ? customEl.value.trim() : '';

      const clientName = (selectedVal !== '__NEW__' && selectedVal) ? selectedVal : (customVal || "Untitled Brand");
      const taskTitle = document.getElementById('creator-task-title').value.trim() || "Kickoff Sprint";
      const actionPlan = document.getElementById('creator-action-plan').value.trim() || "Action plan operasional deliverable.";
      const duration = document.getElementById('creator-duration').value.trim() || "3h 30m";
      const tag = document.getElementById('creator-tag').value;
      const pic = document.getElementById('creator-pic').value.trim() || "Razaan Al-Ghifari";
      const assignedBy = document.getElementById('creator-assigned-by').value.trim() || "Project Lead";

      // Append to directory if new
      if (!APP_STATE.clientDirectory.includes(clientName)) {
        APP_STATE.clientDirectory.push(clientName);
      }

      // Add project
      const newProj = {
        id: "proj-" + Date.now(),
        clientName: clientName,
        lead: pic,
        category: "Growth Scaling Funnel",
        handoverSlaISO: new Date(Date.now() + 5 * 86400000).toISOString(),
        isCollapsed: false,
        stepLabels: ["Brief", "Production", "Review/QA", "Live Scale"],
        actions: [
          {
            id: "act-" + Date.now(),
            text: taskTitle,
            label: tag,
            pic: pic,
            assignedBy: assignedBy,
            duration: duration,
            notes: actionPlan,
            done: false,
            startCol: 1,
            spanCol: 4,
            colorStyle: "pink"
          }
        ],
        dailyCapacity: ["", "2", "2", "2", "2", "", "2", "2", "2", "", "", ""]
      };

      APP_STATE.projects.unshift(newProj);
      toggleProjectCreator(false);
      playAppleSound('done');
      syncState(`Project [${clientName}] created`);
    }

    // In-place Renaming & Client Switcher
    function commitProjectTitle(pIdx, newName) {
      const clean = newName.trim();
      if (!clean) return;
      APP_STATE.projects[pIdx].clientName = clean;
      if (!APP_STATE.clientDirectory.includes(clean)) {
        APP_STATE.clientDirectory.push(clean);
      }
      playAppleSound('click');
      syncState(`Project renamed to ${clean}`);
    }

    function changeProjectClientDropdown(pIdx, val) {
      if (val === '__ADD_NEW_PROMPT__') {
        const custom = prompt("Tulis nama client baru:");
        if (custom && custom.trim()) {
          commitProjectTitle(pIdx, custom.trim());
        }
      } else if (val) {
        APP_STATE.projects[pIdx].clientName = val;
        playAppleSound('click');
        syncState(`Client set to ${val}`);
      }
    }

    function commitStepLabel(pIdx, sIdx, val) {
      const clean = val.trim();
      if (!clean) return;
      APP_STATE.projects[pIdx].stepLabels[sIdx] = clean;
      playAppleSound('click');
      syncState("Step renamed");
    }

    function commitTaskTitle(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].text = val.trim() || APP_STATE.projects[pIdx].actions[aIdx].text;
      playAppleSound('click');
      syncState("Task updated");
    }

    function commitTaskNotes(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].notes = val.trim();
      playAppleSound('click');
      syncState("Notes saved");
    }

    function commitTaskDuration(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].duration = val.trim();
      playAppleSound('click');
      syncState("Duration updated");
    }

    function commitTaskPic(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].pic = val.trim();
      playAppleSound('click');
      syncState("PIC updated");
    }

    function toggleTaskDone(pIdx, aIdx) {
      const act = APP_STATE.projects[pIdx].actions[aIdx];
      act.done = !act.done;
      playAppleSound(act.done ? 'done' : 'click');
      syncState(act.done ? "Task Done" : "Task Reopened");
    }

    function deleteTask(pIdx, aIdx) {
      APP_STATE.projects[pIdx].actions.splice(aIdx, 1);
      playAppleSound('delete');
      syncState("Task deleted");
    }

    function addNewTaskInline(pIdx) {
      APP_STATE.projects[pIdx].actions.push({
        id: "act-" + Date.now(),
        text: "New Sprint Task",
        label: "CREATIVE",
        pic: APP_STATE.projects[pIdx].lead,
        duration: "2h 30m",
        notes: "Uraian action plan tugas.",
        done: false,
        startCol: 2,
        spanCol: 4,
        colorStyle: "pink"
      });
      playAppleSound('click');
      syncState("Deliverable added");
    }

    function toggleProjectCollapse(pIdx) {
      APP_STATE.projects[pIdx].isCollapsed = !APP_STATE.projects[pIdx].isCollapsed;
      playAppleSound('unfold');
      renderProjectsView();
    }

    function toggleAllCardsCollapse() {
      const state = !APP_STATE.projects[0]?.isCollapsed;
      APP_STATE.projects.forEach(p => p.isCollapsed = state);
      playAppleSound('unfold');
      renderProjectsView();
    }

    function commitFinancials(cIdx, type, val) {
      const clean = (val || '').replace(/[^0-9]/g, '');
      const num = parseInt(clean) || 0;
      if (type === 'spend') APP_STATE.homeClients[cIdx].spendNum = num;
      else if (type === 'rev') APP_STATE.homeClients[cIdx].revenueNum = num;
      else if (type === 'be') APP_STATE.homeClients[cIdx].beRoas = parseFloat(val) || 2.5;
      playAppleSound('click');
      syncState("Financials updated");
    }

    // Filters
    function setStatusFilter(status) {
      APP_STATE.filterStatus = status;
      ['ALL', 'ACTIVE', 'COMPLETED'].forEach(s => {
        const btn = document.getElementById('pill-filter-' + s);
        if (btn) {
          if (s === status) {
            btn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-[#0071e3]/10 text-[#0071e3]";
          } else {
            btn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold text-[var(--app-sub)] hover:bg-black/5 dark:hover:bg-white/5";
          }
        }
      });
      playAppleSound('pop');
      renderProjectsView();
    }

    function setPicFilter(pic) {
      APP_STATE.filterPic = pic;
      playAppleSound('pop');
      renderProjectsView();
    }

    function handleSearch(q) {
      APP_STATE.searchQuery = q;
      renderProjectsView();
    }

    // ========================================================
    // 5. WINDOW & SYSTEM CONTROLS
    // ========================================================
    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      playAppleSound('tab');

      // Move segmented indicator pill
      const pill = document.getElementById('segmented-pill');
      const idx = tabId === 'projects' ? 0 : tabId === 'home' ? 1 : 2;
      pill.style.transform = `translateX(${idx * 100}%)`;

      // Update button colors
      ['projects', 'home', 'timeline'].forEach(t => {
        const segBtn = document.getElementById('segBtn-' + t);
        const navBtn = document.getElementById('tabNav-' + t);
        const view = document.getElementById('view-' + t);
        const isActive = t === tabId;

        if (segBtn) segBtn.className = `relative z-10 flex-1 text-center text-xs font-semibold ${isActive ? 'text-[#0071e3]' : 'text-[var(--app-sub)]'}`;
        if (navBtn) {
          navBtn.className = isActive
            ? "w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold bg-[#0071e3]/10 text-[#0071e3]"
            : "w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-[var(--app-sub)] hover:bg-black/5 dark:hover:bg-white/5";
        }
        if (view) view.style.display = isActive ? 'block' : 'none';
      });

      renderCurrentView();
    }

    function toggleSlackDensity() {
      APP_STATE.isCompact = !APP_STATE.isCompact;
      document.body.classList.toggle('density-compact', APP_STATE.isCompact);
      document.body.classList.toggle('density-cozy', !APP_STATE.isCompact);
      document.getElementById('density-btn').innerText = APP_STATE.isCompact ? 'Compact' : 'Cozy';
      playAppleSound('pop');
      triggerIsland(APP_STATE.isCompact ? 'Density: Slack Compact' : 'Density: Apple Cozy');
    }

    function toggleSoundMute() {
      APP_STATE.isMuted = !APP_STATE.isMuted;
      localStorage.setItem('agency_muted_v3', APP_STATE.isMuted ? 'true' : 'false');
      document.getElementById('sound-icon').innerText = APP_STATE.isMuted ? '🔇' : '🔊';
      document.getElementById('sound-label').innerText = APP_STATE.isMuted ? 'Muted' : 'Sound On';
      if (!APP_STATE.isMuted) playAppleSound('done');
      triggerIsland(APP_STATE.isMuted ? 'Sound Effects Disabled' : 'Sound Effects Active (+50%)');
    }

    function toggleTheme() {
      APP_STATE.isDark = !APP_STATE.isDark;
      localStorage.setItem('agency_dark_v3', APP_STATE.isDark ? 'true' : 'false');
      document.documentElement.classList.toggle('dark', APP_STATE.isDark);
      playAppleSound('pop');
      triggerIsland(APP_STATE.isDark ? 'Dark Mode Active' : 'Light Mode Active');
    }

    function toggleSidebar() {
      APP_STATE.sidebarCollapsed = !APP_STATE.sidebarCollapsed;
      const sidebar = document.getElementById('sidebar-panel');
      if (sidebar) sidebar.classList.toggle('collapsed', APP_STATE.sidebarCollapsed);
      playAppleSound('click');
    }

    function windowActions(action) {
      if (action === 'close') toggleSidebar();
      if (action === 'minimize') toggleAllCardsCollapse();
      if (action === 'zoom') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
        playAppleSound('pop');
      }
    }

    function renderSidebarDirectory() {
      const container = document.getElementById('sidebar-client-list');
      const countEl = document.getElementById('client-directory-count');
      if (!container) return;

      countEl.innerText = APP_STATE.clientDirectory.length;
      container.innerHTML = APP_STATE.clientDirectory.map(name => `
        <div onclick="filterByClientDirectory('${name}')" class="px-2 py-1 rounded text-xs hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer truncate flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#0071e3]"></span>
          <span>${name}</span>
        </div>
      `).join('');
    }

    function filterByClientDirectory(name) {
      switchTab('projects');
      const search = document.getElementById('project-search-input');
      if (search) search.value = name;
      handleSearch(name);
      playAppleSound('click');
    }

    // Initialization
    window.addEventListener('load', () => {
      if (APP_STATE.isDark) document.documentElement.classList.add('dark');
      if (APP_STATE.isMuted) {
        document.getElementById('sound-icon').innerText = '🔇';
        document.getElementById('sound-label').innerText = 'Muted';
      }
      renderSidebarDirectory();
      renderCurrentView();
    });

    // Audio context gesture unlock
    window.addEventListener('click', () => getAudioContext(), { once: true });
  </script>
</body>
</html>
