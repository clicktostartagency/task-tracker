<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - Ultra Clean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  <style>
    * { font-family: 'Inter', sans-serif !important; letter-spacing: -0.015em; }
    .sidebar-collapsed { width: 68px !important; min-width: 68px !important; }
    .sidebar-collapsed .hide-collapsed { display: none !important; }
    .sidebar-collapsed .center-collapsed { justify-content: center !important; padding-left: 0 !important; }
  </style>
</head>
<body class="w-screen h-screen flex bg-[#f5f5f7] dark:bg-black text-[#1d1d1f] dark:text-[#f5f5f7] overflow-hidden select-none">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-56 h-full flex flex-col border-r border-black/5 dark:border-white/10 bg-black/[0.015] dark:bg-white/[0.02] transition-all duration-200">
    <div class="flex items-center justify-between p-4 pb-2">
      <div class="flex space-x-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></span>
      </div>
      <button onclick="toggleSidebar()" class="hide-collapsed text-xs text-[#86868b] hover:text-black dark:hover:text-white">◧</button>
    </div>

    <!-- Navigation -->
    <nav class="p-2 space-y-1 text-xs font-semibold">
      <button onclick="switchTab('home')" id="tab-home" class="center-collapsed w-full flex items-center space-x-2 px-3 py-2 rounded-xl bg-black/5 dark:bg-white/10 text-[#0071e3]">
        <span>🏠</span><span class="hide-collapsed">Home</span>
      </button>
      <button onclick="switchTab('projects')" id="tab-projects" class="center-collapsed w-full flex items-center space-x-2 px-3 py-2 rounded-xl text-[#86868b] hover:bg-black/5 dark:hover:bg-white/5">
        <span>📁</span><span class="hide-collapsed">Projects</span>
      </button>
      <button onclick="switchTab('kanban')" id="tab-kanban" class="center-collapsed w-full flex items-center space-x-2 px-3 py-2 rounded-xl text-[#86868b] hover:bg-black/5 dark:hover:bg-white/5">
        <span>📋</span><span class="hide-collapsed">Kanban</span>
      </button>
    </nav>

    <!-- Team Section -->
    <div class="mt-auto p-3 border-t border-black/5 dark:border-white/10 text-xs">
      <span class="hide-collapsed text-[10px] font-bold text-[#86868b] uppercase block mb-1.5">Active Team</span>
      <div id="teamListUI" class="space-y-1"></div>
    </div>
  </aside>

  <!-- WORKSPACE -->
  <div class="flex-1 flex flex-col h-full min-w-0">
    
    <!-- HEADER TOOLBAR -->
    <header class="px-5 py-2.5 flex items-center justify-between border-b border-black/5 dark:border-white/10 bg-white/70 dark:bg-[#1c1c1e]/70 backdrop-blur-md z-10">
      <div class="flex items-center space-x-2">
        <button onclick="toggleSidebar()" class="text-sm text-[#86868b] hover:text-black dark:hover:text-white">◧</button>
        <span class="font-bold text-sm tracking-tight">Agency Operations Hub</span>
        
        <div id="pomoBadge" class="hidden items-center space-x-1.5 bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 px-2 py-0.5 rounded-full text-[11px] font-mono text-indigo-700 dark:text-indigo-300">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-ping"></span>
          <span id="pomoTimer">25:00</span>
          <button onclick="stopPomo()" class="text-rose-500 font-bold ml-1">&times;</button>
        </div>
      </div>

      <div class="flex items-center space-x-1.5 text-xs">
        <button onclick="toggleTheme()" id="themeBtn" class="p-1.5 rounded-full border border-black/5 dark:border-white/10 bg-white dark:bg-white/10" title="Ganti Tema">🌙</button>
        <button onclick="toggleSound()" id="soundBtn" class="p-1.5 rounded-full border border-black/5 dark:border-white/10 bg-white dark:bg-white/10" title="Audio">🔊</button>
        <button onclick="openStandup()" class="px-3 py-1.5 rounded-full border border-black/5 dark:border-white/10 bg-white dark:bg-white/10 font-medium">Daily Standup</button>
        <button onclick="openNewProjectModal()" class="px-3 py-1.5 rounded-full bg-[#1d1d1f] hover:bg-black dark:bg-white dark:text-black text-white font-semibold">+ Project</button>
      </div>
    </header>

    <!-- CONTENT BODY -->
    <main class="flex-1 overflow-y-auto p-5 space-y-4">
      
      <!-- TAB 1: HOME -->
      <section id="view-home" class="space-y-4">
        <div id="clientCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
      </section>

      <!-- TAB 2: PROJECTS -->
      <section id="view-projects" class="hidden space-y-3">
        <div class="flex items-center space-x-2">
          <input type="text" id="searchInput" oninput="renderProjects()" placeholder="Cari klien, deliverable, atau PIC..." class="flex-1 p-2 rounded-xl bg-white dark:bg-[#1c1c1e] border border-black/5 dark:border-white/10 text-xs outline-none">
          <select id="divisionFilter" onchange="renderProjects()" class="p-2 rounded-xl bg-white dark:bg-[#1c1c1e] border border-black/5 dark:border-white/10 text-xs font-semibold">
            <option value="ALL">Semua Divisi</option>
            <option value="MEDIA">⚡ Media</option>
            <option value="CREATIVE">🎨 Creative</option>
            <option value="QA">✅ QA</option>
          </select>
        </div>
        <div id="projectsList" class="space-y-2.5"></div>
      </section>

      <!-- TAB 3: KANBAN -->
      <section id="view-kanban" class="hidden grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="bg-black/[0.015] dark:bg-white/[0.02] p-3 rounded-2xl border border-dashed border-black/10 dark:border-white/10 space-y-2" ondragover="event.preventDefault()" ondrop="dropKanban(event, 'TODO')">
          <div class="flex justify-between items-center text-xs font-bold text-[#86868b] px-1"><span>BACKLOG</span><span id="count-todo">0</span></div>
          <div id="kanban-todo" class="space-y-2"></div>
        </div>
        <div class="bg-black/[0.015] dark:bg-white/[0.02] p-3 rounded-2xl border border-dashed border-black/10 dark:border-white/10 space-y-2" ondragover="event.preventDefault()" ondrop="dropKanban(event, 'DOING')">
          <div class="flex justify-between items-center text-xs font-bold text-[#0071e3] px-1"><span>IN PROGRESS</span><span id="count-doing">0</span></div>
          <div id="kanban-doing" class="space-y-2"></div>
        </div>
        <div class="bg-black/[0.015] dark:bg-white/[0.02] p-3 rounded-2xl border border-dashed border-black/10 dark:border-white/10 space-y-2" ondragover="event.preventDefault()" ondrop="dropKanban(event, 'DONE')">
          <div class="flex justify-between items-center text-xs font-bold text-[#34c759] px-1"><span>COMPLETED</span><span id="count-done">0</span></div>
          <div id="kanban-done" class="space-y-2"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- UNIVERSAL MODAL -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-[#1c1c1e] w-full max-w-md p-5 rounded-2xl shadow-xl space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-black/5 dark:border-white/10">
        <h3 id="modalTitle" class="text-xs font-bold uppercase tracking-wider"></h3>
        <button onclick="closeModal()" class="w-6 h-6 rounded-full bg-black/5 dark:bg-white/10 text-xs font-bold">&times;</button>
      </div>
      <div id="modalContent" class="text-xs space-y-2.5"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-[#1d1d1f] dark:bg-white text-white dark:text-black text-xs font-semibold px-4 py-1.5 rounded-full shadow-md opacity-0 pointer-events-none transition-all duration-200 z-50"></div>

  <script>
    // --- COMPACT WEB AUDIO ---
    let soundOn = true;
    let audioCtx = null;
    function playTone(freq = 600, duration = 0.04) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('soundBtn').innerText = soundOn ? '🔊' : '🔇';
      showToast(soundOn ? "Suara Aktif" : "Suara Muted");
    }

    // --- STATE INITIALIZATION ---
    const INITIAL_DATA = [
      {
        id: "cli-1", title: "Sondaika", pic: "Razaan", handoverSla: "2026-10-25",
        spend: "Rp 18.5M", revenue: "Rp 79.5M", roas: "4.30x", beRoas: "2.50x", csSla: "2.4m",
        hooks: ["Bahan kemeja 2x lebih adem untuk cuaca panas.", "Tahan kusut walau dipakai motoran seharian."],
        actions: [
          { text: "Riset audiens & angle copywriting", label: "MEDIA", pic: "Razaan", done: true },
          { text: "Setup form penawaran direct leads", label: "MEDIA", pic: "Nicho", done: true },
          { text: "Konfigurasi Meta Ads Broad CAPI", label: "MEDIA", pic: "Razaan", done: true },
          { text: "Uji integrasi WhatsApp Tracking & Pixel", label: "QA", pic: "Mike", done: false }
        ]
      },
      {
        id: "cli-2", title: "Sibersih", pic: "Arif", handoverSla: "2026-10-24",
        spend: "Rp 12.8M", revenue: "Rp 40.9M", roas: "3.20x", beRoas: "2.80x", csSla: "4.8m",
        blocker: "Menunggu aset video resolusi tinggi dari klien",
        hooks: ["Kerak 5 tahun rontok dalam 1 menit tanpa disikat sekuat tenaga.", "Formula khusus yang tidak merusak nat lantai keramik."],
        actions: [
          { text: "Penyusunan Storyboard Video Konten", label: "CREATIVE", pic: "Jireh", done: true },
          { text: "Penulisan skrip hook 3 detik", label: "CREATIVE", pic: "Arif", done: true },
          { text: "Pemotongan video kreatif 9:16", label: "CREATIVE", pic: "Giza", done: false },
          { text: "Client preview & sign-off deliverable", label: "QA", pic: "Arif", done: false }
        ]
      },
      {
        id: "cli-3", title: "Nebula", pic: "Nicho", handoverSla: "2026-10-22",
        spend: "Rp 32.4M", revenue: "Rp 155.5M", roas: "4.80x", beRoas: "2.20x", csSla: "1.8m",
        blocker: "Akses BM terbatas (Payment gateway pending)",
        hooks: ["Kulit mendadak bruntusan padahal tidak ganti skincare?", "Serum ringan yang meresap dalam 5 detik."],
        actions: [
          { text: "Briefing visual brand identity", label: "CREATIVE", pic: "Jireh", done: true },
          { text: "Wireframing landing page", label: "CREATIVE", pic: "Arif", done: true },
          { text: "Frontend slicing landing page", label: "MEDIA", pic: "Razaan", done: true },
          { text: "Alokasi budget & scaling Meta Ads", label: "MEDIA", pic: "Nicho", done: false }
        ]
      },
      {
        id: "cli-4", title: "Cleanboss", pic: "Selin", handoverSla: "2026-10-28",
        spend: "Rp 6.5M", revenue: "Rp 14.3M", roas: "2.20x", beRoas: "2.70x", csSla: "5.5m",
        blocker: "Menunggu memo kelulusan struktur harga paket diskon dari klien",
        hooks: ["Pangkas biaya operasional sabun cuci piring cafe hingga 40%.", "Satu tetes konsentrat ampuh hilangkan lemak membandel."],
        actions: [
          { text: "Discovery call & onboarding klien", label: "QA", pic: "Selin", done: true },
          { text: "Copywriting promo launching bundle", label: "CREATIVE", pic: "Selin", done: false },
          { text: "Desain banner promosi feed & story", label: "CREATIVE", pic: "Arif", done: false },
          { text: "Setup alur direct WhatsApp CS", label: "MEDIA", pic: "Razaan", done: false }
        ]
      }
    ];

    let State = {
      clients: JSON.parse(localStorage.getItem('agency_clients_simple')) || INITIAL_DATA,
      tab: 'home',
      sidebar: false,
      dark: localStorage.getItem('agency_dark') === 'true',
      dragged: null
    };

    function saveState() {
      localStorage.setItem('agency_clients_simple', JSON.stringify(State.clients));
      render();
    }

    // --- NAVIGATION ---
    function switchTab(tabId) {
      State.tab = tabId;
      playTone(700);
      ['home', 'projects', 'kanban'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tabId);
        const btn = document.getElementById(`tab-${t}`);
        btn.className = (t === tabId)
          ? "center-collapsed w-full flex items-center space-x-2 px-3 py-2 rounded-xl bg-black/5 dark:bg-white/10 text-[#0071e3] font-bold"
          : "center-collapsed w-full flex items-center space-x-2 px-3 py-2 rounded-xl text-[#86868b] hover:bg-black/5 dark:hover:bg-white/5 font-medium";
      });
      render();
    }

    function toggleSidebar() {
      State.sidebar = !State.sidebar;
      playTone(500);
      document.getElementById('sidebar').classList.toggle('sidebar-collapsed', State.sidebar);
    }

    function toggleTheme() {
      State.dark = !State.dark;
      localStorage.setItem('agency_dark', State.dark);
      document.documentElement.classList.toggle('dark', State.dark);
      document.getElementById('themeBtn').innerText = State.dark ? '☀️' : '🌙';
      playTone(650);
    }

    // --- RENDER HOME ---
    function renderHome() {
      const el = document.getElementById('clientCardsContainer');
      el.innerHTML = State.clients.map((c, cIdx) => {
        const total = c.actions.length;
        const done = c.actions.filter(a => a.done).length;
        const pct = Math.round((done / total) * 100);
        const inProgress = c.actions.find(a => !a.done);
        const isBleeding = parseFloat(c.roas) < parseFloat(c.beRoas);

        return `
          <div class="bg-white dark:bg-[#1c1c1e] p-4 rounded-2xl border border-black/5 dark:border-white/10 space-y-3 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-sm">${c.title}</h3>
                  <p class="text-[11px] text-[#86868b]">Lead: ${c.pic} • SLA: ${c.handoverSla}</p>
                </div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${pct === 100 ? 'bg-emerald-50 text-[#34c759]' : c.blocker ? 'bg-rose-50 text-[#ff3b30]' : 'bg-blue-50 text-[#0071e3]'}">
                  ${pct === 100 ? 'COMPLETED' : c.blocker ? 'BLOCKER' : 'IN PROGRESS'}
                </span>
              </div>

              <!-- Metrics -->
              <div class="grid grid-cols-3 gap-1 my-2 p-2 bg-black/[0.02] dark:bg-white/[0.03] rounded-xl text-center text-xs">
                <div><span class="text-[9px] text-[#86868b] uppercase block">Spend</span><b>${c.spend}</b></div>
                <div><span class="text-[9px] text-[#86868b] uppercase block">Revenue</span><b>${c.revenue}</b></div>
                <div><span class="text-[9px] text-[#86868b] uppercase block">ROAS/BE</span><b class="${isBleeding ? 'text-rose-500' : 'text-emerald-500'}">${c.roas} (${c.beRoas})</b></div>
              </div>

              <!-- Progress Bar -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs font-semibold">
                  <span class="text-[#86868b]">Deliverables: ${done}/${total}</span>
                  <span class="${pct === 100 ? 'text-[#34c759]' : 'text-[#0071e3]'}">${pct}%</span>
                </div>
                <div class="w-full bg-black/5 dark:bg-white/10 h-1.5 rounded-full overflow-hidden">
                  <div class="h-full ${pct === 100 ? 'bg-[#34c759]' : 'bg-[#0071e3]'} rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                </div>
              </div>

              <!-- In-Progress Task -->
              <div class="mt-2.5 p-2 bg-black/[0.02] dark:bg-white/[0.03] rounded-lg text-xs truncate">
                <span class="text-[9px] text-[#86868b] uppercase font-bold block">Current Task:</span>
                <span>${inProgress ? `⚡ ${inProgress.text} (${inProgress.pic})` : '🎉 Deliverables tuntas'}</span>
              </div>

              <!-- Blocker -->
              ${c.blocker ? `<div class="mt-1.5 p-2 bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 rounded-lg text-xs text-rose-800 dark:text-rose-300 font-medium">🚨 ${c.blocker}</div>` : ''}
            </div>

            <div class="pt-2 border-t border-black/5 dark:border-white/10 flex justify-between items-center text-xs">
              <button onclick="openHookVault(${cIdx})" class="text-[#0071e3] font-semibold">🎯 Hook Vault</button>
              <button onclick="copyWA(${cIdx})" class="text-[#86868b] hover:text-black dark:hover:text-white font-semibold">Share WA ↗</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- RENDER PROJECTS ---
    function renderProjects() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const div = document.getElementById('divisionFilter')?.value || 'ALL';
      const el = document.getElementById('projectsList');

      el.innerHTML = State.clients.map((c, cIdx) => {
        let actions = c.actions;
        if (div !== 'ALL') actions = actions.filter(a => a.label === div);
        if (q) actions = actions.filter(a => a.text.toLowerCase().includes(q) || a.pic.toLowerCase().includes(q));
        if (actions.length === 0) return '';

        return `
          <div class="bg-white dark:bg-[#1c1c1e] p-3.5 rounded-2xl border border-black/5 dark:border-white/10 space-y-2">
            <div class="flex justify-between items-center pb-1.5 border-b border-black/5 dark:border-white/10 text-xs">
              <span class="font-bold">${c.title}</span>
              <span class="text-[#86868b]">SLA: ${c.handoverSla}</span>
            </div>
            <div class="space-y-1">
              ${actions.map((a, aIdx) => `
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-black/[0.015] dark:bg-white/[0.02] text-xs">
                  <label class="flex items-center space-x-2 flex-1 truncate cursor-pointer">
                    <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleTask(${cIdx},${aIdx})" class="rounded text-[#0071e3]">
                    <span class="${a.done ? 'line-through text-[#86868b]' : ''} truncate">${a.text}</span>
                  </label>
                  <span class="text-[10px] text-[#86868b] pl-2">${a.pic}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('') || `<div class="p-6 text-center text-xs text-[#86868b]">Tidak ada tugas yang sesuai.</div>`;
    }

    // --- RENDER KANBAN ---
    function renderKanban() {
      const cols = { todo: [], doing: [], done: [] };
      State.clients.forEach((c, cIdx) => {
        c.actions.forEach((a, aIdx) => {
          const item = { ...a, cIdx, aIdx, client: c.title };
          if (a.done) cols.done.push(item);
          else if (a.doing) cols.doing.push(item);
          else cols.todo.push(item);
        });
      });

      ['todo', 'doing', 'done'].forEach(col => {
        document.getElementById(`count-${col}`).innerText = cols[col].length;
        document.getElementById(`kanban-${col}`).innerHTML = cols[col].map(item => `
          <div class="bg-white dark:bg-[#1c1c1e] p-2.5 rounded-xl border border-black/5 dark:border-white/10 text-xs space-y-1 cursor-grab" draggable="true" ondragstart="State.dragged = { cIdx: ${item.cIdx}, aIdx: ${item.aIdx} }">
            <div class="flex justify-between text-[10px] text-[#86868b]"><span>${item.client}</span><span>${item.pic}</span></div>
            <p class="font-medium">${item.text}</p>
          </div>
        `).join('') || `<div class="p-3 text-center text-[10px] text-[#86868b]">Kosong</div>`;
      });
    }

    function dropKanban(e, targetCol) {
      e.preventDefault();
      if (!State.dragged) return;
      const a = State.clients[State.dragged.cIdx].actions[State.dragged.aIdx];
      a.done = targetCol === 'DONE';
      a.doing = targetCol === 'DOING';
      playTone(a.done ? 800 : 500);
      State.dragged = null;
      saveState();
    }

    function toggleTask(cIdx, aIdx) {
      const a = State.clients[cIdx].actions[aIdx];
      a.done = !a.done;
      playTone(a.done ? 800 : 350);
      saveState();
    }

    // --- MODAL UTILITIES ---
    function openModal(title, html) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      playTone(600);
    }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function openHookVault(cIdx) {
      const c = State.clients[cIdx];
      const html = c.hooks.map(h => `<div class="p-2.5 bg-black/[0.02] dark:bg-white/[0.04] rounded-xl">"${h}"</div>`).join('');
      openModal(`${c.title} - Hook Vault`, html);
    }

    function openStandup() {
      let msg = `*DAILY STANDUP*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;
      State.clients.forEach(c => {
        const inProgress = c.actions.find(a => !a.done);
        msg += `• *${c.title}*: ${inProgress ? inProgress.text : 'Semua tuntas'}\n`;
      });
      openModal("Daily Standup WhatsApp", `
        <textarea class="w-full h-32 p-2 rounded-xl bg-black/[0.02] dark:bg-white/[0.04] text-xs font-mono outline-none" readonly>${msg}</textarea>
        <button onclick="navigator.clipboard.writeText('${msg.replace(/\n/g, '\\n')}'); closeModal(); showToast('Standup disalin!');" class="w-full py-2 bg-[#0071e3] text-white rounded-xl font-bold">Salin ke WA</button>
      `);
    }

    function openNewProjectModal() {
      openModal("Tambah Project", `
        <input type="text" id="npTitle" placeholder="Nama Klien..." class="w-full p-2 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none">
        <input type="text" id="npPic" placeholder="Lead PIC..." class="w-full p-2 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none">
        <button onclick="submitNewProject()" class="w-full py-2 bg-[#1d1d1f] dark:bg-white dark:text-black text-white font-bold rounded-xl">Simpan</button>
      `);
    }

    function submitNewProject() {
      const title = document.getElementById('npTitle').value.trim();
      const pic = document.getElementById('npPic').value.trim() || 'Mike';
      if (!title) return;
      State.clients.push({
        id: "cli-" + Date.now(), title, pic, handoverSla: "2026-10-31",
        spend: "Rp 0", revenue: "Rp 0", roas: "0.0x", beRoas: "2.5x", csSla: "< 3m",
        hooks: ["Formula hook visual 3 detik awal."],
        actions: [{ text: "Setup kampanye utama", label: "MEDIA", pic, done: false }]
      });
      closeModal();
      playTone(850);
      saveState();
      showToast("Project baru ditambahkan.");
    }

    function copyWA(cIdx) {
      const c = State.clients[cIdx];
      const doneList = c.actions.filter(a => a.done).map(a => `• ${a.text}`).join('\n');
      const text = `*UPDATE PROYEK ${c.title.toUpperCase()}*\nRevenue: ${c.revenue} (ROAS: ${c.roas})\n\nDeliverables Selesai:\n${doneList || '- On progress'}`;
      navigator.clipboard.writeText(text);
      playTone(800);
      showToast("Disalin ke WhatsApp!");
    }

    // --- POMODORO ---
    let pomoTimer = null, pomoSecs = 25 * 60;
    function startPomo() {
      if (pomoTimer) return;
      document.getElementById('pomoBadge').classList.replace('hidden', 'flex');
      playTone(700);
      pomoTimer = setInterval(() => {
        pomoSecs--;
        const m = String(Math.floor(pomoSecs / 60)).padStart(2, '0');
        const s = String(pomoSecs % 60).padStart(2, '0');
        document.getElementById('pomoTimer').innerText = `${m}:${s}`;
        if (pomoSecs <= 0) stopPomo();
      }, 1000);
    }
    function stopPomo() {
      clearInterval(pomoTimer);
      pomoTimer = null;
      pomoSecs = 25 * 60;
      document.getElementById('pomoBadge').classList.replace('flex', 'hidden');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 1500);
    }

    function render() {
      const pics = [...new Set(State.clients.flatMap(c => c.actions.map(a => a.pic)))];
      document.getElementById('teamListUI').innerHTML = pics.map(p => `
        <div class="flex items-center space-x-2 py-0.5 text-[#86868b]">
          <span class="text-[10px]">👤</span><span class="hide-collapsed">${p}</span>
        </div>
      `).join('');

      if (State.tab === 'home') renderHome();
      else if (State.tab === 'projects') renderProjects();
      else if (State.tab === 'kanban') renderKanban();
    }

    // --- KEYBOARD SHORTCUTS ---
    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
      if (e.key === 'Escape') closeModal();
      if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === '1') switchTab('home');
        if (e.key === '2') switchTab('projects');
        if (e.key === '3') switchTab('kanban');
        if (e.key.toLowerCase() === 'p') startPomo();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (State.dark) document.documentElement.classList.add('dark');
      render();
    });
  </script>
</body>
</html>
