<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress - Desktop Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Kapsul Progress Persis Referensi */
    .progress-capsule {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      cursor: pointer;
      min-height: 104px;
      display: flex;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
      transition: transform 0.24s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.24s ease;
    }
    .progress-capsule:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }
    .progress-capsule:active {
      transform: scale(0.985);
    }

    /* Accordion Drawer */
    .accordion-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scaleY(0.96);
      transform-origin: top;
      transition: max-height 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.28s ease,
                  transform 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-top 0.32s ease;
    }
    .accordion-drawer.open {
      max-height: 650px;
      opacity: 1;
      transform: scaleY(1);
      margin-top: 12px;
    }

    /* Apple Style Round Checkbox */
    .apple-check {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #c7c7cc;
      border-radius: 50%;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .apple-check:checked {
      background-color: #34c759;
      border-color: #34c759;
      transform: scale(1.05);
    }
    .apple-check:checked::after {
      content: '';
      width: 6px;
      height: 11px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-6 lg:px-16 flex justify-center">

  <!-- Desktop Canvas Container (macOS Web App Feel) -->
  <div class="w-full max-w-5xl flex flex-col">

    <!-- Desktop macOS Top Navigation Bar -->
    <header class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200/70">
      
      <!-- Window Dots + Title -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <span class="w-3.5 h-3.5 rounded-full bg-[#ff5f56] border border-[#e0443e]"></span>
          <span class="w-3.5 h-3.5 rounded-full bg-[#ffbd2e] border border-[#dea123]"></span>
          <span class="w-3.5 h-3.5 rounded-full bg-[#27c93f] border border-[#1aab29]"></span>
        </div>
        <h1 class="text-3xl font-extrabold text-black tracking-tight ml-2">
          Progress
        </h1>
      </div>

      <!-- Desktop Action Controls -->
      <div class="flex items-center space-x-3">
        <button onclick="toggleEdit()" id="editBtn" class="bg-white text-gray-800 font-semibold text-sm px-4 py-2 rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.05)] border border-gray-200/60 hover:bg-gray-50 active:bg-gray-100 transition">
          Edit Items
        </button>
        <button onclick="copyWA()" class="flex items-center space-x-1.5 bg-white text-gray-800 hover:text-emerald-600 font-semibold text-sm px-4 py-2 rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.05)] border border-gray-200/60 transition">
          <svg class="w-4 h-4 fill-emerald-600" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>Share WA</span>
        </button>
        <button onclick="openModal()" class="bg-[#0071e3] hover:bg-[#0062c4] text-white font-semibold text-sm px-5 py-2 rounded-full shadow-[0_2px_10px_rgba(0,113,227,0.3)] flex items-center space-x-1.5 active:scale-95 transition">
          <span class="text-lg leading-none font-bold">+</span>
          <span>Task Baru</span>
        </button>
      </div>

    </header>

    <!-- 2-Column Responsive Desktop Grid for Capsules -->
    <main id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <!-- Di-render oleh JavaScript -->
    </main>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-gray-900/90 backdrop-blur-md text-white text-sm font-semibold px-5 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
    Laporan standup disalin ke clipboard!
  </div>

  <!-- MODAL: Tambah Task Baru -->
  <div id="taskModal" class="fixed inset-0 bg-black/35 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[32px] w-full max-w-md p-7 shadow-2xl border border-gray-100">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-2xl font-bold text-gray-900">Task Baru</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-3xl font-light">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Judul / Nama Kategori</label>
          <input type="text" id="inpTitle" placeholder="Misal: Books Read" class="w-full mt-1.5 px-4 py-2.5 bg-gray-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Warna Kapsul</label>
          <div class="flex space-x-3 mt-2">
            <button onclick="pickColor('blue')" class="color-dot w-8 h-8 rounded-full bg-[#006bb6] ring-2 ring-offset-2 ring-blue-500"></button>
            <button onclick="pickColor('green')" class="color-dot w-8 h-8 rounded-full bg-[#00a34b]"></button>
            <button onclick="pickColor('orange')" class="color-dot w-8 h-8 rounded-full bg-[#f39200]"></button>
            <button onclick="pickColor('purple')" class="color-dot w-8 h-8 rounded-full bg-[#9b1c8e]"></button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Lead PIC</label>
            <input type="text" id="inpPic" placeholder="Misal: Budi" class="w-full mt-1.5 px-3.5 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Satuan Unit</label>
            <input type="text" id="inpUnit" placeholder="Books / mi / $" class="w-full mt-1.5 px-3.5 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Action Plans & Assignee</label>
            <button onclick="addField()" class="text-xs font-bold text-blue-600 hover:underline">+ Tambah</button>
          </div>
          <div id="fieldsBox" class="space-y-2 max-h-48 overflow-y-auto pr-1">
            <div class="flex space-x-2">
              <input type="text" placeholder="Langkah 1" class="step-txt flex-1 px-3 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none">
              <input type="text" placeholder="PIC" class="step-pic w-24 px-2 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none">
            </div>
          </div>
        </div>
      </div>

      <div class="mt-7 flex space-x-3">
        <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-2xl bg-gray-100 text-gray-700 font-semibold text-sm hover:bg-gray-200 transition">Batal</button>
        <button onclick="saveTask()" class="w-1/2 py-2.5 rounded-2xl bg-[#0071e3] text-white font-bold text-sm shadow-md hover:bg-[#0062c4] transition">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // Palet Warna Persis Gambar Referensi
    const THEMES = {
      blue: {
        fill: '#006bb6',      // Books Read solid
        tint: '#acc7e7',      // Books Read pastel
        textFill: '#ffffff'
      },
      green: {
        fill: '#00a34b',      // Budget solid
        tint: '#badfca',      // Budget pastel
        textFill: '#ffffff'
      },
      orange: {
        fill: '#f39200',      // Miles Run solid
        tint: '#fde0c4',      // Miles Run pastel
        textFill: '#1d1d1f'   // Kontras gelap di oranye
      },
      purple: {
        fill: '#9b1c8e',      // Weight Lost solid
        tint: '#dfc2dc',      // Weight Lost pastel
        textFill: '#ffffff'
      }
    };

    let selectedTheme = 'blue';

    // Data Default Sesuai Referensi
    const defaultData = [
      {
        id: "d-1",
        title: "Books Read",
        theme: "blue",
        pic: "Budi Santoso",
        targetVal: 30,
        unit: "Books",
        actions: [
          { text: "Bab 1 - 5 Pengenalan", pic: "Budi", done: true },
          { text: "Bab 6 - 10 Studi Kasus BD", pic: "Budi", done: true },
          { text: "Bab 11 - 14 Evaluasi Strategi", pic: "Siti", done: false },
          { text: "Bab 15 - 20 Penutup", pic: "Andi", done: false }
        ],
        hasBlocker: false,
        blockerDesc: ""
      },
      {
        id: "d-2",
        title: "Budget",
        theme: "green",
        pic: "Siti Rahma",
        targetVal: 1500,
        unit: "$",
        actions: [
          { text: "Alokasi Paid Ads Meta", pic: "Siti", done: true },
          { text: "Alokasi TikTok Direct-to-Chat", pic: "Budi", done: false }
        ],
        hasBlocker: false,
        blockerDesc: ""
      },
      {
        id: "d-3",
        title: "Miles Run",
        theme: "orange",
        pic: "Andi Wijaya",
        targetVal: 500,
        unit: "mi",
        actions: [
          { text: "Sesi 1: Brand Fashion", pic: "Andi", done: true },
          { text: "Sesi 2: Brand F&B", pic: "Dewi", done: true },
          { text: "Sesi 3: Brand SaaS", pic: "Andi", done: true },
          { text: "Sesi 4: Client Handover", pic: "Andi", done: false }
        ],
        hasBlocker: false,
        blockerDesc: ""
      },
      {
        id: "d-4",
        title: "Weight Lost",
        theme: "purple",
        pic: "Dewi Lestari",
        targetVal: 40,
        unit: "lb",
        actions: [
          { text: "Draft klausul SLA kontrak", pic: "Dewi", done: true },
          { text: "Persetujuan tim legal", pic: "Legal", done: false },
          { text: "Penandatanganan direksi", pic: "Dewi", done: false }
        ],
        hasBlocker: true,
        blockerDesc: "Persetujuan tertahan di bagian Legal"
      }
    ];

    let expandedIds = new Set(["d-1"]);
    let isEditMode = false;

    function getData() {
      const stored = localStorage.getItem('apple_exact_pills_desktop');
      if (!stored) {
        localStorage.setItem('apple_exact_pills_desktop', JSON.stringify(defaultData));
        return defaultData;
      }
      return JSON.parse(stored);
    }

    function saveData(data) {
      localStorage.setItem('apple_exact_pills_desktop', JSON.stringify(data));
      render();
    }

    function toggleEdit() {
      isEditMode = !isEditMode;
      document.getElementById('editBtn').innerText = isEditMode ? 'Done' : 'Edit Items';
      document.getElementById('editBtn').classList.toggle('text-blue-600', isEditMode);
      render();
    }

    function toggleCard(id) {
      if (isEditMode) return;
      if (expandedIds.has(id)) {
        expandedIds.delete(id);
      } else {
        expandedIds.add(id);
      }
      render();
    }

    function render() {
      const list = getData();
      const container = document.getElementById('cardsGrid');
      container.innerHTML = '';

      list.forEach(item => {
        let pct = 0;
        let ratioText = "";

        if (item.actions && item.actions.length > 0) {
          const total = item.actions.length;
          const done = item.actions.filter(a => a.done).length;
          pct = (done / total) * 100;

          if (item.unit === '$') {
            ratioText = `$${(item.targetVal * (pct / 100)).toFixed(2)} / $${item.targetVal.toFixed(2)}`;
          } else if (item.unit === 'mi' || item.unit === 'lb' || item.unit === 'Books') {
            const currentComputed = Math.round(item.targetVal * (pct / 100));
            ratioText = `${currentComputed} ${item.unit} / ${item.targetVal} ${item.unit}`;
          } else {
            ratioText = `${done} / ${total} Langkah Selesai`;
          }
        }

        const pctText = pct.toFixed(2) + '%';
        const theme = THEMES[item.theme] || THEMES.blue;
        const isExpanded = expandedIds.has(item.id);

        const cardCol = document.createElement('div');
        cardCol.className = 'w-full flex flex-col';

        cardCol.innerHTML = `
          <!-- Kapsul Progress Persis Referensi -->
          <div onclick="toggleCard('${item.id}')" class="progress-capsule" style="background-color: ${theme.tint};">
            
            <!-- Sisi Kiri Terisi (Solid Fill) -->
            <div class="h-full transition-all duration-500" style="width: ${pct}%; background-color: ${theme.fill};"></div>

            <!-- Teks Menimpa di Atas (Absolute Layout Khas Apple) -->
            <div class="absolute inset-0 px-6 py-4 flex flex-col justify-center pointer-events-none">
              
              <div class="flex justify-between items-center">
                <span class="text-[18px] font-bold tracking-tight" style="color: ${theme.textFill};">
                  ${item.title}
                </span>

                <div class="flex items-center space-x-2">
                  ${isEditMode ? `
                    <button onclick="event.stopPropagation(); deleteCard('${item.id}')" class="pointer-events-auto w-6 h-6 rounded-full bg-red-500 text-white font-bold text-xs flex items-center justify-center">
                      &times;
                    </button>
                  ` : `
                    ${item.hasBlocker ? `<span class="bg-rose-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">BLOCKER</span>` : ''}
                    <span class="text-xs font-bold transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" style="color: ${theme.textFill}; opacity: 0.85;">
                      ▼
                    </span>
                  `}
                </div>
              </div>

              <!-- Nilai Rasio (Misal: 14 / 30 Books) -->
              <span class="text-[13px] font-medium mt-0.5 opacity-90" style="color: ${theme.textFill};">
                ${ratioText}
              </span>

              <!-- Persentase (Misal: 46.67%) -->
              <span class="text-[13px] font-medium opacity-90" style="color: ${theme.textFill};">
                ${pctText}
              </span>

            </div>

          </div>

          <!-- Laci Accordion (Action Plans + PIC Assignee) -->
          <div class="accordion-drawer ${isExpanded ? 'open' : ''} bg-white rounded-3xl p-5 border border-gray-200/60 shadow-sm space-y-3">
            
            <div class="flex justify-between items-center text-xs text-gray-500 pb-2 border-b border-gray-100">
              <span>Lead PIC: <b class="text-gray-800">${item.pic}</b></span>
              ${item.hasBlocker ? `
                <span class="text-rose-600 font-bold">🚨 Blocker: ${item.blockerDesc}</span>
              ` : `
                <button onclick="addBlocker('${item.id}')" class="text-rose-600 font-semibold hover:underline">+ Laporkan Blocker</button>
              `}
            </div>

            <div class="space-y-2">
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Action Plans & Assignee:</span>
              ${item.actions.map((act, idx) => `
                <div class="flex items-center justify-between p-2.5 rounded-2xl border ${act.done ? 'bg-emerald-50/50 border-emerald-100' : 'bg-gray-50 border-gray-200/70'}">
                  <label class="flex items-center space-x-3 flex-1 cursor-pointer">
                    <input type="checkbox" ${act.done ? 'checked' : ''} onchange="toggleStep('${item.id}', ${idx}, this.checked)" class="apple-check">
                    <span class="text-xs transition-all duration-200 ${act.done ? 'line-through text-gray-400 font-normal' : 'text-gray-800 font-semibold'}">${act.text}</span>
                  </label>
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${act.done ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-200 text-gray-700'}">
                    ${act.pic || item.pic}
                  </span>
                </div>
              `).join('')}
            </div>

          </div>
        `;

        container.appendChild(cardCol);
      });
    }

    function toggleStep(id, idx, isDone) {
      const data = getData();
      const item = data.find(c => c.id === id);
      if (!item) return;

      item.actions[idx].done = isDone;
      saveData(data);
    }

    function addBlocker(id) {
      const desc = prompt("Tuliskan kendala / blocker:");
      if (!desc) return;
      const data = getData();
      const item = data.find(c => c.id === id);
      if (!item) return;

      item.hasBlocker = true;
      item.blockerDesc = desc;
      saveData(data);
    }

    function deleteCard(id) {
      if (!confirm("Hapus item ini?")) return;
      let data = getData();
      data = data.filter(c => c.id !== id);
      saveData(data);
    }

    // Modal Control
    function openModal() {
      document.getElementById('inpTitle').value = '';
      document.getElementById('inpPic').value = '';
      document.getElementById('inpUnit').value = 'Items';
      document.getElementById('taskModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.add('hidden');
    }

    function pickColor(c) {
      selectedTheme = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500'));
      event.target.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500');
    }

    function addField() {
      const box = document.getElementById('fieldsBox');
      const div = document.createElement('div');
      div.className = 'flex space-x-2';
      div.innerHTML = `
        <input type="text" placeholder="Langkah ${box.children.length + 1}" class="step-txt flex-1 px-3 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none">
        <input type="text" placeholder="PIC" class="step-pic w-24 px-2 py-2 bg-gray-100 rounded-xl text-xs focus:outline-none">
      `;
      box.appendChild(div);
    }

    function saveTask() {
      const title = document.getElementById('inpTitle').value.trim();
      const pic = document.getElementById('inpPic').value.trim() || 'Unassigned';
      const unit = document.getElementById('inpUnit').value.trim() || 'Items';

      const txts = document.querySelectorAll('.step-txt');
      const pics = document.querySelectorAll('.step-pic');
      const actions = [];

      txts.forEach((t, i) => {
        const val = t.value.trim();
        const p = pics[i]?.value.trim() || pic;
        if (val) {
          actions.push({ text: val, pic: p, done: false });
        }
      });

      if (!title) {
        alert("Mohon isi judul.");
        return;
      }

      if (actions.length === 0) {
        actions.push({ text: "Langkah utama", pic, done: false });
      }

      const data = getData();
      const newId = "d-" + Date.now();
      data.push({
        id: newId,
        title,
        theme: selectedTheme,
        pic,
        targetVal: actions.length,
        unit,
        actions,
        hasBlocker: false,
        blockerDesc: ""
      });

      expandedIds.add(newId);
      saveData(data);
      closeModal();
    }

    // Share WA
    function copyWA() {
      const list = getData();
      let msg = `*DAILY PROGRESS UPDATE*\n\n`;
      list.forEach((p, idx) => {
        const total = p.actions.length;
        const done = p.actions.filter(a => a.done).length;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);
        msg += `*${idx + 1}. ${p.title}*\n• Progress: ${pct}%\n• PIC: ${p.pic}\n`;
        if (p.hasBlocker) msg += `• 🚨 *BLOCKER:* ${p.blockerDesc}\n`;
        msg += `\n`;
      });

      navigator.clipboard.writeText(msg).then(() => {
        const t = document.getElementById('toast');
        t.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 2000);
      });
    }

    render();
  </script>

</body>
</html>
