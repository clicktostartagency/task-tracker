<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - Advanced Operational Suite</title>
  <style>
    :root {
      --apple-canvas: #f2f2f7;
      --apple-card: #ffffff;
      --apple-card-inset: rgba(0, 0, 0, 0.025);
      --apple-text: #1d1d1f;
      --apple-secondary: #86868b;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-specular: rgba(255, 255, 255, 0.9);
      --apple-sidebar: rgba(246, 246, 248, 0.88);
      --apple-header: rgba(255, 255, 255, 0.85);
      --apple-funnel-canvas: #edf5fa;
      --apple-blue: #0071e3;
      --apple-green: #34c759;
      --apple-red: #ff3b30;
      --apple-orange: #ff9500;
      --apple-purple: #af52de;
      --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --mayple-canvas: #faf8f5;
      --mayple-dark: #072a2a;
      --mayple-card: #ffffff;
      --mayple-accent: #f04d30;
      --mayple-border: rgba(0, 0, 0, 0.08);
    }
    .dark {
      --apple-canvas: #000000;
      --apple-card: #1c1c1e;
      --apple-card-inset: rgba(255, 255, 255, 0.04);
      --apple-text: #f5f5f7;
      --apple-secondary: #8e8e93;
      --apple-border: rgba(255, 255, 255, 0.12);
      --apple-border-specular: rgba(255, 255, 255, 0.12);
      --apple-sidebar: rgba(24, 24, 26, 0.88);
      --apple-header: rgba(20, 20, 22, 0.85);
      --apple-funnel-canvas: #121c26;
      --apple-blue: #2997ff;
      --mayple-canvas: #0d1717;
      --mayple-dark: #051414;
      --mayple-card: #141f1f;
      --mayple-border: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: -0.021em;
    }
    body {
      background-color: var(--apple-canvas);
      color: var(--apple-text);
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .apple-sidebar-frame {
      width: 240px;
      height: 100%;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-right: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s var(--apple-spring);
      z-index: 20;
    }
    .apple-sidebar-frame.collapsed { width: 72px; }
    .apple-sidebar-frame.collapsed .hide-collapsed { display: none !important; }

    .apple-traffic-lights {
      padding: 1.15rem 1rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .traffic-dots { display: flex; gap: 7px; }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .nav-group { padding: 0 0.5rem; display: flex; flex-direction: column; gap: 3px; }
    .apple-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .apple-nav-item:hover { background: rgba(0, 0, 0, 0.04); color: var(--apple-text); }
    .dark .apple-nav-item:hover { background: rgba(255, 255, 255, 0.06); }
    .apple-nav-item.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
      font-weight: 600;
    }
    .nav-badge {
      font-family: -apple-system, monospace;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: var(--apple-secondary);
    }
    .active .nav-badge { background: var(--apple-blue); color: #ffffff; }

    .apple-canvas-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--apple-canvas);
      position: relative;
    }
    .apple-navbar-header {
      height: 52px;
      background: var(--apple-header);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      flex-shrink: 0;
      z-index: 15;
    }
    .apple-canvas-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .macos-segmented-bar {
      position: relative;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      align-items: center;
      border: 0.5px solid var(--apple-border);
    }
    .dark .macos-segmented-bar { background: rgba(255, 255, 255, 0.08); }
    .seg-pill-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 4);
      background: var(--apple-card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      transition: transform 0.28s var(--apple-spring);
      z-index: 1;
    }
    .seg-btn {
      position: relative;
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      background: transparent;
      border: none;
      color: var(--apple-secondary);
      cursor: pointer;
      z-index: 2;
      transition: color 0.18s ease;
    }
    .seg-btn.active { color: var(--apple-text); }

    /* Fitur 5: SLA Escalation Aura */
    .apple-card-box {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 6px 18px rgba(0, 0, 0, 0.025), inset 0 1px 0 var(--apple-border-specular);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.25s var(--apple-spring);
    }
    .sla-aura-warning {
      border-color: rgba(255, 149, 0, 0.5) !important;
      box-shadow: 0 0 16px rgba(255, 149, 0, 0.15), inset 0 1px 0 var(--apple-border-specular) !important;
    }
    .sla-aura-breach {
      border-color: rgba(255, 59, 48, 0.6) !important;
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.2), inset 0 1px 0 var(--apple-border-specular) !important;
    }

    .card-collapsible-header {
      padding: 1.2rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .card-collapsible-header:hover { background-color: rgba(0, 0, 0, 0.015); }
    .dark .card-collapsible-header:hover { background-color: rgba(255, 255, 255, 0.02); }
    .card-body-drawer {
      padding: 0 1.35rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      border-top: 0.5px solid var(--apple-border);
    }
    .card-body-drawer.collapsed { display: none !important; }
    .chevron-icon {
      width: 14px;
      height: 14px;
      color: var(--apple-secondary);
      transition: transform 0.25s var(--apple-spring);
    }
    .chevron-icon.rotate { transform: rotate(180deg); }

    .apple-pill-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card);
      color: var(--apple-text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .apple-pill-btn:hover { background: rgba(0, 0, 0, 0.03); }
    .dark .apple-pill-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .apple-btn-primary {
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--apple-blue);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .apple-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      font-family: -apple-system, monospace;
      letter-spacing: 0.04em;
    }
    .tag-scale { background: rgba(52, 199, 89, 0.12); color: var(--apple-green); border: 0.5px solid rgba(52, 199, 89, 0.25); }
    .tag-critical { background: rgba(255, 59, 48, 0.12); color: var(--apple-red); border: 0.5px solid rgba(255, 59, 48, 0.25); }
    .tag-watchlist { background: rgba(255, 149, 0, 0.12); color: var(--apple-orange); border: 0.5px solid rgba(255, 149, 0, 0.25); }

    .funnel-apple-canvas {
      background: var(--apple-funnel-canvas);
      border-radius: 18px;
      padding: 1.75rem 1.25rem;
      border: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .funnel-title-capsule {
      background: var(--apple-blue);
      color: #ffffff;
      padding: 0.45rem 1.6rem;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
      cursor: text;
      margin-bottom: 1.25rem;
    }
    .funnel-banner-tab {
      display: flex;
      align-items: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      height: 38px;
      padding: 0 1.25rem 0 1.85rem;
      clip-path: polygon(16px 0%, 100% 0%, 100% 100%, 0% 100%);
      border-radius: 0 8px 8px 0;
      transition: transform 0.18s var(--apple-spring), filter 0.18s ease;
    }
    .funnel-banner-tab:hover { filter: brightness(1.12); transform: translateX(3px); }

    .leak-pill {
      font-size: 9px;
      font-family: -apple-system, monospace;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 59, 48, 0.12);
      color: var(--apple-red);
      border: 0.5px solid rgba(255, 59, 48, 0.25);
      cursor: pointer;
      white-space: nowrap;
    }

    .apple-stepper-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.1rem 0;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .step-item { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .step-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: -apple-system, monospace;
    }
    .step-dot.done { background: var(--apple-blue); color: #ffffff; }
    .step-dot.active { border: 2px solid var(--apple-blue); color: var(--apple-blue); background: var(--apple-card); }
    .step-dot.pending { background: rgba(0, 0, 0, 0.06); color: var(--apple-secondary); }
    .dark .step-dot.pending { background: rgba(255, 255, 255, 0.1); }
    .step-connector { flex: 1; height: 2px; margin: 0 10px; border-radius: 2px; }
    .step-connector.active { background: var(--apple-blue); }
    .step-connector.pending { background: var(--apple-border); }

    .tracklist-header {
      display: flex;
      align-items: center;
      padding: 0.55rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }
    
    /* Fitur 3: Drag-and-Drop Task Styling */
    .tracklist-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 12px;
      cursor: grab;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .tracklist-item.dragging {
      opacity: 0.4;
      background-color: rgba(0, 113, 227, 0.08) !important;
    }
    .tracklist-item.drag-over-indicator {
      border-top: 2px solid var(--apple-blue);
    }
    .drag-handle-grip {
      color: var(--apple-secondary);
      cursor: grab;
      margin-right: 8px;
      font-size: 12px;
      line-height: 1;
      opacity: 0.5;
    }
    .drag-handle-grip:hover { opacity: 1; }

    .apple-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #d1d1d6;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .apple-checkbox:checked { background: var(--apple-blue); border-color: var(--apple-blue); }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 7.5px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .inline-editable {
      cursor: text;
      border-radius: 4px;
      padding: 1px 4px;
      transition: background 0.15s ease;
    }
    .inline-editable:hover { background: rgba(0, 113, 227, 0.1); }
    .inline-editable:focus {
      outline: 1.5px solid var(--apple-blue);
      background: var(--apple-card);
    }

    /* Gantt Table */
    .gantt-table { width: 100%; min-width: 740px; border-collapse: collapse; font-size: 11px; }
    .gantt-table th, .gantt-table td { padding: 0.55rem; border-bottom: 0.5px solid var(--apple-border); }
    .gantt-grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); height: 100%; text-align: center; position: relative; }
    .gantt-col-line { border-right: 0.5px dashed var(--apple-border); }
    .capsule-pill {
      border-radius: 20px;
      padding: 1px 8px;
      font-size: 10px;
      font-family: -apple-system, monospace;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
      margin: 2px 0;
    }
    .capsule-pink { background: rgba(219, 39, 119, 0.12); color: #be185d; border: 0.5px solid rgba(219, 39, 119, 0.25); }
    .capsule-green { background: rgba(52, 199, 89, 0.12); color: #15803d; border: 0.5px solid rgba(52, 199, 89, 0.25); }
    .capsule-brown { background: #7c2d12; color: #ffffff; }
    .capsule-dashed { border: 1px dashed var(--apple-purple); color: var(--apple-purple); }

    .gantt-stepper-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.12);
      color: currentColor;
      font-weight: 800;
      font-size: 11px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .gantt-stepper-btn:hover { background: rgba(0, 0, 0, 0.25); }
    .dark .gantt-stepper-btn { background: rgba(255, 255, 255, 0.2); }
    .dark .gantt-stepper-btn:hover { background: rgba(255, 255, 255, 0.4); }

    .cap-heat-none { color: var(--apple-secondary); }
    .cap-heat-optimal { background: rgba(52, 199, 89, 0.16); color: var(--apple-green); border-radius: 4px; }
    .cap-heat-dense { background: rgba(255, 149, 0, 0.2); color: #d97706; border-radius: 4px; font-weight: 700; }
    .cap-heat-over { background: rgba(255, 59, 48, 0.25); color: var(--apple-red); border-radius: 4px; font-weight: 800; }

    .apple-dynamic-island {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(29, 29, 31, 0.95);
      backdrop-filter: blur(25px);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.32s var(--apple-spring);
      z-index: 100;
    }
    .apple-dynamic-island.active { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
    .island-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--apple-green); }

    .spotlight-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(35px) saturate(190%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 95;
    }
    .spotlight-backdrop.active { opacity: 1; pointer-events: auto; }
    .spotlight-window {
      width: 540px;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--apple-border-specular);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .spotlight-input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: none;
      background: transparent;
      font-size: 16px;
      color: var(--apple-text);
      outline: none;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .spotlight-results { max-height: 280px; overflow-y: auto; padding: 0.5rem; }
    .spotlight-item {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .spotlight-item:hover { background: var(--apple-blue); color: #ffffff; }

    .apple-inspector-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-left: 0.5px solid var(--apple-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s var(--apple-spring);
      z-index: 50;
    }
    .apple-inspector-drawer.open { transform: translateX(0); }
    .inspector-header {
      padding: 1rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inspector-body {
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-size: 12px;
    }
    .inspector-block {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .countdown-urgent { color: var(--apple-red) !important; font-weight: 700 !important; }

    /* Mayple UI Elements */
    .mayple-phone-frame {
      width: 100%;
      max-width: 440px;
      background: var(--mayple-canvas);
      border-radius: 36px;
      border: 1px solid var(--mayple-border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }
    .mayple-phone-header {
      padding: 1.25rem 1.4rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mayple-logo-mark {
      font-size: 18px;
      font-weight: 800;
      color: #14171a;
      letter-spacing: -0.04em;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .dark .mayple-logo-mark { color: #ffffff; }
    .mayple-logo-bars {
      color: var(--mayple-accent);
      font-weight: 900;
      margin-right: 1px;
    }
    .mayple-headline {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      color: #111417;
      padding: 0.75rem 1.4rem 1.25rem;
    }
    .dark .mayple-headline { color: #f5f5f7; }

    .mayple-avatar-hero {
      position: relative;
      width: 100%;
      height: 240px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }
    .mayple-hero-cutout {
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--mayple-dark);
      z-index: 1;
    }
    .mayple-hero-portrait {
      position: relative;
      z-index: 2;
      width: 210px;
      height: auto;
      object-fit: cover;
    }

    .mayple-info-card {
      background: var(--mayple-card);
      border-top: 1px solid var(--mayple-border);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .mayple-title-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .mayple-action-btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--mayple-accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 400;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(240, 77, 48, 0.35);
      transition: transform 0.15s ease;
    }

      try {

        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        let freq = 1200, duration = 0.025;
        if (type === 'tab') { freq = 600; duration = 0.035; }
        if (type === 'done') { freq = 880; duration = 0.08; }
        if (type === 'leak') { freq = 340; duration = 0.09; }
        if (type === 'export') { freq = 980; duration = 0.06; }

        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function formatRupiahShort(amount) {
      if (!amount) return 'Rp 0';
      if (amount >= 1000000) return 'Rp ' + (amount / 1000000).toFixed(1) + 'M';
      if (amount >= 1000) return 'Rp ' + (amount / 1000).toFixed(0) + 'K';
      return 'Rp ' + amount;
    }

    function parseNumericRupiah(str) {
      if (!str) return 0;
      let clean = String(str).toLowerCase().replace(/rp|\.|\s/g, '').replace(',', '.');
      if (clean.endsWith('m')) return (parseFloat(clean) || 0) * 1000000;
      if (clean.endsWith('k')) return (parseFloat(clean) || 0) * 1000;
      return parseFloat(clean) || 0;
    }

    function calculateTimeRemaining(deadlineISO) {
      if (!deadlineISO) return { text: "No deadline", isUrgent: false, isOverdue: false, diffHours: 999 };
      const deadline = new Date(deadlineISO).getTime();
      const now = new Date().getTime();
      const diff = deadline - now;
      const diffHours = diff / (1000 * 60 * 60);

      if (diff <= 0) return { text: "Overdue", isUrgent: true, isOverdue: true, diffHours: 0 };
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      const isUrgent = diffHours < 24;
      let text = days > 0 ? `${days}d ${hours}h ${minutes}m ${seconds}s` : `${hours}h ${minutes}m ${seconds}s`;
      return { text, isUrgent, isOverdue: false, diffHours };
    }

    function updateLiveCountdowns() {
      const countdownNodes = document.querySelectorAll('[data-deadline]');
      countdownNodes.forEach(node => {
        const isDone = node.getAttribute('data-done') === 'true';
        if (isDone) {
          node.innerText = "Completed";
          node.className = "countdown-display font-mono text-[11px] text-neutral-400";
          return;
        }
        const deadlineISO = node.getAttribute('data-deadline');
        const res = calculateTimeRemaining(deadlineISO);
        node.innerText = res.text;
        node.className = "countdown-display font-mono text-[11px] " + (res.isUrgent || res.isOverdue ? "countdown-urgent" : "text-neutral-500");
      });
    }
    setInterval(updateLiveCountdowns, 1000);

        const total = c.actions.length;
        const done = c.actions.filter(a => a.done).length;
        const slaRem = calculateTimeRemaining(c.handoverSlaISO);

        lines.push(`## CLIENT: ${c.title.toUpperCase()}`);
        lines.push(`• Lead PIC: ${c.lead}`);
        lines.push(`• Ad Spend: ${formatRupiahShort(c.spendNum)} | Revenue: ${formatRupiahShort(c.revenueNum)} | ROAS: ${roas}x (BE: ${c.beRoas.toFixed(2)}x)`);
        lines.push(`• Handover SLA: ${slaRem.text}`);
        if (c.blocker) lines.push(`• BLOCKER ALERT: ${c.blocker}`);
        lines.push(`• Deliverables: ${done}/${total} Completed`);
        c.actions.forEach(a => {
          lines.push(`  - [${a.done ? 'X' : ' '}] ${a.text} (${a.pic})`);
        });
        lines.push(`\n`);
      });

      const fullText = lines.join('\n');
      navigator.clipboard.writeText(fullText);
      triggerDynamicIsland('Executive Brief Copied to Clipboard');
    }

    function exportDataToCSV() {
      playHapticTone('export');
      let csvRows = [
        ["Client Title", "Lead PIC", "Spend", "Revenue", "ROAS", "BE Target", "Handover SLA", "Blocker", "Deliverable Task", "Task PIC", "Status", "Deadline"].join(",")
      ];

      APP_STATE.clients.forEach(c => {
        const roas = c.spendNum > 0 ? (c.revenueNum / c.spendNum).toFixed(2) : "0.00";
        c.actions.forEach(a => {
          const row = [
            `"${c.title}"`,
            `"${c.lead}"`,
            c.spendNum,
            c.revenueNum,
            roas,
            c.beRoas,
            `"${c.handoverSlaISO || ''}"`,
            `"${c.blocker || 'None'}"`,
            `"${a.text}"`,
            `"${a.pic}"`,
            a.done ? "Completed" : "In Progress",
            `"${a.deadlineISO || ''}"`
          ];
          csvRows.push(row.join(","));
        });
      });

      const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent(csvRows.join("\n"));
      const link = document.createElement("a");
      link.setAttribute("href", csvContent);
      link.setAttribute("download", `Agency_Operations_Hub_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      triggerDynamicIsland('CSV Spreadsheet Exported');

    function handleDragOver(e) {

      e.currentTarget.classList.add('drag-over-indicator');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over-indicator');
    }

    function handleDrop(e, targetCIdx, targetAIdx) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-indicator');

      if (!APP_STATE.draggedItem) return;
      const { cIdx: sourceCIdx, aIdx: sourceAIdx } = APP_STATE.draggedItem;

      // Hanya reorder di client yang sama
      if (sourceCIdx === targetCIdx && sourceAIdx !== targetAIdx) {
        const list = APP_STATE.clients[sourceCIdx].actions;
        const [moved] = list.splice(sourceAIdx, 1);
        list.splice(targetAIdx, 0, moved);
        playHapticTone('done');
        syncState('Task Priority Reordered');
      }
      APP_STATE.draggedItem = null;
    }

      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.tracklist-item').forEach(el => el.classList.remove('drag-over-indicator'));

    // 2. PROJECTS VIEW (Dengan Fitur 3: Drag & Drop Priority Reordering)

        const total = c.actions.length;
        const doneCount = c.actions.filter(a => a.done).length;
        const pct = total ? (doneCount / total) : 0;
        let step = pct >= 1.0 ? 4 : pct >= 0.65 ? 3 : pct >= 0.25 ? 2 : 1;

        return `
          <div class="apple-card-box">

              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="apple-pill-btn" style="font-size: 10px;">Stage ${step}: ${step === 4 ? 'Live' : step === 3 ? 'QA' : step === 2 ? 'Prod' : 'Brief'}</span>

    // 4. TALENT HUB
    function renderTalentHubView() {
      const phoneLeft = document.getElementById('talent-phone-container');
      const phoneRight = document.getElementById('talent-todo-container');
      if (!phoneLeft || !phoneRight) return;

      const talent = APP_STATE.talents.find(t => t.id === APP_STATE.activeTalentId) || APP_STATE.talents[0];

      let talentTasks = [];
      APP_STATE.clients.forEach((c, cIdx) => {
        c.actions.forEach((a, aIdx) => {
          if (a.pic.toLowerCase().includes(talent.name.split(' ')[0].toLowerCase())) {
            talentTasks.push({ ...a, clientTitle: c.title, cIdx, aIdx });
          }
        });
      });

      const totalTasks = talentTasks.length;
      const finishedTasks = talentTasks.filter(t => t.done).length;
      const workloadPct = totalTasks ? Math.round((finishedTasks / totalTasks) * 100) : 0;

      phoneLeft.innerHTML = `
        <div class="mayple-phone-header">
          <div class="mayple-logo-mark"><span class="mayple-logo-bars">=</span>agency</div>
          <select onchange="switchActiveTalent(this.value)" style="border: 0.5px solid var(--mayple-border); background: var(--mayple-card); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 20px; outline: none; cursor: pointer;">
            ${APP_STATE.talents.map(t => `<option value="${t.id}" ${t.id === talent.id ? 'selected' : ''}>${t.name.split(' ')[0]}</option>`).join('')}
          </select>
        </div>

        <div class="mayple-headline">Find your agency's top vetted marketing experts</div>

        <div class="mayple-avatar-hero">
          <div class="mayple-hero-cutout"></div>
          <svg class="mayple-hero-portrait" viewBox="0 0 200 240" fill="none">
            <circle cx="100" cy="95" r="50" fill="${talent.avatarSvgColor}"/>
            <circle cx="86" cy="92" r="14" stroke="#1d1d1f" stroke-width="3" fill="none"/>
            <circle cx="114" cy="92" r="14" stroke="#1d1d1f" stroke-width="3" fill="none"/>
            <line x1="100" y1="92" x2="100" y2="92" stroke="#1d1d1f" stroke-width="3"/>
            <path d="M 88 116 Q 100 126 112 116" stroke="#1d1d1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M 50 240 C 50 170 150 170 150 240 Z" fill="#1c2c36"/>
            <line x1="65" y1="195" x2="135" y2="195" stroke="#ffffff" stroke-width="3.5"/>
            <line x1="60" y1="212" x2="140" y2="212" stroke="#ffffff" stroke-width="3.5"/>
            <line x1="55" y1="228" x2="145" y2="228" stroke="#ffffff" stroke-width="3.5"/>
          </svg>
        </div>

        <div class="mayple-info-card">
          <div class="mayple-title-bar">
            <div>
              <h2 style="font-size: 18px; font-weight: 800; color: var(--apple-text);">${talent.name}</h2>
              <div style="display: flex; align-items: center; gap: 4px; margin-top: 3px;">
                <b style="font-size: 12px; color: var(--apple-text);">${talent.rating}</b>
                <span style="color: var(--mayple-accent); font-size: 11px;">★★★★★</span>
                <span style="font-size: 10px; color: var(--apple-secondary);">(${talent.reviewsCount} reviews)</span>
              </div>
            </div>
            <button onclick="pingTalentWhatsApp('${talent.phone}', '${talent.name}')" class="mayple-action-btn-circle" title="Chat Talent via WhatsApp">+</button>
          </div>

          <p style="font-size: 11px; color: var(--apple-secondary); line-height: 1.45;">${talent.bio}</p>

          <div class="mayple-matrix-grid">
            <div class="mayple-matrix-col">
              <span class="mayple-matrix-label">MARKETING EXPERTISE:</span>
              <span class="mayple-matrix-value">${talent.expertise}</span>
            </div>
            <div class="mayple-matrix-col">
              <span class="mayple-matrix-label">EXPERIENCE:</span>
              <span class="mayple-matrix-value">${talent.experience}</span>
            </div>
            <div class="mayple-matrix-col">
              <span class="mayple-matrix-label">WORKED WITH:</span>
              <span class="mayple-matrix-value">${talent.workedWith}</span>
            </div>
            <div class="mayple-matrix-col">
              <span class="mayple-matrix-label">AVG. INCREASE IN SALES:</span>
              <span class="mayple-matrix-value" style="color: var(--apple-green); font-weight: 800;">${talent.avgSalesGrowth}</span>
            </div>
          </div>
        </div>
      `;

      phoneRight.innerHTML = `
        <div class="mayple-phone-header">
          <div class="mayple-logo-mark"><span class="mayple-logo-bars">=</span>tasks</div>
          <span style="font-size: 11px; font-weight: 700; color: var(--apple-secondary); font-family: monospace;">${finishedTasks}/${totalTasks} DONE</span>
        </div>

        <div class="mayple-headline" style="padding-bottom: 0.5rem;">A home for your marketing talent's deliverables</div>

        <div style="padding: 0 1.4rem 1rem;">
          <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--apple-secondary); font-weight: 600; margin-bottom: 5px;">
            <span>Sprint Execution Rate</span>
            <span>${workloadPct}%</span>
          </div>
          <div class="workload-gauge">
            <div style="width: ${workloadPct}%; background: var(--apple-green); height: 100%; transition: width 0.3s ease;"></div>
          </div>
        </div>

        <div style="padding: 0 1.4rem; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto;">
          ${talentTasks.map(task => {
            const rem = calculateTimeRemaining(task.deadlineISO);
            return `
              <div style="background: var(--mayple-canvas); border: 0.5px solid var(--mayple-border); border-radius: 14px; padding: 0.85rem; display: flex; align-items: flex-start; gap: 10px;">
                <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTaskDone(${task.cIdx},${task.aIdx})" class="apple-checkbox" style="margin-top: 2px;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
                  <span style="font-size: 12px; font-weight: 600; ${task.done ? 'text-decoration: line-through; color: var(--apple-secondary);' : 'color: var(--apple-text);'}">
                    ${task.text}
                  </span>
                  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--apple-secondary); font-family: monospace;">
                    <span>${task.clientTitle} &bull; ${task.label}</span>
                    <span class="${task.done ? '' : rem.isUrgent ? 'countdown-urgent' : ''}">${task.done ? 'Tuntas' : rem.text}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('') || `<div style="text-align: center; color: var(--apple-secondary); font-size: 12px; padding: 2rem;">Tidak ada deliverable aktif untuk ${talent.name}.</div>`}
        </div>

        <div class="mayple-dark-deck" style="margin-top: 1rem;">
          <div class="mayple-dark-title">Why is collaborating with Mayple talent such a sweet deal?</div>
          <div class="mayple-pill-tile" onclick="pingTalentWhatsApp('${talent.phone}', '${talent.name}')">
            <span>💬</span><span>Easily connect with your talent</span>
          </div>
          <div class="mayple-pill-tile" onclick="triggerDynamicIsland('Meta & CAPI verified telemetry active')">
            <span>⚡</span><span>Free use of technology tools</span>
          </div>
        </div>
      `;
    }

    function switchActiveTalent(talentId) {
      APP_STATE.activeTalentId = talentId;
      playHapticTone('tab');
      renderTalentHubView();
      const tal = APP_STATE.talents.find(t => t.id === talentId);
      triggerDynamicIsland(`Switched to ${tal.name}`);
    }

    function pingTalentWhatsApp(phoneNumber, name) {
      playHapticTone('click');
      const text = encodeURIComponent(`Halo ${name}, koordinasi sprint deliverables Agency Operations Hub.`);
      window.open(`https://wa.me/${phoneNumber.replace(/[^0-9]/g, '')}?text=${text}`, '_blank');
    }

    // ========================================================
    // IN-PLACE EDITING COMMITS & HAPTICS
    // ========================================================
    function commitInlineSpend(cIdx, textVal, isSpend) {
      const num = parseNumericRupiah(textVal);
      if (isSpend) APP_STATE.clients[cIdx].spendNum = num;
      else APP_STATE.clients[cIdx].revenueNum = num;
      playHapticTone('done');
      syncState(`Spend ${APP_STATE.clients[cIdx].title} Updated`);
    }

    function commitHandoverSLA(cIdx, dateStr) {
      APP_STATE.clients[cIdx].handoverSlaISO = dateStr ? new Date(dateStr).toISOString() : APP_STATE.clients[cIdx].handoverSlaISO;
      playHapticTone('done');
      syncState(`Handover SLA updated for ${APP_STATE.clients[cIdx].title}`);
    }

    function commitFunnelTitle(cIdx, textVal) {
      APP_STATE.clients[cIdx].funnelTitle = textVal.trim() || 'The Ecommerce Funnel';
      playHapticTone('done');
      syncState('Funnel Title Saved');
    }

    function commitTaskName(cIdx, aIdx, textVal) {
      APP_STATE.clients[cIdx].actions[aIdx].text = textVal.trim() || APP_STATE.clients[cIdx].actions[aIdx].text;
      playHapticTone('done');
      syncState('Deliverable Renamed');
    }

    function commitStageVal(cIdx, sIdx, textVal) {
      const num = parseInt(String(textVal).replace(/[^0-9]/g, '')) || 0;
      APP_STATE.clients[cIdx].funnelStages[sIdx].val = num;
      playHapticTone('done');
      syncState('Stage Value Updated');
    }

    function commitStageName(cIdx, sIdx, textVal) {
      APP_STATE.clients[cIdx].funnelStages[sIdx].name = textVal.trim() || APP_STATE.clients[cIdx].funnelStages[sIdx].name;
      playHapticTone('done');
      syncState('Stage Name Updated');
    }

    function commitCapacityCell(cIdx, capIdx, textVal) {
      const clean = textVal.replace(/h/g, '').trim();
      APP_STATE.clients[cIdx].dailyCapacity[capIdx] = clean;
      playHapticTone('done');
      syncState('Workload Capacity Updated');
    }

    function stepGanttSpan(actId, cIdx, delta) {
      const act = APP_STATE.clients[cIdx].actions.find(a => a.id === actId);
      if (!act) return;
      const start = act.startCol || 0;
      const maxSpan = 12 - start;
      const currentSpan = act.spanCol || 1;
      const targetSpan = Math.max(1, Math.min(maxSpan, currentSpan + delta));

      if (targetSpan !== currentSpan) {
        act.spanCol = targetSpan;
        playHapticTone('click');
        syncState(`Duration set to ${targetSpan} days`);
      }
    }

    function explainLeak(leakStage, pct) {
      playHapticTone('leak');
      triggerDynamicIsland(`Leak Warning: ${leakStage} drop -${pct}%`);
    }

    function toggleTaskDone(cIdx, aIdx) {
      const target = APP_STATE.clients[cIdx].actions[aIdx];
      target.done = !target.done;
      playHapticTone(target.done ? 'done' : 'click');
      syncState(target.done ? 'Task Completed' : 'Task Incomplete');
    }

    function openInspector(actId) {
      let foundAct = null;
      let foundClient = null;

      APP_STATE.clients.forEach(c => {
        const a = c.actions.find(item => item.id === actId);
        if (a) { foundAct = a; foundClient = c; }
      });

      if (!foundAct) return;
      APP_STATE.selectedTaskId = actId;
      playHapticTone('tab');

      const drawer = document.getElementById('inspector-drawer');
      const content = document.getElementById('inspector-content');

      content.innerHTML = `
        <div class="inspector-block">
          <span style="font-size: 10px; font-weight: 700; color: var(--apple-secondary); font-family: monospace;">TASK OVERVIEW</span>
          <b class="inline-editable" contenteditable="true" onblur="commitTaskNameDirect('${foundAct.id}', this.innerText)" style="font-size: 13px;">${foundAct.text}</b>
          <span style="color: var(--apple-secondary); font-size: 11px;">Client: <b>${foundClient.title}</b> &bull; Division: ${foundAct.label}</span>
        </div>

        <div class="inspector-block">
          <span style="font-size: 10px; font-weight: 700; color: var(--apple-secondary); font-family: monospace;">ASSIGNEE &amp; TIME</span>
          <div>Lead PIC: <b>${foundAct.pic}</b></div>
          <div>Deadline: <input type="datetime-local" value="${foundAct.deadlineISO ? new Date(foundAct.deadlineISO).toISOString().slice(0, 16) : ''}" onchange="commitTaskDeadlineDirect('${foundAct.id}', this.value)" style="border: 0.5px solid var(--apple-border); background: var(--apple-canvas); font-size: 11px; padding: 2px 6px; border-radius: 6px; font-family: monospace; outline: none;"></div>
          <div>Status: <b>${foundAct.done ? 'Finished' : 'In Progress'}</b></div>
        </div>

        <div class="inspector-block">
          <span style="font-size: 10px; font-weight: 700; color: var(--apple-secondary); font-family: monospace;">INTERNAL LOG &amp; NOTES</span>
          <p class="inline-editable" contenteditable="true" onblur="commitTaskNotesDirect('${foundAct.id}', this.innerText)" style="color: var(--apple-text); line-height: 1.4;">${foundAct.notes || 'Klik untuk menambahkan catatan detail teknis.'}</p>
        </div>

        <button onclick="deleteCurrentInspectedTask()" style="padding: 8px; border-radius: 10px; border: 0.5px solid rgba(255,59,48,0.3); background: rgba(255,59,48,0.1); color: var(--apple-red); font-weight: 600; cursor: pointer;">Delete Deliverable</button>
      `;

      drawer.classList.add('open');
    }

    function closeInspector() {
      document.getElementById('inspector-drawer').classList.remove('open');
      APP_STATE.selectedTaskId = null;
      playHapticTone('click');
    }

    function commitTaskNameDirect(actId, name) {
      APP_STATE.clients.forEach(c => {
        const a = c.actions.find(item => item.id === actId);
        if (a) a.text = name.trim() || a.text;
      });
      syncState('Deliverable Renamed');
    }

    function commitTaskDeadlineDirect(actId, dateStr) {
      APP_STATE.clients.forEach(c => {
        const a = c.actions.find(item => item.id === actId);
        if (a) a.deadlineISO = dateStr ? new Date(dateStr).toISOString() : a.deadlineISO;
      });
      syncState('Deadline Updated');
    }

    function commitTaskNotesDirect(actId, notes) {
      APP_STATE.clients.forEach(c => {
        const a = c.actions.find(item => item.id === actId);
        if (a) a.notes = notes.trim();
      });
      syncState('Notes Saved');
    }

    function deleteCurrentInspectedTask() {
      if (!APP_STATE.selectedTaskId) return;
      APP_STATE.clients.forEach(c => {
        c.actions = c.actions.filter(a => a.id !== APP_STATE.selectedTaskId);
      });
      closeInspector();
      syncState('Deliverable Deleted');
    }

    function openSpotlight() {
      const palette = document.getElementById('spotlight-palette');
      const input = document.getElementById('spotlight-search');
      palette.classList.add('active');
      input.value = '';
      filterSpotlight('');
      input.focus();
      playHapticTone('tab');
    }

    function closeSpotlight() {
      document.getElementById('spotlight-palette').classList.remove('active');
    }

    function closeSpotlightOnOutside(e) {
      if (e.target.id === 'spotlight-palette') closeSpotlight();
    }

    function filterSpotlight(query) {
      const results = document.getElementById('spotlight-results');
      const q = query.toLowerCase().trim();

      const commands = [
        { title: "Export Data to CSV", action: () => { closeSpotlight(); exportDataToCSV(); } },
        { title: "Copy Executive Performance Brief", action: () => { closeSpotlight(); copyExecutiveBrief(); } },
        { title: "Switch to Funnels View", action: () => { switchTab('home'); closeSpotlight(); } },
        { title: "Switch to Projects View", action: () => { switchTab('projects'); closeSpotlight(); } },
        { title: "Switch to Timeline View", action: () => { switchTab('timeline'); closeSpotlight(); } },
        { title: "Switch to Talent Hub (Mayple)", action: () => { switchTab('talent'); closeSpotlight(); } },
        { title: "Toggle Summary (Collapse All)", action: () => { toggleAllCardsCollapse(); closeSpotlight(); } },
        { title: "Toggle Dark / Light Mode", action: () => { toggleTheme(); closeSpotlight(); } }
      ];

      APP_STATE.clients.forEach((c) => {
        commands.push({
          title: `Jump to Client: ${c.title}`,
          action: () => { switchTab('home'); closeSpotlight(); triggerDynamicIsland(`Focused on ${c.title}`); }
        });
      });

      APP_STATE.talents.forEach(t => {
        commands.push({
          title: `View Talent: ${t.name}`,
          action: () => { switchActiveTalent(t.id); switchTab('talent'); closeSpotlight(); }
        });
      });

      const filtered = commands.filter(cmd => cmd.title.toLowerCase().includes(q));

      results.innerHTML = filtered.map((cmd, idx) => `
        <div class="spotlight-item" onclick="executeSpotlight(${idx})">
          <span>${cmd.title}</span>
          <span style="font-size: 10px; opacity: 0.6; font-family: monospace;">ACTION</span>
        </div>
      `).join('') || `<div style="padding: 1rem; text-align: center; color: var(--apple-secondary); font-size: 12px;">No matching command</div>`;

      window.spotlightCurrentCommands = filtered;
    }

    function executeSpotlight(idx) {
      if (window.spotlightCurrentCommands && window.spotlightCurrentCommands[idx]) {
        window.spotlightCurrentCommands[idx].action();
      }
    }

    function trafficAction(actionType) {
      playHapticTone('click');
      if (actionType === 'toggle-sidebar') {
        toggleSidebar();
      } else if (actionType === 'collapse-all') {
        toggleAllCardsCollapse();
      } else if (actionType === 'toggle-fullscreen') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          triggerDynamicIsland('Entered Fullscreen');
        } else {
          document.exitFullscreen().catch(() => {});
          triggerDynamicIsland('Exited Fullscreen');
        }
      }
    }

    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      playHapticTone('tab');

      const pill = document.getElementById('segPill');
      const idx = tabId === 'home' ? 0 : tabId === 'projects' ? 1 : tabId === 'timeline' ? 2 : 3;
      pill.style.transform = `translateX(${idx * 100}%)`;

      ['home', 'projects', 'timeline', 'talent'].forEach(t => {
        const view = document.getElementById('view-' + t);
        const btn = document.getElementById('tabBtn-' + t);
        const seg = document.getElementById('segBtn-' + t);
        if (view && btn) {
          if (t === tabId) {
            view.style.display = 'flex';
            btn.classList.add('active');
            if (seg) seg.classList.add('active');
          } else {
            view.style.display = 'none';
            btn.classList.remove('active');
            if (seg) seg.classList.remove('active');
          }
        }
      });
      updateLiveCountdowns();
    }

    function toggleSidebar() {
      APP_STATE.sidebarCollapsed = !APP_STATE.sidebarCollapsed;
      document.getElementById('app-sidebar').classList.toggle('collapsed', APP_STATE.sidebarCollapsed);
      playHapticTone('click');
    }

    function toggleTheme() {
      APP_STATE.isDark = !APP_STATE.isDark;
      localStorage.setItem('agency_app_dark', APP_STATE.isDark ? 'true' : 'false');
      document.documentElement.classList.toggle('dark', APP_STATE.isDark);
      playHapticTone('click');
      triggerDynamicIsland(APP_STATE.isDark ? 'Dark Mode Active' : 'Light Mode Active');
    }

    function addNewClientDirect() {
      const defaultHandover = new Date();
      defaultHandover.setDate(defaultHandover.getDate() + 7);
      defaultHandover.setHours(18, 0, 0, 0);

      const defaultDeadline = new Date();
      defaultDeadline.setDate(defaultDeadline.getDate() + 4);
      defaultDeadline.setHours(18, 0, 0, 0);

      const newId = Date.now();
      APP_STATE.clients.push({
        id: "cli-" + newId,
        title: "New Client Brand",
        lead: "Razaan Al-Ghifari",
        handoverSlaISO: defaultHandover.toISOString(),
        spendNum: 5000000,
        revenueNum: 15000000,
        beRoas: 2.50,
        csSla: "3.0m",
        blocker: "",
        funnelTitle: "The Ecommerce Funnel",
        isCollapsed: false,
        funnelStages: [
          { name: "Awareness", val: 5000, color: "#0e3a66" },
          { name: "Interest", val: 1500, color: "#0284c7" },
          { name: "Consideration", val: 500, color: "#0d9488" },
          { name: "Conversion", val: 120, color: "#16a34a" },
          { name: "Loyalty", val: 30, color: "#84cc16" }
        ],
        dailyCapacity: ["", "2", "2", "2", "2", "", "2", "2", "2", "", "", ""],
        actions: [
          { 
            id: "act-" + newId, text: "Campaign Setup Sprint", label: "MEDIA", pic: "Razaan Al-Ghifari",
            deadlineISO: defaultDeadline.toISOString(),
            notes: "Deliverable onboarding klien baru.",
            done: false, startCol: 1, spanCol: 4, colorStyle: "pink" 
          }
        ]
      });

      syncState("New Client Added. Click to edit inline.");
    }

    function addNewDeliverableDirect(cIdx) {
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 3);
      defaultDate.setHours(18, 0, 0, 0);

      APP_STATE.clients[cIdx].actions.push({
        id: "act-" + Date.now(),
        text: "New Sprint Deliverable",
        label: "CREATIVE",
        pic: APP_STATE.clients[cIdx].lead,
        deadlineISO: defaultDate.toISOString(),
        notes: "Klik untuk menyunting catatan teknis.",
        done: false,
        startCol: 2,
        spanCol: 4,
        colorStyle: "pink"
      });

      syncState("Deliverable Added. Edit name directly inline.");
    }

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSpotlight();
      }
      if (e.key === 'Escape') {
        closeSpotlight();
        closeInspector();
      }
    });

    if (APP_STATE.isDark) {
      document.documentElement.classList.add('dark');
    }
    renderAllViews();
  </script>
</body>
</html>
