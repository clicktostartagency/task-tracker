<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              gray: '#f5f5f7',
              dark: '#000000',
              cardLight: '#ffffff',
              cardDark: '#1c1c1e',
              borderLight: 'rgba(0, 0, 0, 0.08)',
              borderDark: 'rgba(255, 255, 255, 0.12)',
              blue: '#0071e3',
              green: '#34c759',
              red: '#ff3b30',
              orange: '#ff9500'
            }

  <style>
    :root {
      --spring: cubic-bezier(0.32, 0.72, 0, 1);
    }
    * { 
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif !important; 
      letter-spacing: -0.018em;
    }

    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }
    .dark body {
      background-color: #000000;
      color: #f5f5f7;
    }

    /* macOS Translucent Paneling */
    .macos-sidebar {
      background: rgba(246, 246, 248, 0.82);
      backdrop-filter: blur(30px) saturate(210%);
    }
    .dark .macos-sidebar {
      background: rgba(28, 28, 30, 0.82);
      backdrop-filter: blur(30px) saturate(210%);
    }

    .macos-header {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(25px) saturate(200%);
    }
    .dark .macos-header {
      background: rgba(20, 20, 22, 0.75);
      backdrop-filter: blur(25px) saturate(200%);
    }

    .apple-card-ui {
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 4px 12px rgba(0, 0, 0, 0.015);
      border-radius: 18px;
      transition: all 0.2s ease;
    }
    .apple-card-ui:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.03);
    }
    .dark .apple-card-ui {
      background: #1c1c1e;
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .apple-press { 
      transition: transform 0.16s var(--spring), opacity 0.16s ease; 
    }
    .apple-press:active { 
      transform: scale(0.97); 
      opacity: 0.82; 
    }

    /* Checkbox Apple Style */
    .apple-checkbox {
      appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid #c7c7cc;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .apple-checkbox:checked {
      background-color: #0071e3;
      border-color: #0071e3;
    }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4.5px;
      height: 8px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .sidebar-collapsed { width: 68px !important; min-width: 68px !important; }
    .sidebar-collapsed .hide-collapsed { display: none !important; }
    .sidebar-collapsed .center-collapsed { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
  </style>
</head>

  <script>
    // ==========================================
    // DEEP BROWN NOISE & AUDIO SYNTHESIZER
    // ==========================================
    let audioCtx = null;
    let brownNoiseNode = null;
    let isNoisePlaying = false;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleBrownNoise() {
      const ctx = getAudioCtx();
      const label = document.getElementById('noiseLabel');
      const btn = document.getElementById('noiseBtn');

      if (isNoisePlaying) {
        if (brownNoiseNode) {
          brownNoiseNode.stop();
          brownNoiseNode.disconnect();
          brownNoiseNode = null;
        }
        isNoisePlaying = false;
        label.innerText = "Brown Noise Off";
        btn.classList.remove('text-apple-blue', 'border-apple-blue/40');
        showToast("Brown noise dimatikan");
      } else {
        // Sintesis Algoritma Deep Brown Noise
        const bufferSize = 2 * ctx.sampleRate;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.8; // Warm gain normalization
        }

        brownNoiseNode = ctx.createBufferSource();
        brownNoiseNode.buffer = noiseBuffer;
        brownNoiseNode.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(350, ctx.currentTime); // Deep warm roll-off

        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.045, ctx.currentTime);

        brownNoiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        brownNoiseNode.start();
        isNoisePlaying = true;
        label.innerText = "Deep Brown Noise On";
        btn.classList.add('text-apple-blue', 'border-apple-blue/40');
        showToast("Deep Brown Noise aktif");
      }
    }

    function playTone(freq = 600, duration = 0.04) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // ==========================================
    // POMODORO FOCUS TIMER ENGINE
    // ==========================================
    let pomoTimer = null;
    let pomoRemainingSecs = 25 * 60;
    let isPomoActive = false;

    function togglePomodoro() {
      if (isPomoActive) {
        clearInterval(pomoTimer);
        pomoTimer = null;
        isPomoActive = false;
        document.getElementById('pomoStatusDot').className = "w-2 h-2 rounded-full bg-apple-orange";
        showToast("Pomodoro dijeda");
      } else {
        isPomoActive = true;
        document.getElementById('pomoStatusDot').className = "w-2 h-2 rounded-full bg-apple-green animate-pulse";
        playTone(880, 0.1);
        pomoTimer = setInterval(() => {
          pomoRemainingSecs--;
          updatePomoDisplay();
          if (pomoRemainingSecs <= 0) {
            resetPomodoro();
            playTone(523.25, 0.4);
            alert("🎉 Sesi Pomodoro 25 Menit Selesai! Saatnya istirahat singkat.");
          }
        }, 1000);
        showToast("Sesi fokus Pomodoro dimulai");
      }
    }

    function resetPomodoro() {
      clearInterval(pomoTimer);
      pomoTimer = null;
      isPomoActive = false;
      pomoRemainingSecs = 25 * 60;
      updatePomoDisplay();
      document.getElementById('pomoStatusDot').className = "w-2 h-2 rounded-full bg-apple-orange";
    }

    function updatePomoDisplay() {
      const m = String(Math.floor(pomoRemainingSecs / 60)).padStart(2, '0');
      const s = String(pomoRemainingSecs % 60).padStart(2, '0');
      document.getElementById('pomoTimer').innerText = `${m}:${s}`;
    }

    // ==========================================
    // CLIENT DATASET & STATE
    // ==========================================
    const INITIAL_DATA = [
      {

          { text: "Uji integrasi WhatsApp Tracking & Pixel", label: "QA", pic: "Mike", done: false }
        ]
      },
      {
        id: "cli-2", title: "Sibersih", pic: "Arif", handoverSla: "2026-10-24",
        spend: "Rp 12.8M", revenue: "Rp 40.9M", roas: "3.20x", beRoas: "2.80x", csSla: "4.8m",
        blocker: "Menunggu aset video resolusi tinggi dari klien",
        hooks: [
          "Kerak 5 tahun rontok dalam 1 menit tanpa disikat kuat.",
          "Formula ramah lingkungan yang tidak mengikis nat lantai keramik."
        ],

          { text: "Penyusunan Storyboard Video Konten", label: "CREATIVE", pic: "Jireh", done: true },
          { text: "Penulisan skrip hook 3 detik", label: "CREATIVE", pic: "Arif", done: true },
          { text: "Pemotongan video kreatif 9:16", label: "CREATIVE", pic: "Giza", done: false },
          { text: "Client preview & sign-off deliverable", label: "QA", pic: "Arif", done: false }
        ]
      },
      {
        id: "cli-3", title: "Nebula", pic: "Nicho", handoverSla: "2026-10-22",
        spend: "Rp 32.4M", revenue: "Rp 155.5M", roas: "4.80x", beRoas: "2.20x", csSla: "1.8m",
        blocker: "Akses BM terbatas (Payment gateway pending)",
        hooks: [

        ],

        ]

      {

        blocker: "Menunggu memo kelulusan struktur harga paket diskon dari klien",

        ],

          { text: "Desain banner promosi feed & story", label: "CREATIVE", pic: "Arif", done: false },
          { text: "Setup alur direct WhatsApp CS", label: "MEDIA", pic: "Razaan", done: false }
        ]
      }
    ];

    let State = {
      clients: INITIAL_DATA,
      tab: 'home',
      sidebar: false,
      dark: localStorage.getItem('agency_dark') === 'true',
      dragged: null
    };

    try {
      const stored = localStorage.getItem('agency_clients_apple_suite');
      if (stored) State.clients = JSON.parse(stored);
    } catch (e) {
      State.clients = INITIAL_DATA;
    }

    function saveState() {
      localStorage.setItem('agency_clients_apple_suite', JSON.stringify(State.clients));
      render();
    }

    // ==========================================
    // UI NAVIGATION & RENDERING
    // ==========================================
    function switchTab(tabId) {
      State.tab = tabId;
      playTone(700);
      ['home', 'projects', 'kanban'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tabId);
        const btn = document.getElementById(`tab-${t}`);
        if (t === tabId) {
          btn.className = "center-collapsed w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl bg-black/5 dark:bg-white/10 text-apple-blue font-semibold apple-press";
        } else {
          btn.className = "center-collapsed w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-[#86868b] hover:bg-black/5 dark:hover:bg-white/5 font-medium apple-press";
        }
      });
      render();
    }

    function toggleSidebar() {
      State.sidebar = !State.sidebar;
      playTone(500);
      document.getElementById('sidebar').classList.toggle('sidebar-collapsed', State.sidebar);
    }

    function toggleTheme() {
      State.dark = !State.dark;
      localStorage.setItem('agency_dark', State.dark);
      document.documentElement.classList.toggle('dark', State.dark);
      document.getElementById('themeBtn').innerText = State.dark ? '☀️' : '🌙';
      playTone(600);
    }

    // --- HOME CARDS (APPLE NATIVE DESIGN) ---
    function renderHome() {
      const el = document.getElementById('clientCardsContainer');
      el.innerHTML = State.clients.map((c, cIdx) => {
        const total = c.actions.length;
        const done = c.actions.filter(a => a.done).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const inProgress = c.actions.find(a => !a.done);
        const isBleeding = parseFloat(c.roas) < parseFloat(c.beRoas);

        return `
          <div class="apple-card-ui p-5 space-y-4 flex flex-col justify-between">
            <div class="space-y-3">
              <!-- Top Info -->
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-sm tracking-tight text-[#1d1d1f] dark:text-white">${c.title}</h3>
                  <p class="text-[11px] text-[#86868b] mt-0.5">Lead: <b class="text-[#1d1d1f] dark:text-white font-medium">${c.pic}</b> • SLA: ${c.handoverSla}</p>
                </div>
                <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full ${pct === 100 ? 'bg-emerald-50 dark:bg-emerald-950/40 text-apple-green' : c.blocker ? 'bg-rose-50 dark:bg-rose-950/40 text-apple-red' : 'bg-blue-50 dark:bg-blue-950/40 text-apple-blue'}">
                  ${pct === 100 ? 'COMPLETED' : c.blocker ? 'BLOCKER' : 'IN PROGRESS'}
                </span>
              </div>

              <!-- ROAS Panel -->
              <div class="grid grid-cols-3 gap-1 p-2.5 bg-black/[0.025] dark:bg-white/[0.035] rounded-xl text-center text-xs">
                <div><span class="text-[9px] text-[#86868b] font-medium uppercase tracking-wider block">Spend</span><b class="font-mono text-[11px]">${c.spend}</b></div>
                <div><span class="text-[9px] text-[#86868b] font-medium uppercase tracking-wider block">Revenue</span><b class="font-mono text-[11px]">${c.revenue}</b></div>
                <div><span class="text-[9px] text-[#86868b] font-medium uppercase tracking-wider block">ROAS/BE</span><b class="font-mono text-[11px] ${isBleeding ? 'text-apple-red' : 'text-apple-green'}">${c.roas} (${c.beRoas})</b></div>
              </div>

              <!-- Progress Bar -->
              <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold">
                  <span class="text-[#86868b]">Deliverables: ${done}/${total}</span>
                  <span class="${pct === 100 ? 'text-apple-green' : 'text-apple-blue'}">${pct}%</span>
                </div>
                <div class="w-full bg-black/[0.04] dark:bg-white/10 h-1.5 rounded-full overflow-hidden">
                  <div class="h-full ${pct === 100 ? 'bg-apple-green' : 'bg-apple-blue'} rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                </div>
              </div>

              <!-- Current Task In-Progress -->
              <div class="p-2.5 bg-black/[0.02] dark:bg-white/[0.03] rounded-xl text-xs">
                <span class="text-[9px] text-[#86868b] uppercase tracking-wider font-bold block mb-0.5">Current Task:</span>
                <span class="font-medium text-[#1d1d1f] dark:text-white truncate block">
                  ${inProgress ? `⚡ ${inProgress.text} (${inProgress.pic})` : '🎉 Semua deliverables tuntas'}
                </span>
              </div>

              <!-- Blocker Indicator -->
              ${c.blocker ? `
                <div class="p-2.5 bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200/60 dark:border-rose-900/40 rounded-xl text-xs text-rose-800 dark:text-rose-300 font-medium">
                  🚨 ${c.blocker}
                </div>
              ` : ''}
            </div>

            <!-- Bottom Actions -->
            <div class="pt-3 border-t border-black/5 dark:border-white/10 flex justify-between items-center text-xs">
              <button onclick="openHookVault(${cIdx})" class="text-apple-blue font-semibold hover:underline flex items-center space-x-1 apple-press">
                <span>🎯</span><span>Hook Vault</span>
              </button>
              <button onclick="copyWA(${cIdx})" class="text-[#86868b] hover:text-[#1d1d1f] dark:hover:text-white font-medium flex items-center space-x-1 apple-press">
                <span>Share WA</span><span>↗</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- PROJECTS VIEW ---
    function renderProjects() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const div = document.getElementById('divisionFilter')?.value || 'ALL';
      const el = document.getElementById('projectsList');

      el.innerHTML = State.clients.map((c, cIdx) => {
        let actions = c.actions;
        if (div !== 'ALL') actions = actions.filter(a => a.label === div);
        if (q) actions = actions.filter(a => a.text.toLowerCase().includes(q) || a.pic.toLowerCase().includes(q));
        if (actions.length === 0) return '';

        return `
          <div class="apple-card-ui p-4 space-y-2.5">
            <div class="flex justify-between items-center pb-2 border-b border-black/5 dark:border-white/10 text-xs">
              <span class="font-bold text-sm">${c.title}</span>
              <span class="text-[#86868b]">SLA Serah Terima: ${c.handoverSla}</span>
            </div>
            <div class="space-y-1.5">
              ${actions.map((a, aIdx) => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-black/[0.015] dark:bg-white/[0.02] text-xs">
                  <label class="flex items-center space-x-3 flex-1 truncate cursor-pointer">
                    <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleTask(${cIdx},${aIdx})" class="apple-checkbox">
                    <span class="${a.done ? 'line-through text-[#86868b]' : 'font-medium'} truncate">${a.text}</span>
                  </label>
                  <div class="flex items-center space-x-2 pl-2">
                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${a.label === 'MEDIA' ? 'bg-blue-50 text-apple-blue' : a.label === 'CREATIVE' ? 'bg-purple-50 text-purple-600' : 'bg-emerald-50 text-apple-green'}">${a.label}</span>
                    <span class="text-[10px] text-[#86868b]">${a.pic}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('') || `<div class="p-8 text-center text-xs text-[#86868b] italic">Tidak ada tugas yang sesuai.</div>`;
    }

    // --- KANBAN VIEW ---
    function renderKanban() {
      const cols = { todo: [], doing: [], done: [] };
      State.clients.forEach((c, cIdx) => {
        c.actions.forEach((a, aIdx) => {
          const item = { ...a, cIdx, aIdx, client: c.title };
          if (a.done) cols.done.push(item);
          else if (a.doing) cols.doing.push(item);
          else cols.todo.push(item);
        });
      });

      ['todo', 'doing', 'done'].forEach(col => {
        document.getElementById(`count-${col}`).innerText = cols[col].length;
        document.getElementById(`kanban-${col}`).innerHTML = cols[col].map(item => `
          <div class="apple-card-ui p-3 space-y-1.5 text-xs cursor-grab apple-press" draggable="true" ondragstart="State.dragged = { cIdx: ${item.cIdx}, aIdx: ${item.aIdx} }">
            <div class="flex justify-between text-[10px] text-[#86868b]">
              <span class="font-semibold">${item.client}</span>
              <span class="px-1.5 py-0.5 rounded-full bg-black/5 dark:bg-white/10">${item.pic}</span>
            </div>
            <p class="font-medium text-[#1d1d1f] dark:text-white leading-relaxed">${item.text}</p>
          </div>
        `).join('') || `<div class="p-6 text-center text-[10px] text-[#86868b] italic">Kosong</div>`;
      });
    }

    function dropKanban(e, targetCol) {
      e.preventDefault();
      if (!State.dragged) return;
      const a = State.clients[State.dragged.cIdx].actions[State.dragged.aIdx];
      a.done = targetCol === 'DONE';
      a.doing = targetCol === 'DOING';
      playTone(a.done ? 800 : 500);
      State.dragged = null;
      saveState();
    }

    function toggleTask(cIdx, aIdx) {
      const a = State.clients[cIdx].actions[aIdx];
      a.done = !a.done;
      playTone(a.done ? 800 : 350);
      saveState();
    }

    // --- MODAL DIALOGS ---
    function openModal(title, html) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      playTone(600);
    }
    function closeModal() { 
      document.getElementById('modal').classList.add('hidden'); 
    }

    function openHookVault(cIdx) {
      const c = State.clients[cIdx];
      const html = `
        <div class="space-y-2">
          ${c.hooks.map(h => `
            <div class="p-3 bg-black/[0.02] dark:bg-white/[0.04] rounded-2xl border border-black/5 dark:border-white/10 leading-relaxed font-medium">
              "${h}"
            </div>
          `).join('')}
        </div>
      `;
      openModal(`${c.title} - Hook Vault`, html);
    }

    function openStandup() {
      let lines = [
        '*DAILY STANDUP*',
        'Tanggal: ' + new Date().toLocaleDateString('id-ID'),
        ''
      ];
      State.clients.forEach(c => {
        const inProgress = c.actions.find(a => !a.done);
        lines.push('• *' + c.title + '*: ' + (inProgress ? inProgress.text : 'Semua deliverable tuntas'));
      });
      const textOutput = lines.join('\n');

      openModal("Daily Standup WhatsApp", `
        <textarea id="standupBox" class="w-full h-36 p-3 rounded-2xl bg-black/[0.02] dark:bg-white/[0.04] text-xs font-mono outline-none border border-black/5 dark:border-white/10" readonly></textarea>
        <button onclick="copyStandupText()" class="w-full py-2.5 bg-apple-blue hover:bg-[#0077ed] text-white rounded-xl font-bold apple-press">Salin ke WhatsApp</button>
      `);
      document.getElementById('standupBox').value = textOutput;
    }

    function copyStandupText() {
      const txt = document.getElementById('standupBox').value;
      navigator.clipboard.writeText(txt);
      closeModal();
      showToast('Standup disalin ke WhatsApp');
    }

    function openNewProjectModal() {
      openModal("Tambah Project Baru", `
        <input type="text" id="npTitle" placeholder="Nama Klien..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <input type="text" id="npPic" placeholder="Lead PIC..." class="w-full p-2.5 rounded-xl bg-black/[0.02] dark:bg-white/10 outline-none border border-black/5 dark:border-white/10">
        <button onclick="submitNewProject()" class="w-full py-2.5 bg-[#1d1d1f] dark:bg-white dark:text-black text-white font-bold rounded-xl apple-press">Simpan Project</button>
      `);
    }

    function submitNewProject() {
      const title = document.getElementById('npTitle').value.trim();
      const pic = document.getElementById('npPic').value.trim() || 'Mike';
      if (!title) return;
      State.clients.push({
        id: "cli-" + Date.now(), title, pic, handoverSla: "2026-10-31",
        spend: "Rp 0", revenue: "Rp 0", roas: "0.0x", beRoas: "2.5x", csSla: "< 3m",
        hooks: ["Formula hook video interupsi 3 detik."],
        actions: [{ text: "Setup kampanye utama", label: "MEDIA", pic, done: false }]
      });
      closeModal();
      playTone(850);
      saveState();
      showToast("Project baru berhasil ditambahkan");
    }

    function copyWA(cIdx) {
      const c = State.clients[cIdx];
      const doneList = c.actions.filter(a => a.done).map(a => '• ' + a.text).join('\n');
      const text = '*UPDATE PROYEK ' + c.title.toUpperCase() + '*\nRevenue: ' + c.revenue + ' (ROAS: ' + c.roas + ')\n\nDeliverables Selesai:\n' + (doneList || '- On progress');
      navigator.clipboard.writeText(text);
      playTone(800);
      showToast("Laporan disalin ke WhatsApp");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 1600);
    }

    function render() {
      const pics = [...new Set(State.clients.flatMap(c => c.actions.map(a => a.pic)))];
      document.getElementById('teamListUI').innerHTML = pics.map(p => `
        <div class="flex items-center space-x-2 py-1 px-1 rounded-lg text-[#86868b] hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
          <span class="text-xs">👤</span><span class="hide-collapsed font-medium">${p}</span>
        </div>
      `).join('');

      if (State.tab === 'home') renderHome();
      else if (State.tab === 'projects') renderProjects();
      else if (State.tab === 'kanban') renderKanban();
    }

    // --- SHORTCUTS ---
    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
      if (e.key === 'Escape') closeModal();
      if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === '1') switchTab('home');
        if (e.key === '2') switchTab('projects');
        if (e.key === '3') switchTab('kanban');
        if (e.key.toLowerCase() === 'p') togglePomodoro();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (State.dark) document.documentElement.classList.add('dark');
      render();
    });
  </script>
</body>
</html>
