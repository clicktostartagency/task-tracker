<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations & Progress Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --ios-spring: cubic-bezier(0.32, 0.72, 0, 1); }
    body { background-color: #f2f2f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .ios-press { transition: transform 0.2s var(--ios-spring), opacity 0.2s ease; }
    .ios-press:active { transform: scale(0.96); opacity: 0.85; }
    .progress-capsule { border-radius: 26px; min-height: 110px; transition: transform 0.3s var(--ios-spring), box-shadow 0.3s; }
    .progress-capsule:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    .accordion-drawer { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s var(--ios-spring), opacity 0.3s; }
    .accordion-drawer.open { max-height: 4500px; opacity: 1; margin-top: 12px; }
    .apple-check { appearance: none; width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%; outline: none; cursor: pointer; transition: all 0.2s; position: relative; }
    .apple-check:checked { background-color: #34c759; border-color: #34c759; }
    .apple-check:checked::after { content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .gantt-col-cell { min-width: 48px; max-width: 48px; width: 48px; text-align: center; }
    .gantt-cell-container { position: relative; }
    .gantt-cell-container:hover { z-index: 9999; }
    .gantt-popover { visibility: hidden; opacity: 0; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-6px); transition: all 0.2s var(--ios-spring); z-index: 99999; }
    .gantt-cell-container:hover .gantt-popover { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="min-h-screen py-6 px-3 md:px-6 flex justify-center pb-24">

  <div class="w-full max-w-7xl flex items-start gap-5">
    
    <!-- SIDEBAR -->
    <aside id="mainSidebar" class="hidden md:flex flex-col bg-white rounded-3xl p-5 shadow-xs border border-gray-200/80 sticky top-6 w-60 max-h-[92vh]">
      <div class="flex items-center space-x-2 mb-6">
        <span class="w-3 h-3 rounded-full bg-rose-500"></span>
        <span class="w-3 h-3 rounded-full bg-amber-400"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
      </div>
      <div class="space-y-1 mb-6 text-xs font-semibold">
        <button onclick="setViewMode('capsules')" id="mBtn-capsules" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl bg-gray-100 text-gray-900 font-bold transition ios-press">
          <span>📁</span><span>Projects</span>
        </button>
        <button onclick="setViewMode('gantt')" id="mBtn-gantt" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl text-gray-600 hover:bg-gray-50 transition ios-press">
          <span>📊</span><span>Timeline Gantt</span>
        </button>
        <button onclick="setViewMode('overview')" id="mBtn-overview" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl text-gray-600 hover:bg-gray-50 transition ios-press">
          <span>📈</span><span>Dept Overview</span>
        </button>
        <button onclick="openKpiScorecardModal()" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl text-blue-600 hover:bg-blue-50 transition ios-press">
          <span>🎯</span><span>Live KPI Sheet</span>
        </button>
      </div>
      <div class="pt-4 border-t border-gray-100 text-xs flex-1 overflow-y-auto">
        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-2">Team (<span id="teamCountText">0</span>)</span>
        <div id="sidebarUserList" class="space-y-2"></div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 w-full max-w-5xl flex flex-col">
      <header class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-gray-200">
        <div class="flex items-center space-x-3">
          <h1 class="text-2xl font-black text-gray-900 tracking-tight">Agency Operations</h1>
          <button onclick="openCommandPalette()" class="bg-white border border-gray-200 px-3 py-1 rounded-full text-xs font-semibold text-gray-600 hover:bg-gray-50 transition ios-press">
            🔍 <kbd class="font-mono text-[10px] ml-1 bg-gray-100 px-1 py-0.5 rounded">⌘K</kbd>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="toggleAudioMute()" id="btnAudioToggle" class="p-2 bg-white border border-gray-200 rounded-full text-xs shadow-xs ios-press">🔊</button>
          <button onclick="copyWAStandup()" class="bg-white border border-gray-200 hover:text-emerald-600 px-3.5 py-1.5 rounded-full text-xs font-bold transition ios-press">Share WA</button>
          <button onclick="openNewTaskModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full text-xs font-bold transition shadow-xs ios-press">+ Task</button>
          <button onclick="openUserProfileModal(AppState.activeUserKey)" class="flex items-center space-x-2 bg-white border border-gray-200 px-3 py-1 rounded-full shadow-xs ios-press">
            <span id="navAvatarSpan"></span>
            <span id="navUserName" class="text-xs font-bold text-gray-800"></span>
          </button>
        </div>
      </header>

      <!-- FILTER CONTROLS -->
      <section class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div id="deptFilterRow" class="flex items-center space-x-1.5 overflow-x-auto text-xs font-semibold">
          <button onclick="setDeptFilter('ALL')" class="df-btn px-3.5 py-1 rounded-full bg-black text-white ios-press" data-val="ALL">Semua</button>
          <button onclick="setDeptFilter('DM')" class="df-btn px-3.5 py-1 rounded-full bg-white text-gray-700 border border-gray-200 ios-press" data-val="DM">DM</button>
          <button onclick="setDeptFilter('Production')" class="df-btn px-3.5 py-1 rounded-full bg-white text-gray-700 border border-gray-200 ios-press" data-val="Production">Production</button>
          <button onclick="setDeptFilter('HRGA')" class="df-btn px-3.5 py-1 rounded-full bg-white text-gray-700 border border-gray-200 ios-press" data-val="HRGA">HRGA</button>
          <button onclick="setDeptFilter('ABD')" class="df-btn px-3.5 py-1 rounded-full bg-white text-gray-700 border border-gray-200 ios-press" data-val="ABD">ABD</button>
        </div>
        <div id="statusFilterRow" class="flex items-center bg-gray-200/80 p-0.5 rounded-full text-xs font-semibold">
          <button onclick="setStatusFilter('ALL')" class="sf-btn px-3 py-1 rounded-full bg-white text-gray-900 shadow-xs ios-press" data-val="ALL">Semua</button>
          <button onclick="setStatusFilter('ACTIVE')" class="sf-btn px-3 py-1 rounded-full text-gray-600 ios-press" data-val="ACTIVE">In-Progress</button>
          <button onclick="setStatusFilter('COMPLETED')" class="sf-btn px-3 py-1 rounded-full text-gray-600 ios-press" data-val="COMPLETED">Selesai</button>
          <button onclick="setStatusFilter('BLOCKED')" class="sf-btn px-3 py-1 rounded-full text-rose-600 ios-press" data-val="BLOCKED">Blocked</button>
        </div>
      </section>

      <!-- VIEW CONTAINER -->
      <section id="capsulesView" class="space-y-4"></section>

      <section id="ganttView" class="hidden bg-white rounded-3xl p-6 border border-gray-200 shadow-xs overflow-x-auto pb-24">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-100">
          <div>
            <h3 class="font-extrabold text-sm text-gray-900">Workload &amp; Pace Timeline</h3>
            <p class="text-[11px] text-gray-400">Peringatan overcapacity dan estimasi pengerjaan harian</p>
          </div>
          <div id="ganttCapacityPills" class="flex items-center space-x-1.5 text-xs"></div>
        </div>
        <div id="ganttContent"></div>
      </section>

      <section id="overviewView" class="hidden bg-white rounded-3xl p-6 border border-gray-200 shadow-xs space-y-5">
        <h3 class="font-extrabold text-base text-gray-900">Department Performance Overview</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
          <div class="p-4 rounded-2xl bg-gray-50 border border-gray-100"><span class="text-xs text-gray-400 block font-semibold">Total Task</span><span id="ovTotal" class="text-2xl font-black text-gray-900">0</span></div>
          <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-100"><span class="text-xs text-emerald-700 block font-semibold">Done</span><span id="ovDone" class="text-2xl font-black text-emerald-700">0</span></div>
          <div class="p-4 rounded-2xl bg-rose-50 border border-rose-100"><span class="text-xs text-rose-700 block font-semibold">Blockers</span><span id="ovBlockers" class="text-2xl font-black text-rose-700">0</span></div>
          <div class="p-4 rounded-2xl bg-blue-50 border border-blue-100"><span class="text-xs text-blue-700 block font-semibold">Completion</span><span id="ovScore" class="text-2xl font-black text-blue-700">0%</span></div>
        </div>
      </section>
    </main>
  </div>

  <!-- COMMAND PALETTE (CMD+K) -->
  <div id="cmdPaletteModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-start justify-center pt-24 p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl border border-gray-200 overflow-hidden">
      <div class="p-3 border-b border-gray-100 flex items-center space-x-2">
        <span class="text-gray-400 text-sm">🔍</span>
        <input type="text" id="cmdInput" placeholder="Cari project, ubah view, atau switch PIC..." oninput="renderCommandResults(this.value)" class="w-full text-xs font-semibold outline-none text-gray-800">
        <kbd class="text-[9px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-500">ESC</kbd>
      </div>
      <div id="cmdResults" class="max-h-72 overflow-y-auto p-2 space-y-1 text-xs"></div>
    </div>
  </div>

  <!-- MODAL: TASK BARU -->
  <div id="newTaskModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-2">
        <h3 class="font-extrabold text-sm text-gray-900">Buat Project / Task Baru</h3>
        <button onclick="closeNewTaskModal()" class="text-gray-400 hover:text-gray-600 text-xl font-light">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-gray-500 block mb-1">Departemen</label>
          <select id="npDept" class="w-full p-2.5 bg-gray-100 rounded-xl font-semibold outline-none">
            <option value="DM">Digital Marketing (DM)</option>
            <option value="Production">Production</option>
            <option value="HRGA">HRGA</option>
            <option value="ABD">ABD</option>
          </select>
        </div>
        <div>
          <label class="font-bold text-gray-500 block mb-1">Nama Project</label>
          <input type="text" id="npTitle" placeholder="Misal: Launching Kampanye Q4" class="w-full p-2.5 bg-gray-100 rounded-xl font-semibold outline-none">
        </div>
        <div>
          <label class="font-bold text-gray-500 block mb-1">Lead PIC</label>
          <select id="npPic" class="w-full p-2.5 bg-gray-100 rounded-xl font-semibold outline-none"></select>
        </div>
      </div>
      <div class="flex space-x-2 pt-2">
        <button onclick="closeNewTaskModal()" class="w-1/2 py-2 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs ios-press">Batal</button>
        <button onclick="submitNewTask()" class="w-1/2 py-2 bg-blue-600 text-white font-bold rounded-xl text-xs shadow-xs ios-press">Simpan Task</button>
      </div>
    </div>
  </div>

  <!-- MODAL: USER SCORECARD & CONTRACT -->
  <div id="userModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-4xl p-6 shadow-2xl border border-gray-100 max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-gray-100">
        <div class="flex items-center space-x-3">
          <div id="uModalAvatar"></div>
          <div>
            <h3 id="uModalName" class="font-black text-base text-gray-900 leading-tight"></h3>
            <span id="uModalRole" class="text-xs text-blue-600 font-bold"></span>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="promptUserPinLogin()" class="px-3 py-1 bg-gray-100 text-blue-700 font-bold text-xs rounded-xl ios-press">🔒 Switch User (PIN)</button>
          <button onclick="closeUserModal()" class="text-gray-400 text-2xl font-light leading-none">&times;</button>
        </div>
      </div>
      
      <div class="border-b border-gray-100 pb-3">
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Live KPI Google Sheet (<span id="kpiRoleBadge"></span>)</h4>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="text-gray-400 border-b border-gray-100 text-[10px] uppercase">
                <th class="py-2">Indikator</th><th class="py-2">Bobot</th><th class="py-2">Target</th><th class="py-2">Actual</th><th class="py-2">Capaian</th>
              </tr>
            </thead>
            <tbody id="kpiTableBody" class="divide-y divide-gray-50"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Subtasks Assigned</h4>
        <div id="uSubtaskList" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50"></div>

  <script>
    // --- KONFIGURASI SPREADSHEET LIVE ---
    const KPI_SHEET_URL = "https://docs.google.com/spreadsheets/d/1J7qOn6NbqfFPd2WaWNUyj1HET6ykuF9E_STu7I8cTpw";
    const TEAM_DB_URL = "https://docs.google.com/spreadsheets/d/1Qv23qUxzUOiqiGiSeHiGnodBfTUkEC0HIUI38LHujbg";

    const USER_ROLE_SHEET_MAP = {
      Mike: "PROJECT MANAGER", Selin: "PROJECT MANAGER", Anggun: "HRGA", Razaan: "DM", Nicho: "DM",
      Jireh: "CREATIVE DIRECTOR", Arif: "GRAPHIC DESIGN", Giza: "VIDEO EDITOR", Dzaky: "FINANCE"
    };

    let teamNicknames = ["Mike", "Selin", "Jireh", "Anggun", "Razaan", "Nicho", "Arif", "Giza", "Dzaky"];

    const DEPARTMENTS = {
      DM: { tint: '#FFD6DF', fill: '#E11D48', text: '#5C021E' },
      Production: { tint: '#8EE4E2', fill: '#0B7A75', text: '#032F2E' },
      HRGA: { tint: '#C3C1FF', fill: '#4743C9', text: '#1A185A' },
      ABD: { tint: '#8AD5FF', fill: '#0284C7', text: '#082F49' }
    };

    const initialTasks = [
      {
        id: "tsk-1", dept: "ABD", title: "Cherry Oaks", pic: "Mike", launchDate: "2026-09-28", handoverSla: "2026-10-20",
        assets: { drive: "https://drive.google.com", figma: "https://figma.com", ads: "" },
        feedbackLogs: [{ text: "Wireframe layout disetujui, naikkan kontras tombol.", sentiment: "Positive", date: "15 Oct" }],
        approval: { copy: true, visual: true, tech: false },
        parentDailyHours: { 2: "3.2h", 5: "3.2h", 6: "3.7h", 7: "3.7h" },
        actions: [
          { text: "Design wireframe", pic: "Arif", dueDate: "2026-10-19", duration: 3, done: true, isFlagged: false, revisions: 1, timer: 1320, running: false, link: "https://figma.com" },
          { text: "Development & CAPI", pic: "Razaan", dueDate: "2026-10-21", duration: 4, done: true, isFlagged: false, revisions: 0, timer: 2400, running: false, link: "" },
          { text: "QA & Client handover", pic: "Selin", dueDate: "2026-10-18", duration: 2, done: false, isFlagged: true, blocker: "Menunggu sign-off", revisions: 3, timer: 450, running: false, link: "" }
        ]
      },
      {
        id: "tsk-2", dept: "DM", title: "Social Media Campaigns", pic: "Razaan", launchDate: "2026-10-10", handoverSla: "2026-10-22",
        assets: { drive: "", figma: "", ads: "https://adsmanager.facebook.com" },
        feedbackLogs: [{ text: "Copywriting disetujui.", sentiment: "Positive", date: "16 Oct" }],
        approval: { copy: true, visual: false, tech: false },
        parentDailyHours: { 6: "1h", 7: "1h", 8: "1h" },
        actions: [
          { text: "Meta CTWA ads setup", pic: "Nicho", dueDate: "2026-10-20", duration: 2, done: true, isFlagged: false, revisions: 0, timer: 180, running: false, link: "" },
          { text: "Budget scaling analysis", pic: "Mike", dueDate: "2026-10-25", duration: 3, done: false, isFlagged: false, revisions: 1, timer: 900, running: false, link: "" }
        ]
      }
    ];

    // --- STATE UTAMA ---
    let AppState = {
      activeUserKey: "Mike",
      deptFilter: "ALL",
      statusFilter: "ALL",
      viewMode: "capsules",
      expandedCardIds: new Set(["tsk-1"]),
      tasks: JSON.parse(localStorage.getItem('agency_hub_clean_v1')) || initialTasks
    };

    function commitState() {
      localStorage.setItem('agency_hub_clean_v1', JSON.stringify(AppState.tasks));
      renderActiveView();
    }

    // --- GLOBAL STOPWATCH TICKER (SATU INTERVAL UNTUK SEMUA) ---
    setInterval(() => {
      let updated = false;
      AppState.tasks.forEach(t => {
        t.actions.forEach((a, idx) => {
          if (a.running) {
            a.timer = (a.timer || 0) + 1;
            const el = document.getElementById(`timer-${t.id}-${idx}`);
            if (el) el.innerText = formatTime(a.timer);
            updated = true;
          }
        });
      });
      if (updated) localStorage.setItem('agency_hub_clean_v1', JSON.stringify(AppState.tasks));
    }, 1000);

    function formatTime(s) {
      const m = Math.floor(s / 60);
      return `${m.toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
    }

    // --- AUDIO TAPTIC (WEB AUDIO API) ---
    let audioCtx = null, soundMuted = false;
    function playSound(type) {
      if (soundMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'tick') {
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.start(now); osc.stop(now + 0.03);
        } else if (type === 'done') {
          [523.25, 659.25, 783.99].forEach((f, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(f, now + i * 0.05);
            g.gain.setValueAtTime(0.06, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.2);
            o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    }

    function toggleAudioMute() {
      soundMuted = !soundMuted;
      document.getElementById('btnAudioToggle').innerText = soundMuted ? '🔇' : '🔊';
      showToast(soundMuted ? 'Suara dinonaktifkan' : 'Suara aktif');
    }

    // --- AVATAR & CIRCULAR PROGRESS SVG ---
    function getAvatarBadge(name, size = "w-7 h-7 text-xs") {
      const emojis = ['😀', '😎', '🥳', '🤓', '🤩', '😄', '🤠', '😊'];
      const colors = ['#E0F2FE', '#FEF3C7', '#DCFCE7', '#FCE7F3', '#EDE9FE'];
      let h = 0; for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
      return `<div class="${size} rounded-full flex items-center justify-center font-bold select-none" style="background:${colors[Math.abs(h) % colors.length]}">${emojis[Math.abs(h) % emojis.length]}</div>`;
    }

    function createProgressRingSvg(pct, color) {
      const r = 24, c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      return `
        <div class="relative w-14 h-14 flex items-center justify-center flex-shrink-0">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="${r}" stroke="rgba(255,255,255,0.3)" stroke-width="5" fill="none" />
            <circle cx="30" cy="30" r="${r}" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" fill="none" class="transition-all duration-500" />
          </svg>
          <span class="absolute font-black text-[11px] text-white">${pct}%</span>
        </div>
      `;
    }

    // --- RENDER PIPELINE ---
    function renderActiveView() {
      renderNavAndSidebar();
      if (AppState.viewMode === 'capsules') renderCapsules();
      if (AppState.viewMode === 'gantt') renderGantt();
      if (AppState.viewMode === 'overview') renderOverview();
    }

    function renderNavAndSidebar() {
      document.getElementById('navAvatarSpan').innerHTML = getAvatarBadge(AppState.activeUserKey, "w-6 h-6 text-xs");
      document.getElementById('navUserName').innerText = AppState.activeUserKey;
      document.getElementById('teamCountText').innerText = teamNicknames.length;

      document.getElementById('sidebarUserList').innerHTML = teamNicknames.slice(0, 7).map(n => `
        <div onclick="openUserProfileModal('${n}')" class="flex items-center space-x-2 p-1 rounded-xl hover:bg-gray-100 cursor-pointer ios-press">
          ${getAvatarBadge(n, "w-6 h-6 text-xs")}
          <span class="font-bold text-gray-800 ${n === AppState.activeUserKey ? 'text-blue-600' : ''}">${n}</span>
        </div>
      `).join('');
    }

    function renderCapsules() {
      const container = document.getElementById('capsulesView');
      let tasks = AppState.tasks;

      if (AppState.deptFilter !== 'ALL') tasks = tasks.filter(t => t.dept === AppState.deptFilter);
      if (AppState.statusFilter !== 'ALL') {
        tasks = tasks.filter(t => {
          const done = t.actions.filter(a => a.done).length === t.actions.length;
          if (AppState.statusFilter === 'COMPLETED') return done;
          if (AppState.statusFilter === 'ACTIVE') return !done && !t.actions.some(a => a.isFlagged);
          if (AppState.statusFilter === 'BLOCKED') return t.actions.some(a => a.isFlagged);
          return true;
        });
      }

      if (!tasks.length) {
        container.innerHTML = `<div class="p-8 text-center text-gray-400 bg-white rounded-3xl border border-gray-100 text-xs italic">Tidak ada proyek yang cocok.</div>`;
        return;
      }

      container.innerHTML = tasks.map(t => {
        const theme = DEPARTMENTS[t.dept] || DEPARTMENTS.DM;
        const done = t.actions.filter(a => a.done).length;
        const total = t.actions.length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const isOpen = AppState.expandedCardIds.has(t.id);
        const hasBlocker = t.actions.some(a => a.isFlagged);

        return `
          <div class="w-full flex flex-col">
            <div onclick="toggleCapsule('${t.id}')" class="progress-capsule cursor-pointer relative overflow-hidden flex items-center justify-between px-6 py-4" style="background-color:${theme.tint};">
              <div class="absolute inset-y-0 left-0 transition-all duration-500" style="width:${pct}%; background-color:${theme.fill};"></div>
              <div class="relative z-10 flex-1 min-w-0 pr-3" style="color:${pct > 40 ? '#fff' : theme.text}">
                <div class="flex items-center space-x-2">
                  <h4 class="font-black text-base truncate">${t.title}</h4>
                  <span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-white/30 backdrop-blur-xs">${t.dept}</span>
                  ${hasBlocker ? `<span class="text-[9px] font-black uppercase px-2 py-0.5 rounded-full bg-rose-600 text-white animate-pulse">BLOCKER</span>` : ''}
                </div>
                <div class="text-xs font-semibold opacity-90 mt-0.5">${done}/${total} Selesai</div>
              </div>
              <div class="relative z-10 flex items-center space-x-3">
                ${createProgressRingSvg(pct, pct > 40 ? '#fff' : theme.fill)}
                <span class="text-xs font-bold transition-transform ${isOpen ? 'rotate-180' : ''}" style="color:${pct > 40 ? '#fff' : theme.text}">▼</span>
              </div>
            </div>

            <div class="accordion-drawer ${isOpen ? 'open' : ''} bg-white rounded-3xl p-5 border border-gray-200/70 shadow-xs space-y-4">
              <div class="flex flex-wrap justify-between items-center pb-3 border-b border-gray-100 text-xs gap-2">
                <span class="font-bold text-gray-700">Lead PIC: ${t.pic} • SLA: ${t.handoverSla || 'H-2'}</span>
                <div class="flex items-center space-x-1">
                  ${t.assets?.drive ? `<a href="${t.assets.drive}" target="_blank" class="px-2 py-1 bg-blue-50 text-blue-700 font-bold rounded-lg text-[10px]">Drive ↗</a>` : ''}
                  ${t.assets?.figma ? `<a href="${t.assets.figma}" target="_blank" class="px-2 py-1 bg-purple-50 text-purple-700 font-bold rounded-lg text-[10px]">Figma ↗</a>` : ''}
                  ${t.assets?.ads ? `<a href="${t.assets.ads}" target="_blank" class="px-2 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg text-[10px]">Ads ↗</a>` : ''}
                </div>
              </div>

              <!-- ACTION ITEMS -->
              <div class="space-y-2">
                ${t.actions.map((act, idx) => `
                  <div class="p-3 rounded-2xl border ${act.isFlagged ? 'bg-rose-50/70 border-rose-200' : 'bg-gray-50 border-gray-100'} text-xs space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex items-center space-x-2 flex-1 min-w-0">
                        <input type="checkbox" ${act.done ? 'checked' : ''} onchange="mutateAction('${t.id}',${idx}, 'done', this.checked)" class="apple-check">
                        <span class="font-bold truncate ${act.done ? 'line-through text-gray-400' : 'text-gray-900'}">${act.text}</span>
                      </div>
                      <div class="flex items-center space-x-2 flex-shrink-0">
                        <select onchange="mutateAction('${t.id}',${idx}, 'pic', this.value)" class="bg-white border border-gray-200 rounded-lg px-2 py-0.5 font-bold text-[10px] outline-none">
                          ${teamNicknames.map(n => `<option value="${n}" ${n === act.pic ? 'selected' : ''}>${n}</option>`).join('')}
                        </select>
                        <button onclick="mutateAction('${t.id}', ${idx}, 'isFlagged',${!act.isFlagged})" class="text-xs font-bold ${act.isFlagged ? 'text-rose-600' : 'text-gray-400'} ios-press">⚑</button>
                      </div>
                    </div>

                    ${act.isFlagged ? `
                      <div class="flex items-center justify-between p-2 rounded-xl bg-white border border-rose-200 text-[11px] gap-2">
                        <span class="text-rose-700 font-bold truncate">🚨 ${act.blocker || 'Kendala pengerjaan aktif'}</span>
                        <button onclick="pingWA('${t.title}', '${act.text}', '${act.pic}')" class="px-2 py-0.5 bg-emerald-600 text-white font-bold rounded text-[10px] ios-press flex-shrink-0">Eskalasi WA</button>
                      </div>
                    ` : ''}

                    <div class="flex items-center justify-between text-[11px] text-gray-500 pt-1 border-t border-gray-200/50">
                      <div class="flex items-center space-x-2">
                        <span class="font-mono font-bold text-gray-700" id="timer-${t.id}-${idx}">${formatTime(act.timer || 0)}</span>
                        <button onclick="toggleActionTimer('${t.id}',${idx})" class="px-2 py-0.5 rounded text-[10px] font-bold text-white ${act.running ? 'bg-amber-500' : 'bg-emerald-600'} ios-press">
                          ${act.running ? 'Pause' : 'Start'}
                        </button>
                      </div>
                      <div class="flex items-center space-x-1">
                        <span>Rev: <b class="text-gray-800">${act.revisions || 0}x</b></span>
                        <button onclick="mutateAction('${t.id}', ${idx}, 'revisions',${(act.revisions || 0) + 1})" class="w-4 h-4 bg-gray-200 rounded font-bold leading-none">+</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderGantt() {
      const container = document.getElementById('ganttContent');
      const pillBox = document.getElementById('ganttCapacityPills');
      const load = {};
      teamNicknames.forEach(n => load[n] = 0);
      AppState.tasks.forEach(t => t.actions.forEach(a => { if (!a.done) load[a.pic] = (load[a.pic] || 0) + (a.duration || 2); }));

      pillBox.innerHTML = Object.keys(load).filter(n => load[n] > 0).map(n => `
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${load[n] >= 7 ? 'bg-rose-100 text-rose-800 animate-pulse' : 'bg-emerald-50 text-emerald-800'}">
          ${n}: ${load[n]}d ${load[n] >= 7 ? '⚠️ Overload' : ''}
        </span>
      `).join('');

      let html = `<div class="min-w-[700px] text-xs">
        <div class="flex border-b border-gray-200 pb-2 font-bold text-gray-400">
          <div class="w-48 pl-2">PROJECT</div>
          <div class="flex-1 flex justify-around"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
        </div>`;

      AppState.tasks.forEach(t => {
        html += `
          <div class="flex items-center py-3 border-b border-gray-100">
            <div class="w-48 pl-2 font-bold text-gray-900 truncate">${t.title}</div>
            <div class="flex-1 flex justify-around">
              ${[0,1,2,3,4].map(i => {
                const h = t.parentDailyHours?.[i];
                return `
                  <div class="gantt-col-cell gantt-cell-container">
                    <span class="inline-block px-2 py-0.5 rounded-lg font-bold text-[10px] ${h ? 'bg-emerald-100 text-emerald-800 cursor-pointer' : 'text-gray-300'}">${h \vert{}\vert{} '-'}</span>${h ? `<div class="gantt-popover bg-gray-900 text-white rounded-xl p-3 w-56 text-left shadow-2xl text-[11px]"><div class="font-bold">${t.title}</div><div class="text-gray-400 mt-1">${t.actions.map(a => a.text).join('<br>')}</div></div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html + `</div>`;
    }

    function renderOverview() {
      let total = 0, done = 0, blockers = 0;
      AppState.tasks.forEach(t => {
        total += t.actions.length;
        done += t.actions.filter(a => a.done).length;
        if (t.actions.some(a => a.isFlagged)) blockers++;
      });
      document.getElementById('ovTotal').innerText = total;
      document.getElementById('ovDone').innerText = done;
      document.getElementById('ovBlockers').innerText = blockers;
      document.getElementById('ovScore').innerText = total ? `${Math.round((done / total) * 100)}%` : '0%';
    }

    // --- MUTASI DATA OTOMATIS ---
    function mutateAction(taskId, actionIndex, key, val) {
      const t = AppState.tasks.find(x => x.id === taskId);
      if (t && t.actions[actionIndex]) {
        t.actions[actionIndex][key] = val;
        if (key === 'done' && val) playSound('done');
        else playSound('tick');
        commitState();
      }
    }

    function toggleActionTimer(taskId, actionIndex) {
      const t = AppState.tasks.find(x => x.id === taskId);
      if (t && t.actions[actionIndex]) {
        t.actions[actionIndex].running = !t.actions[actionIndex].running;
        playSound('tick');
        commitState();
      }
    }

    function toggleCapsule(id) {
      playSound('tick');
      if (AppState.expandedCardIds.has(id)) AppState.expandedCardIds.delete(id);
      else AppState.expandedCardIds.add(id);
      renderCapsules();
    }

    function setViewMode(mode) {
      AppState.viewMode = mode;
      playSound('tick');
      ['capsules', 'gantt', 'overview'].forEach(m => {
        document.getElementById(`${m}View`).classList.toggle('hidden', m !== mode);
        const btn = document.getElementById(`mBtn-${m}`);
        if (btn) btn.className = m === mode ? "w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl bg-gray-100 text-gray-900 font-bold transition ios-press" : "w-full flex items-center space-x-2.5 px-3 py-2 rounded-2xl text-gray-600 hover:bg-gray-50 transition ios-press";
      });
      renderActiveView();
    }

    function setDeptFilter(d) {
      AppState.deptFilter = d;
      playSound('tick');
      document.querySelectorAll('.df-btn').forEach(b => b.className = b.dataset.val === d ? "df-btn px-3.5 py-1 rounded-full bg-black text-white ios-press" : "df-btn px-3.5 py-1 rounded-full bg-white text-gray-700 border border-gray-200 ios-press");
      renderCapsules();
    }

    function setStatusFilter(s) {
      AppState.statusFilter = s;
      playSound('tick');
      document.querySelectorAll('.sf-btn').forEach(b => b.className = b.dataset.val === s ? "sf-btn px-3 py-1 rounded-full bg-white text-gray-900 shadow-xs ios-press font-bold" : "sf-btn px-3 py-1 rounded-full text-gray-600 ios-press");
      renderCapsules();
    }

    // --- COMMAND PALETTE (CMD+K) ---
    function openCommandPalette() {
      document.getElementById('cmdPaletteModal').classList.remove('hidden');
      document.getElementById('cmdInput').value = '';
      renderCommandResults('');
      setTimeout(() => document.getElementById('cmdInput').focus(), 50);
    }

    function renderCommandResults(q) {
      const query = (q || '').toLowerCase().trim();
      const resEl = document.getElementById('cmdResults');
      let html = '';

      const actions = [
        { label: "Buka Capsules View", fn: "setViewMode('capsules')" },
        { label: "Buka Timeline Gantt", fn: "setViewMode('gantt')" },
        { label: "Buka Dept Overview", fn: "setViewMode('overview')" },
        { label: "+ Buat Task Baru", fn: "openNewTaskModal()" }
      ];

      actions.filter(a => a.label.toLowerCase().includes(query)).forEach(a => {
        html += `<div onclick="${a.fn}; document.getElementById('cmdPaletteModal').classList.add('hidden');" class="p-2 rounded-xl hover:bg-gray-100 cursor-pointer font-bold text-gray-800">${a.label}</div>`;
      });

      AppState.tasks.filter(t => t.title.toLowerCase().includes(query)).forEach(t => {
        html += `<div onclick="setViewMode('capsules'); AppState.expandedCardIds.add('${t.id}'); renderCapsules(); document.getElementById('cmdPaletteModal').classList.add('hidden');" class="p-2 rounded-xl hover:bg-blue-50 cursor-pointer text-blue-900 font-bold border-t border-gray-50">${t.title} (${t.dept})</div>`;
      });

      resEl.innerHTML = html || `<div class="p-3 text-center text-gray-400 italic">Tidak ada aksi yang cocok.</div>`;
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCommandPalette(); }
      if (e.key === 'Escape') {
        document.getElementById('cmdPaletteModal').classList.add('hidden');
        document.getElementById('newTaskModal').classList.add('hidden');
        document.getElementById('userModal').classList.add('hidden');
      }
    });

    // --- TASK BARU ---
    function openNewTaskModal() {
      document.getElementById('npPic').innerHTML = teamNicknames.map(n => `<option value="${n}">${n}</option>`).join('');
      document.getElementById('newTaskModal').classList.remove('hidden');
    }
    function closeNewTaskModal() { document.getElementById('newTaskModal').classList.add('hidden'); }
    function submitNewTask() {
      const title = document.getElementById('npTitle').value.trim();
      if (!title) return alert("Judul wajib diisi.");
      AppState.tasks.unshift({
        id: "tsk-" + Date.now(),
        dept: document.getElementById('npDept').value,
        title, pic: document.getElementById('npPic').value,
        actions: [{ text: "Eksekusi Utama", pic: document.getElementById('npPic').value, dueDate: "2026-10-22", duration: 2, done: false, isFlagged: false, revisions: 0, timer: 0, running: false, link: "" }]
      });
      commitState();
      closeNewTaskModal();
      showToast("Task berhasil dibuat.");
    }

    // --- LIVE KPI GOOGLE SHEET AUTO SYNC ---
    async function loadLiveKpi(roleName) {
      const tbody = document.getElementById('kpiTableBody');
      tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400 italic">Sinkronisasi KPI Google Sheet...</td></tr>`;
      try {
        const res = await fetch(`${KPI_SHEET_URL}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(roleName)}&t=${Date.now()}`);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
        tbody.innerHTML = json.table.rows.filter(r => r.c && r.c[0]?.v && !String(r.c[0].v).toLowerCase().includes("total")).map(r => `
          <tr class="hover:bg-gray-50">
            <td class="py-2 font-bold text-gray-800">${r.c[0]?.v || ''}</td>
            <td class="py-2 text-blue-600 font-bold">${r.c[2]?.f || r.c[2]?.v || ''}</td>
            <td class="py-2">${r.c[3]?.f || r.c[3]?.v || '-'}</td>
            <td class="py-2"><span class="px-2 py-0.5 rounded bg-gray-100 font-bold">${r.c[4]?.f || r.c[4]?.v || '0'}</span></td>
            <td class="py-2 font-bold text-emerald-700">${r.c[5]?.f || r.c[5]?.v || '0%'}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400 italic">Data spreadsheet siap disinkronkan.</td></tr>`;
      }
    }

    function openUserProfileModal(userKey) {
      document.getElementById('uModalAvatar').innerHTML = getAvatarBadge(userKey, "w-10 h-10 text-xl");
      document.getElementById('uModalName').innerText = userKey;
      const role = USER_ROLE_SHEET_MAP[userKey] || "PROJECT MANAGER";
      document.getElementById('uModalRole').innerText = role;
      document.getElementById('kpiRoleBadge').innerText = role;

      const subtasks = [];
      AppState.tasks.forEach(t => t.actions.forEach((a, i) => {
        if (a.pic === userKey) subtasks.push(`
          <div class="p-2 bg-gray-50 rounded-xl flex items-center justify-between">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" ${a.done ? 'checked' : ''} onchange="mutateAction('${t.id}', ${i}, 'done', this.checked); openUserProfileModal('${userKey}');" class="apple-check">
              <span class="${a.done ? 'line-through text-gray-400' : 'text-gray-800'}">[${t.dept}] ${a.text}</span>
            </label>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${a.done ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${a.done ? 'Done' : 'Active'}</span>
          </div>
        `);
      }));
      document.getElementById('uSubtaskList').innerHTML = subtasks.join('') || '<div class="text-gray-400 italic">Tidak ada task aktif.</div>';
      loadLiveKpi(role);
      document.getElementById('userModal').classList.remove('hidden');
    }
    function openKpiScorecardModal() { openUserProfileModal(AppState.activeUserKey); }
    function closeUserModal() { document.getElementById('userModal').classList.add('hidden'); }

    function promptUserPinLogin() {
      const nick = prompt("Login sebagai Nickname (" + teamNicknames.slice(0, 4).join('/') + "):", AppState.activeUserKey);
      if (!nick) return;
      const pin = prompt(`Masukkan 4 digit PIN:`);
      if (pin === "1111" || pin === "2222") {
        AppState.activeUserKey = nick;
        commitState();
        closeUserModal();
        showToast(`Login sebagai ${nick}`);
      } else {
        alert("PIN salah.");
      }
    }

    function pingWA(pTitle, aText, pic) {
      window.open(`https://wa.me/?text=${encodeURIComponent(`🚨 *BLOCKER OPERASIONAL*\nProject: ${pTitle}\nTask: ${aText}\nPIC:${pic}\nMohon tindak lanjut segera.`)}`, '_blank');
    }

    function copyWAStandup() {
      let msg = "*DAILY OPERATIONS STANDUP UPDATE*\n\n";
      AppState.tasks.forEach((t, i) => {
        const done = t.actions.filter(a => a.done).length;
        msg += `*${i + 1}. [${t.dept}] ${t.title}* (${Math.round((done / t.actions.length) * 100)}%)\n`;
        t.actions.forEach(a => msg += `  ${a.done ? '✓' : '•'} ${a.text} (${a.pic})\n`);
        msg += '\n';
      });
      navigator.clipboard.writeText(msg).then(() => showToast("Laporan disalin ke clipboard!"));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2000);
    }

    // --- AUTO SINKRONISASI SHEET DATABASE TEAM ---
    async function syncTeamNicknames() {
      try {
        const res = await fetch(`${TEAM_DB_URL}/gviz/tq?tqx=out:json&sheet=DATABASE TEAM CTS&t=${Date.now()}`);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
        const names = json.table.rows.map(r => r.c?.[2]?.v ? String(r.c[2].v).trim().replace("*", "") : null).filter(Boolean);
        if (names.length) teamNicknames = Array.from(new Set(names));
      } catch (e) {}
      renderNavAndSidebar();
    }

    document.addEventListener("DOMContentLoaded", () => {
      syncTeamNicknames();
      renderActiveView();
    });
  </script>
</body>
</html>
