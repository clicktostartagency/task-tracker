<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Operations Hub - Apple Pro Edition</title>
  <style>
    :root {
      --apple-canvas: #f2f2f7;
      --apple-card: #ffffff;
      --apple-card-inset: rgba(0, 0, 0, 0.025);
      --apple-text: #1d1d1f;
      --apple-secondary: #86868b;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-specular: rgba(255, 255, 255, 0.9);
      --apple-sidebar: rgba(246, 246, 248, 0.88);
      --apple-header: rgba(255, 255, 255, 0.85);
      --apple-funnel-canvas: #edf5fa;
      --apple-blue: #0071e3;
      --apple-green: #34c759;
      --apple-red: #ff3b30;
      --apple-orange: #ff9500;
      --apple-purple: #af52de;
      --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dark {
      --apple-canvas: #000000;
      --apple-card: #1c1c1e;
      --apple-card-inset: rgba(255, 255, 255, 0.04);
      --apple-text: #f5f5f7;
      --apple-secondary: #8e8e93;
      --apple-border: rgba(255, 255, 255, 0.12);
      --apple-border-specular: rgba(255, 255, 255, 0.12);
      --apple-sidebar: rgba(246, 246, 248, 0.88);
      --apple-header: rgba(20, 20, 22, 0.85);
      --apple-funnel-canvas: #121c26;
      --apple-blue: #2997ff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: -0.021em;
    }
    body {
      background-color: var(--apple-canvas);
      color: var(--apple-text);
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .apple-sidebar-frame {
      width: 240px;
      height: 100%;
      background: var(--apple-sidebar);
      backdrop-filter: blur(50px) saturate(220%);
      border-right: 0.5px solid var(--apple-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s var(--apple-spring);
      z-index: 20;
    }
    .apple-sidebar-frame.collapsed { width: 72px; }
    .apple-sidebar-frame.collapsed .hide-collapsed { display: none !important; }

    .apple-traffic-lights {
      padding: 1.15rem 1rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .traffic-dots { display: flex; gap: 7px; }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .nav-group { padding: 0 0.5rem; display: flex; flex-direction: column; gap: 3px; }
    .apple-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .apple-nav-item:hover { background: rgba(0, 0, 0, 0.04); color: var(--apple-text); }
    .dark .apple-nav-item:hover { background: rgba(255, 255, 255, 0.06); }
    .apple-nav-item.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
      font-weight: 600;
    }
    .nav-badge {
      font-family: -apple-system, monospace;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: var(--apple-secondary);
    }
    .active .nav-badge { background: var(--apple-blue); color: #ffffff; }

    .slack-unread-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--apple-orange);
      box-shadow: 0 0 6px rgba(255, 149, 0, 0.6);
      flex-shrink: 0;
    }

    .apple-canvas-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--apple-canvas);
      position: relative;
    }
    .apple-navbar-header {
      height: 52px;
      background: var(--apple-header);
      backdrop-filter: blur(40px) saturate(200%);
      border-bottom: 0.5px solid var(--apple-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      flex-shrink: 0;
      z-index: 15;
    }
    .apple-canvas-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .macos-segmented-bar {
      position: relative;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      align-items: center;
      border: 0.5px solid var(--apple-border);
    }
    .dark .macos-segmented-bar { background: rgba(255, 255, 255, 0.08); }
    .seg-pill-bg {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 3);
      background: var(--apple-card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      transition: transform 0.28s var(--apple-spring);
      z-index: 1;
    }
    .seg-btn {
      position: relative;
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      background: transparent;
      border: none;
      color: var(--apple-secondary);
      cursor: pointer;
      z-index: 2;
      transition: color 0.18s ease;
    }
    .seg-btn.active { color: var(--apple-text); }

    .apple-card-box {
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 6px 18px rgba(0, 0, 0, 0.025), inset 0 1px 0 var(--apple-border-specular);
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: all 0.25s var(--apple-spring);
    }

    .card-collapsible-header {
      padding: 1.1rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .card-collapsible-header:hover { background-color: rgba(0, 0, 0, 0.015); }
    .dark .card-collapsible-header:hover { background-color: rgba(255, 255, 255, 0.02); }
    
    .card-body-drawer {
      padding: 0 1.35rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      border-top: 0.5px solid var(--apple-border);
    }
    .card-body-drawer.collapsed { display: none !important; }
    .chevron-icon {
      width: 14px;
      height: 14px;
      color: var(--apple-secondary);
      transition: transform 0.25s var(--apple-spring);
    }
    .chevron-icon.rotate { transform: rotate(180deg); }

    .apple-pill-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card);
      color: var(--apple-text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .apple-pill-btn:hover { background: rgba(0, 0, 0, 0.03); }
    .dark .apple-pill-btn:hover { background: rgba(255, 255, 255, 0.08); }
    
    .apple-btn-primary {
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--apple-blue);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .apple-btn-primary:active { opacity: 0.85; }

    .header-client-dropdown {
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card-inset);
      font-size: 11px;
      font-weight: 600;
      color: var(--apple-blue);
      padding: 3px 8px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      max-width: 140px;
    }

    .inline-editable {
      cursor: text;
      border-radius: 4px;
      padding: 2px 5px;
      transition: background 0.15s ease;
    }
    .inline-editable:hover { background: rgba(0, 113, 227, 0.1); }
    .inline-editable:focus {
      outline: 1.5px solid var(--apple-blue);
      background: var(--apple-card);
    }

    .notion-breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--apple-secondary);
      padding: 0.75rem 1.25rem 0.25rem;
      font-weight: 500;
    }
    .notion-breadcrumb-item { cursor: pointer; transition: color 0.12s ease; }
    .notion-breadcrumb-item:hover { color: var(--apple-text); }
    .notion-breadcrumb-active { color: var(--apple-text); font-weight: 600; }

    .notion-properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      padding: 0.5rem 1.25rem 0.85rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 11px;
    }
    .notion-prop-cell { display: flex; flex-direction: column; gap: 2px; }
    .notion-prop-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }

    .apple-stepper-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 1rem;
      border-bottom: 0.5px solid var(--apple-border);
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      min-width: 80px;
    }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-family: -apple-system, monospace;
      transition: all 0.2s ease;
    }
    .step-dot.done { background: var(--apple-blue); color: #ffffff; }
    .step-dot.active { border: 2.5px solid var(--apple-blue); color: var(--apple-blue); background: var(--apple-card); }
    .step-dot.pending { background: rgba(0, 0, 0, 0.06); color: var(--apple-secondary); }
    .dark .step-dot.pending { background: rgba(255, 255, 255, 0.1); }
    
    .step-connector {
      flex: 1;
      height: 2px;
      margin: 0 10px;
      border-radius: 2px;
      margin-bottom: 22px;
    }
    .step-connector.active { background: var(--apple-blue); }
    .step-connector.pending { background: rgba(0, 0, 0, 0.08); }
    .dark .step-connector.pending { background: rgba(255, 255, 255, 0.12); }

    .tracklist-header {
      display: flex;
      align-items: center;
      padding: 0.55rem 1.25rem;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 9px;
      font-weight: 700;
      color: var(--apple-secondary);
      text-transform: uppercase;
      font-family: -apple-system, monospace;
    }
    
    .tracklist-item {
      display: flex;
      align-items: center;
      border-bottom: 0.5px solid var(--apple-border);
      font-size: 12px;
      padding: 0.75rem 1.25rem;
      transition: background-color 0.15s ease;
    }

    .apple-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #d1d1d6;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .apple-checkbox:checked { background: var(--apple-blue); border-color: var(--apple-blue); }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 7.5px;
      border: solid white;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .smart-filter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--apple-card);
      border: 0.5px solid var(--apple-border);
      border-radius: 14px;
      padding: 8px 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-pills-wrap { display: flex; align-items: center; gap: 6px; }
    .filter-tab-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--apple-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-tab-pill.active {
      background: rgba(0, 113, 227, 0.12);
      color: var(--apple-blue);
    }
    .smart-search-input {
      border: 0.5px solid var(--apple-border);
      background: var(--apple-card-inset);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--apple-text);
      outline: none;
      width: 160px;
    }

    .apple-empty-state {
      padding: 3rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--apple-card);
      border: 0.5px dashed var(--apple-border);
      border-radius: 20px;
    }

    .apple-dynamic-island {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(29, 29, 31, 0.95);
      backdrop-filter: blur(25px);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.32s var(--apple-spring);
      z-index: 100;
    }
    .apple-dynamic-island.active { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
    .island-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--apple-green); }

    /* Fitur 3: PIC Avatar Filter Styling */
    .pic-filter-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pic-filter-avatar:hover { transform: scale(1.15); }
    .pic-filter-avatar.active {
      border-color: var(--apple-blue);
      box-shadow: 0 0 8px rgba(0, 113, 227, 0.4);
    }

    /* Fitur 2: Circular SLA Progress Ring */
    .sla-progress-ring-container {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sla-progress-ring-container svg {
      transform: rotate(-90deg);
      width: 26px;
      height: 26px;
    }
    .sla-progress-ring-circle-bg {
      fill: none;
      stroke: var(--apple-border);
      stroke-width: 3;
    }
    .sla-progress-ring-circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s ease, stroke 0.35s ease;
    }
  </style>
</head>
<body>

  <div id="dynamic-island" class="apple-dynamic-island">
    <span class="island-dot"></span>
    <span id="island-message">Agency Operations Connected</span>
  </div>

  <!-- SIDEBAR -->
  <aside id="app-sidebar" class="apple-sidebar-frame">
    <div class="apple-traffic-lights">
      <div class="traffic-dots">
        <span class="dot dot-red" onclick="toggleSidebar()"></span>
        <span class="dot dot-yellow" onclick="toggleAllCardsCollapse()"></span>
        <span class="dot dot-green" onclick="toggleFullscreen()"></span>
      </div>
      <button onclick="toggleSidebar()" class="hide-collapsed" style="background: none; border: none; cursor: pointer; color: var(--apple-secondary);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
      </button>
    </div>

    <nav class="nav-group">
      <button onclick="switchTab('projects')" id="tabBtn-projects" class="apple-nav-item active">
        <span class="nav-badge">01</span>
        <span class="hide-collapsed">Projects &amp; Stepper</span>
      </button>
      <button onclick="switchTab('home')" id="tabBtn-home" class="apple-nav-item">
        <span class="nav-badge">02</span>
        <span class="hide-collapsed">Home &amp; Funnels</span>
      </button>
      <button onclick="switchTab('timeline')" id="tabBtn-timeline" class="apple-nav-item">
        <span class="nav-badge">03</span>
        <span class="hide-collapsed">Timeline Gantt</span>
      </button>
    </nav>
  </aside>

  <!-- WORKSPACE -->
  <div class="apple-canvas-area">
    <header class="apple-navbar-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button onclick="toggleSidebar()" style="background: none; border: none; cursor: pointer; color: var(--apple-secondary); display: flex; align-items: center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        
        <div class="macos-segmented-bar" style="width: 320px;">
          <div id="segPill" class="seg-pill-bg"></div>
          <button onclick="switchTab('projects')" id="segBtn-projects" class="seg-btn active">Projects</button>
          <button onclick="switchTab('home')" id="segBtn-home" class="seg-btn">Funnels</button>
          <button onclick="switchTab('timeline')" id="segBtn-timeline" class="seg-btn">Timeline</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- Fitur 6: Sound Mute / Unmute Control -->
        <button onclick="toggleSoundEngine()" id="sound-toggle-btn" class="apple-pill-btn font-mono" title="Mute / Unmute Sound Effects">🔊 Sound: ON</button>
        <button onclick="toggleAllCardsCollapse()" class="apple-pill-btn">Summary</button>
        <button onclick="toggleTheme()" class="apple-pill-btn font-mono">THEME</button>
      </div>
    </header>

    <div class="apple-canvas-content">
      <div id="view-projects" style="display: flex; flex-direction: column; gap: 1.25rem;"></div>
      <div id="view-home" style="display: none; flex-direction: column; gap: 1.25rem;"></div>
      <div id="view-timeline" style="display: none; flex-direction: column; gap: 1.25rem;"></div>
    </div>
  </div>

  <script>
    // ========================================================
    // APPLE AUDIO ENGINE DENGAN FITUR 6 (SOUND TOGGLE / MUTE)
    // ========================================================
    let audioCtx = null;

    function playAppleSound(type = 'click') {
      if (APP_STATE.isMuted) return; // Silent mode jika di-mute

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 'tab' || type === 'switch') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.035);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === 'done') {
          [880, 1320].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (idx * 0.04));
            gain.gain.setValueAtTime(0.15, now + (idx * 0.04));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.04) + 0.14);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + (idx * 0.04));
            osc.stop(now + (idx * 0.04) + 0.14);
          });
        } else if (type === 'delete') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {}
    }

    // Fitur 6: Toggle Mute Audio
    function toggleSoundEngine() {
      APP_STATE.isMuted = !APP_STATE.isMuted;
      localStorage.setItem('agency_sound_muted', APP_STATE.isMuted ? 'true' : 'false');
      const btn = document.getElementById('sound-toggle-btn');
      if (btn) btn.innerText = APP_STATE.isMuted ? '🔇 Sound: OFF' : '🔊 Sound: ON';
      if (!APP_STATE.isMuted) playAppleSound('done');
      triggerDynamicIsland(APP_STATE.isMuted ? 'Audio Effects Muted' : 'Audio Effects Active (+50%)');
    }

    function triggerDynamicIsland(msg) {

    // Fitur 2: Hitung Status Warna SLA Ring
    function getSlaRingStatus(slaISO) {
      if (!slaISO) return { color: "var(--apple-green)", pct: 100, text: "Normal" };
      const diff = new Date(slaISO).getTime() - Date.now();
      const hours = diff / (1000 * 60 * 60);
      if (hours <= 0) return { color: "var(--apple-red)", pct: 100, text: "Breached" };
      if (hours <= 48) return { color: "var(--apple-orange)", pct: 75, text: "Due Soon (<48h)" };
      return { color: "var(--apple-green)", pct: 35, text: "On Track" };
    }

    // Fitur 3: Filter PIC Switcher
    function setPicFilter(pic) {
      APP_STATE.projectFilterPic = pic;

    function setProjectStatusFilter(st) {
      APP_STATE.projectFilterStatus = st;
      playAppleSound('switch');
      renderProjectsView();
    }

    function handleProjectSearch(val) {
      APP_STATE.projectSearchQuery = val;
      renderProjectsView();
    }

    function commitProjectClientName(pIdx, newName) {
      const clean = newName.trim();
      if (!clean) return;
      APP_STATE.projects[pIdx].clientName = clean;
      if (!APP_STATE.clientList.includes(clean)) {
        APP_STATE.clientList.push(clean);
      }
      playAppleSound('click');
      syncState(`Project renamed to ${clean}`);
    }

    function changeProjectClientDropdown(pIdx, val) {
      playAppleSound('click');
      if (val === '__NEW_PROMPT__') {
        const custom = prompt("Tulis nama client baru:");
        if (custom && custom.trim()) {
          commitProjectClientName(pIdx, custom.trim());
        }
      } else {
        APP_STATE.projects[pIdx].clientName = val;
        syncState(`Client set to ${val}`);
      }
    }

    function toggleProjectCreator(isOpen) {
      APP_STATE.isCreatorOpen = Boolean(isOpen);
      playAppleSound('click');
      renderProjectsView();
    }

    function handleClientDropdownSelect(val) {
      playAppleSound('click');
      const customInput = document.getElementById('np-client-custom');
      if (!customInput) return;
      if (val === '__NEW__') {
        customInput.value = '';
        customInput.placeholder = 'Ketik nama client baru...';
        customInput.focus();
      } else {
        customInput.value = val;
      }
    }

    function commitNewIndependentProject() {
      const selectEl = document.getElementById('np-client-select');
      const customEl = document.getElementById('np-client-custom');
      const dropdownVal = selectEl ? selectEl.value : '__NEW__';
      const customVal = customEl ? customEl.value.trim() : '';
      const clientName = (dropdownVal !== '__NEW__' && dropdownVal) ? dropdownVal : (customVal || "Untitled Project");

      const titleEl = document.getElementById('np-task-title');
      const planEl = document.getElementById('np-action-plan');

      const taskTitle = (titleEl && titleEl.value.trim()) ? titleEl.value.trim() : "Kickoff Deliverable";
      const actionPlan = (planEl && planEl.value.trim()) ? planEl.value.trim() : "Deliverable onboarding action plan.";

      if (!APP_STATE.clientList.includes(clientName)) {
        APP_STATE.clientList.push(clientName);
      }

      APP_STATE.projects.unshift({
        id: "proj-" + Date.now(),
        clientName: clientName,
        lead: "Razaan Al-Ghifari",
        category: "Growth Scaling Funnel",
        handoverSlaISO: new Date(Date.now() + 7 * 24 * 3600 * 1000).toISOString(),
        isCollapsed: false,
        stepLabels: ["Brief", "Production", "Review/QA", "Live Scale"],
        actions: [
          {
            id: "act-" + Date.now(),
            text: taskTitle,
            label: "OPERATIONS",
            pic: "Razaan Al-Ghifari",
            duration: "3h 00m",
            deadlineISO: new Date().toISOString(),
            notes: actionPlan,
            unread: true,
            done: false
          }
        ]
      });

      APP_STATE.isCreatorOpen = false;
      playAppleSound('done');
      syncState(`Project [${clientName}] created`);
    }

    function commitStepName(pIdx, sIdx, val) {
      APP_STATE.projects[pIdx].stepLabels[sIdx] = val.trim() || APP_STATE.projects[pIdx].stepLabels[sIdx];
      playAppleSound('click');
      syncState("Step renamed");
    }

    function commitTaskText(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].text = val.trim() || APP_STATE.projects[pIdx].actions[aIdx].text;
      APP_STATE.projects[pIdx].actions[aIdx].unread = false;
      playAppleSound('click');
      syncState("Task updated");
    }

    function commitTaskNotes(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].notes = val.trim();
      playAppleSound('click');
      syncState("Notes updated");
    }

    function commitTaskDuration(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].duration = val.trim() || "2h 00m";
      playAppleSound('click');
      syncState("Duration updated");
    }

    function commitTaskPic(pIdx, aIdx, val) {
      APP_STATE.projects[pIdx].actions[aIdx].pic = val.trim() || APP_STATE.projects[pIdx].lead;
      playAppleSound('click');
      syncState("Assignee updated");
    }

    function toggleTaskDone(pIdx, aIdx) {
      APP_STATE.projects[pIdx].actions[aIdx].done = !APP_STATE.projects[pIdx].actions[aIdx].done;
      APP_STATE.projects[pIdx].actions[aIdx].unread = false;
      playAppleSound(APP_STATE.projects[pIdx].actions[aIdx].done ? 'done' : 'click');
      syncState("Status updated");
    }

    function deleteTask(pIdx, aIdx) {
      APP_STATE.projects[pIdx].actions.splice(aIdx, 1);
      playAppleSound('delete');
      syncState("Task deleted");
    }

    function addNewDeliverable(pIdx) {
      APP_STATE.projects[pIdx].actions.push({
        id: "act-" + Date.now(),
        text: "New Sprint Task",
        label: "CREATIVE",
        pic: APP_STATE.projects[pIdx].lead,
        duration: "2h 30m",
        notes: "Uraian action plan tugas.",
        unread: true,
        done: false
      });
      playAppleSound('click');
      syncState("Task added");
    }

    function toggleProjectCollapse(pIdx) {
      APP_STATE.projects[pIdx].isCollapsed = !APP_STATE.projects[pIdx].isCollapsed;
      playAppleSound('click');
      syncState();
    }

    function toggleAllCardsCollapse() {
      const state = !APP_STATE.projects[0]?.isCollapsed;
      APP_STATE.projects.forEach(p => p.isCollapsed = state);
      playAppleSound('click');
      syncState();
    }

    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      playAppleSound('tab');

      const pill = document.getElementById('segPill');
      const idx = tabId === 'projects' ? 0 : tabId === 'home' ? 1 : 2;
      pill.style.transform = `translateX(${idx * 100}%)`;

      ['projects', 'home', 'timeline'].forEach(t => {
        const view = document.getElementById('view-' + t);
        const btn = document.getElementById('tabBtn-' + t);
        const seg = document.getElementById('segBtn-' + t);
        if (view && btn) {
          if (t === tabId) {
            view.style.display = 'flex';
            btn.classList.add('active');
            if (seg) seg.classList.add('active');
          } else {
            view.style.display = 'none';
            btn.classList.remove('active');
            if (seg) seg.classList.remove('active');
          }
        }
      });
    }

    function toggleSidebar() {
      APP_STATE.sidebarCollapsed = !APP_STATE.sidebarCollapsed;
      document.getElementById('app-sidebar').classList.toggle('collapsed', APP_STATE.sidebarCollapsed);
      playAppleSound('click');
    }

    function toggleTheme() {
      APP_STATE.isDark = !APP_STATE.isDark;
      localStorage.setItem('agency_app_dark', APP_STATE.isDark ? 'true' : 'false');
      document.documentElement.classList.toggle('dark', APP_STATE.isDark);
      playAppleSound('switch');
      triggerDynamicIsland(APP_STATE.isDark ? 'Dark Mode' : 'Light Mode');
    }

    function toggleFullscreen() {
      playAppleSound('click');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    if (APP_STATE.isDark) {
      document.documentElement.classList.add('dark');
    }
    const soundBtn = document.getElementById('sound-toggle-btn');
    if (soundBtn && APP_STATE.isMuted) {
      soundBtn.innerText = '🔇 Sound: OFF';
    }
    renderProjectsView();
  </script>
</body>
</html>
